<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG | Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a;
  --border: #2a2a2a; --accent: #c50cf9;
  --text: #e8e8e8; --text-dim: #666; --text-muted: #3a3a3a;
  --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  --red: #ff4f4f; --green: #39d98a;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { display: flex; flex-direction: column; }

.topbar { display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-nrg { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.12em; }
.brand-divider { width: 1px; height: 13px; background: var(--border); }
.brand-page { font-size: 13px; color: var(--text-dim); }
.back-btn { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border); background: none; color: var(--text-dim); cursor: pointer; text-decoration: none; transition: border-color 0.13s, color 0.13s; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

.main { flex: 1; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px 80px; }
.wrap { width: 100%; max-width: 480px; }

/* loading / not found states */
.state-msg { text-align: center; padding: 60px 0; font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; }


.profile-card { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 5px; overflow: hidden; }

.profile-header { padding: 32px 28px 24px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 22px; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #000; overflow: hidden; border: 2px solid var(--border); flex-shrink: 0; }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.profile-username { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 6px; }
.profile-bio { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin-top: 6px; }
.profile-joined { font-family: var(--mono); font-size: 9px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.08em; }

.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
.profile-stat { padding: 16px 18px; border-right: 1px solid var(--border); text-align: center; }
.profile-stat:last-child { border-right: none; }
.profile-stat-value { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.profile-stat-label { font-family: var(--mono); font-size: 8px; letter-spacing: 0.18em; color: var(--text-muted); text-transform: uppercase; }


.profile-section { padding: 18px 22px; border-bottom: 1px solid var(--border); }
.profile-section:last-child { border-bottom: none; }
.profile-section-title { font-family: var(--mono); font-size: 8px; letter-spacing: 0.22em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
.fav-list { display: flex; flex-wrap: wrap; gap: 8px; }
.fav-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); }

.profile-username.uc-purple  { color: #c50cf9; }
.profile-username.uc-blue    { color: #4f9cf9; }
.profile-username.uc-gold    { color: #f5c518; }
.profile-username.uc-red     { color: #ff4f4f; }
.profile-username.uc-green   { color: #39d98a; }
.profile-username.uc-rainbow { background: linear-gradient(90deg,#f00,#f90,#ff0,#0f0,#09f,#c50cf9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:rainbow-spin 3s linear infinite; }
@keyframes rainbow-spin { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }

.profile-title-tag { display: inline-block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.15em; padding: 2px 8px; border-radius: 2px; margin-top: 4px; }
.profile-title-tag.rarity-common    { color: #666; background: rgba(255,255,255,0.05); border: 1px solid #333; }
.profile-title-tag.rarity-rare      { color: #4f9cf9; background: rgba(79,156,249,0.1); border: 1px solid rgba(79,156,249,0.25); }
.profile-title-tag.rarity-epic      { color: #c50cf9; background: rgba(197,12,249,0.1); border: 1px solid rgba(197,12,249,0.25); }
.profile-title-tag.rarity-legendary { color: #f5c518; background: rgba(245,197,24,0.12); border: 1px solid rgba(245,197,24,0.3); }

.pfp-deco-glow      { box-shadow: 0 0 0 2px #c50cf9, 0 0 14px #c50cf9; animation: pulse-glow 2s ease-in-out infinite; }
.pfp-deco-gold-ring { border: 3px solid #f5c518 !important; box-shadow: 0 0 10px rgba(245,197,24,0.4); }
.pfp-deco-fire-ring { border: 3px solid #f50 !important; animation: fire-glow 1.5s ease-in-out infinite; }
.pfp-deco-rainbow   { animation: rainbow-spin 2s linear infinite; outline: 3px solid #c50cf9; }

.profile-username.uc-rose     { color: #ff6b9d; }
.profile-username.uc-lavender { color: #b57bee; }
.profile-username.uc-orange   { color: #ff4500; }
.profile-username.uc-crimson  { color: #dc143c; }
.profile-username.uc-toxic    { color: #00ff41; }
.profile-username.uc-yellow   { color: #ffe600; }
.profile-username.uc-ice      { color: #e8f4ff; }

.pfp-deco-blue-glow   { box-shadow: 0 0 0 2px #4f9cf9, 0 0 14px #4f9cf9; animation: blue-pulse 2s ease-in-out infinite; }
.pfp-deco-silver-ring { border: 3px solid #aaa !important; box-shadow: 0 0 8px rgba(170,170,170,0.4); }
.pfp-deco-void-ring   { border: 3px solid #fff !important; box-shadow: 0 0 12px rgba(255,255,255,0.15); }
.pfp-deco-diamond     { border: 3px solid #a8d8ea !important; box-shadow: 0 0 8px #a8d8ea, 0 0 20px rgba(168,216,234,0.4); animation: diamond-spin 3s linear infinite; }
@keyframes blue-pulse   { 0%,100%{box-shadow:0 0 0 2px #4f9cf9,0 0 8px #4f9cf9} 50%{box-shadow:0 0 0 2px #4f9cf9,0 0 20px #4f9cf9} }
@keyframes diamond-spin { 0%{filter:hue-rotate(0deg) brightness(1)} 50%{filter:hue-rotate(180deg) brightness(1.4)} 100%{filter:hue-rotate(360deg) brightness(1)} }

.profile-card.theme-crimson { border-top-color: #dc143c; box-shadow: 0 0 30px rgba(220,20,60,0.2); background: #1a0008; }
.profile-card.theme-ocean   { border-top-color: #0077b6; box-shadow: 0 0 30px rgba(0,119,182,0.2); background: #020a14; }
.profile-card.theme-gold    { border-top-color: #f5c518; box-shadow: 0 0 30px rgba(245,197,24,0.2); background: #0d0900; }
.profile-card.theme-sakura  { border-top-color: #ff9db5; box-shadow: 0 0 30px rgba(255,157,181,0.15); background: #1a0a0f; }
.profile-card.theme-glitch  { border-top-color: #0ff; box-shadow: 0 0 8px #0ff, 0 0 16px #f0f; background: #000; animation: glitch-border 0.3s ease-in-out infinite; }
@keyframes glitch-border { 0%,100%{box-shadow:0 0 8px #0ff,0 0 16px #f0f} 50%{box-shadow:0 0 16px #f0f,0 0 24px #0ff} }

@keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 2px #c50cf9,0 0 8px #c50cf9} 50%{box-shadow:0 0 0 2px #c50cf9,0 0 20px #c50cf9} }
@keyframes fire-glow  { 0%,100%{box-shadow:0 0 8px #f50,0 0 16px #f50} 50%{box-shadow:0 0 16px #ff0,0 0 30px #f50} }

.profile-card.theme-neon   { border-top-color: #4f9cf9; box-shadow: 0 0 30px rgba(79,156,249,0.15); }
.profile-card.theme-galaxy { border-top-color: #c50cf9; background: linear-gradient(135deg,#0a0a2a,#1a0a3a); }
.profile-card.theme-fire   { border-top-color: #f50; box-shadow: 0 0 30px rgba(255,85,0,0.2); }
.profile-card.theme-dark   { background: #060606; border-color: #1a1a1a; }

.profile-level-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); margin-top: 5px; }
.profile-level-badge .lvl-num { color: var(--accent); font-weight: 700; }
.xp-bar-wrap { margin-top: 6px; }
.xp-bar-track { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.xp-bar-fill  { height: 100%; background: var(--accent); border-radius: 2px; }


.friend-action-btn { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: background 0.13s, border-color 0.13s, color 0.13s; margin-top: 8px; display: inline-block; }
.friend-action-btn.add    { border: 1px solid var(--accent); color: var(--accent); background: none; }
.friend-action-btn.add:hover { background: rgba(197,12,249,0.1); }
.friend-action-btn.pending  { border: 1px solid var(--border); color: var(--text-muted); background: none; cursor: default; }
.friend-action-btn.friends  { border: 1px solid var(--green); color: var(--green); background: none; cursor: default; }
.friend-action-btn.self     { display: none; }


.search-wrap { width: 100%; max-width: 480px; }
.search-card { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 5px; overflow: hidden; }
.search-header { padding: 20px 22px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.search-title { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: 0.08em; margin-bottom: 4px; }
.search-sub { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }
.search-body { padding: 18px 22px; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--sans); font-size: 13px; padding: 9px 12px; border-radius: 4px; outline: none; transition: border-color 0.15s; }
.search-row input:focus { border-color: var(--accent); }
.search-row input::placeholder { color: var(--text-muted); }
.search-btn { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 9px 16px; border-radius: 4px; border: none; background: var(--accent); color: #000; cursor: pointer; transition: opacity 0.13s; flex-shrink: 0; }
.search-btn:hover:not(:disabled) { opacity: 0.85; }
.search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.search-msg { font-family: var(--mono); font-size: 10px; margin-top: 8px; min-height: 14px; }
.search-msg.error { color: var(--red); }

.results-list { border-top: 1px solid var(--border); }
.result-item { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; text-decoration: none; }
.result-item:last-child { border-bottom: none; }
.result-item:hover { background: var(--surface2); }
.result-av { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #000; overflow: hidden; flex-shrink: 0; }
.result-av img { width: 100%; height: 100%; object-fit: cover; }
.result-info { flex: 1; min-width: 0; }
.result-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-handle { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 1px; }
.result-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.result-level { font-family: var(--mono); font-size: 9px; color: var(--accent); letter-spacing: 0.06em; }
.result-arrow { color: var(--text-muted); font-size: 12px; }


.friends-list { display: flex; flex-direction: column; gap: 6px; }
.friend-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; text-decoration: none; transition: border-color 0.13s; }
.friend-card:hover { border-color: var(--accent); }
.friend-card-av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #000; flex-shrink: 0; overflow: hidden; }
.friend-card-av img { width: 100%; height: 100%; object-fit: cover; }
.friend-card-info { flex: 1; min-width: 0; }
.friend-card-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-card-handle { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 1px; }
.friend-card-level { font-family: var(--mono); font-size: 9px; color: var(--accent); flex-shrink: 0; }
.no-friends { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }

.no-favs { font-family: var(--mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-nrg">NRG</span>
    <div class="brand-divider"></div>
    <span class="brand-page" id="page-label">Profiles</span>
  </div>
  <a class="back-btn" href="javascript:history.back()">&#8592; back</a>
</div>

<div class="main">
  <div class="wrap">
    <div id="search-view" class="search-wrap" style="display:none">
      <div class="search-card">
        <div class="search-header">
          <div class="search-title">Find a Player</div>
          <div class="search-sub">Search by @username or display name</div>
        </div>
        <div class="search-body">
          <div class="search-row">
            <input type="text" id="search-input" placeholder="@username or name">
            <button class="search-btn" id="search-btn">SEARCH</button>
          </div>
          <div class="search-msg" id="search-msg"></div>
        </div>
        <div class="results-list" id="results-list"></div>
      </div>
    </div>

    <div id="state" class="state-msg">loading profile...</div>
    <div class="profile-card" id="profile-card" style="display:none">

      <div class="profile-header">
        <div class="profile-avatar" id="p-avatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="p-name">—</div>
          <div class="profile-username" id="p-username"></div>
          <div id="p-title-tag"></div>
          <div class="profile-level-badge"><span>LEVEL</span><span class="lvl-num" id="p-level">1</span></div>
          <div class="xp-bar-wrap"><div class="xp-bar-track"><div class="xp-bar-fill" id="p-xp-bar" style="width:0%"></div></div></div>
          <div class="profile-bio" id="p-bio"></div>
          <div class="profile-joined" id="p-joined"></div>
          <button class="friend-action-btn" id="friend-btn" style="display:none"></button>
        </div>
      </div>

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-value" id="p-days">—</div>
          <div class="profile-stat-label">Days on NRG</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="p-time">—</div>
          <div class="profile-stat-label" id="p-time-label">Minutes</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="p-favs">0</div>
          <div class="profile-stat-label">Favorites</div>
        </div>
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Favorite Games</div>
        <div class="fav-list" id="p-fav-list"></div>
      </div>

      <div class="profile-section" id="p-friends-section" style="display:none">
        <div class="profile-section-title">Friends <span id="p-friends-count" style="color:var(--text-dim);font-weight:400"></span></div>
        <div class="friends-list" id="p-friends-list"></div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, getDocs, collection, query, where, writeBatch, arrayUnion } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAKPXLTU0z18tsn80JCXJhJ62EEjDl7lqY",
  authDomain:        "nrg-accounts.firebaseapp.com",
  projectId:         "nrg-accounts",
  storageBucket:     "nrg-accounts.firebasestorage.app",
  messagingSenderId: "969467601192",
  appId:             "1:969467601192:web:bd312dd3d58e4b6b7c701d"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const $    = id => document.getElementById(id);
let profileUid = null;

function toDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  if (ts.seconds) return new Date(ts.seconds * 1000);
  return new Date(ts);
}
function formatDate(ts) {
  const d = toDate(ts);
  if (!d || isNaN(d)) return "—";
  return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function daysSince(ts) {
  const d = toDate(ts);
  if (!d || isNaN(d)) return "—";
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
function fmtMinutes(m) {
  if (m < 60)   return { value: m,                  label: "Minutes"  };
  if (m < 1440) return { value: Math.floor(m / 60),  label: "Hours"    };
  return               { value: Math.floor(m / 1440), label: "Days active" };
}


async function setupFriendBtn(targetUid, targetData) {
  const btn = $("friend-btn");
  btn.style.display = "none";

  onAuthStateChanged(auth, async user => {
    if (!user) return;
    if (user.uid === targetUid) return;

    btn.style.display = "inline-block";

    const mySnap = await getDoc(doc(db, "users", user.uid));
    const myData = mySnap.exists() ? mySnap.data() : {};

    if ((myData.friends || []).includes(targetUid)) {
      btn.textContent = "Friends";
      btn.className   = "friend-action-btn friends";
      return;
    }

    const pendingQ = query(collection(db, "friendRequests"),
      where("from", "==", user.uid), where("to", "==", targetUid), where("status", "==", "pending"));
    const pendingSnap = await getDocs(pendingQ);
    if (!pendingSnap.empty) {
      btn.textContent = "Request Sent";
      btn.className   = "friend-action-btn pending";
      return;
    }

    btn.textContent = "Add Friend";
    btn.className   = "friend-action-btn add";
    btn.onclick     = async () => {
      btn.textContent = "...";
      btn.disabled    = true;
      try {
        await addDoc(collection(db, "friendRequests"), {
          from:      user.uid,
          to:        targetUid,
          status:    "pending",
          createdAt: new Date().toISOString()
        });
        btn.textContent = "Request Sent";
        btn.className   = "friend-action-btn pending";
        btn.disabled    = false;
        btn.onclick     = null;
      } catch(e) {
        btn.textContent = "Add Friend";
        btn.disabled    = false;
      }
    };
  });
}


async function loadSearchView() {
  const searchView = $("search-view");
  searchView.style.display = "";

  const btn   = $("search-btn");
  const input = $("search-input");
  const msg   = $("search-msg");
  const list  = $("results-list");

  async function doSearch() {
    const raw = input.value.trim();
    if (!raw) { msg.textContent = "enter a username or name."; msg.className = "search-msg error"; return; }
    btn.disabled    = true;
    btn.textContent = "...";
    msg.textContent = "";
    list.innerHTML  = "";

    try {
      const val = raw.toLowerCase().replace(/^@/, "");
      let uid   = null;

      const unameSnap = await getDoc(doc(db, "usernames", val));
      if (unameSnap.exists()) {
        uid = unameSnap.data().uid;
      }

      if (uid) {
        const userSnap = await getDoc(doc(db, "users", uid));
        if (userSnap.exists()) {
          renderResults([{ uid, ...userSnap.data() }]);
          return;
        }
      }

      msg.textContent = "no user found with that username.";
      msg.className   = "search-msg error";
    } catch(e) {
      msg.textContent = "search failed — try again.";
      msg.className   = "search-msg error";
      console.error(e);
    } finally {
      btn.disabled    = false;
      btn.textContent = "SEARCH";
    }
  }

  function renderResults(users) {
    if (users.length === 0) {
      list.innerHTML = '<div style="padding:16px 22px;font-family:var(--mono);font-size:9px;color:var(--text-muted)">No users found.</div>';
      return;
    }
    list.innerHTML = "";
    users.forEach(u => {
      const name  = u.displayName || u.email?.split("@")[0] || "User";
      const level = u.level || 1;
      const a     = document.createElement("a");
      a.className = "result-item";
      a.href      = "/profiles.html?uid=" + u.uid;

      let avHtml;
      if (u.photoURL && u.photoURL !== "firestore") {
        avHtml = '<img src="' + u.photoURL + '" alt="">';
      } else {
        avHtml = name[0].toUpperCase();
      }

      a.innerHTML =
        '<div class="result-av">' + avHtml + '</div>' +
        '<div class="result-info">' +
          '<div class="result-name">' + name + '</div>' +
          '<div class="result-handle">' + (u.username ? "@" + u.username : "") + '</div>' +
        '</div>' +
        '<div class="result-meta">' +
          '<span class="result-level">LVL ' + level + '</span>' +
          '<span class="result-arrow">&#8594;</span>' +
        '</div>';
      list.appendChild(a);
    });
  }

  btn.addEventListener("click", doSearch);
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
}


async function loadFriendsList(friendUids) {
  const section = $("p-friends-section");
  const list    = $("p-friends-list");
  const count   = $("p-friends-count");

  if (!friendUids || friendUids.length === 0) {
    section.style.display = "";
    list.innerHTML = '<span class="no-friends">no friends yet.</span>';
    count.textContent = "";
    return;
  }

  section.style.display = "";
  count.textContent = "(" + friendUids.length + ")";
  list.innerHTML = "";

  for (const fuid of friendUids) {
    try {
      const snap = await getDoc(doc(db, "users", fuid));
      if (!snap.exists()) continue;
      const f    = snap.data();
      const fname = f.displayName || f.email?.split("@")[0] || "User";
      const a    = document.createElement("a");
      a.className = "friend-card";
      a.href      = "/profiles.html?uid=" + fuid;

      let avHtml;
      if (f.photoURL && f.photoURL !== "firestore") {
        avHtml = '<img src="' + f.photoURL + '" alt="">';
      } else {
        avHtml = fname[0].toUpperCase();
      }

      a.innerHTML =
        '<div class="friend-card-av">' + avHtml + '</div>' +
        '<div class="friend-card-info">' +
          '<div class="friend-card-name">' + fname + '</div>' +
          '<div class="friend-card-handle">' + (f.username ? "@" + f.username : "") + '</div>' +
        '</div>' +
        '<span class="friend-card-level">LVL ' + (f.level || 1) + '</span>';

      list.appendChild(a);
    } catch(e) { continue; }
  }
}

async function loadProfile() {
  const uid = new URLSearchParams(window.location.search).get("uid");
  if (!uid) { $("state").textContent = "no profile found."; return; }
  const labelEl = $("page-label"); if (labelEl) labelEl.textContent = "Profile";

  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (!snap.exists()) { $("state").textContent = "profile not found."; return; }

    const d    = snap.data();
    const name = d.displayName || d.email?.split("@")[0] || "NRG User";


    const av = $("p-avatar");
    if (d.photoURL && d.photoURL !== "firestore") {
      av.innerHTML = '<img src="' + d.photoURL + '" alt="">';
    } else if (d.photoURL === "firestore") {
      av.textContent = name[0].toUpperCase();
    } else {
      av.textContent = name[0].toUpperCase();
    }


    $("p-name").textContent    = name;
    $("p-username").textContent = d.username ? "@" + d.username : "";
    $("p-bio").textContent     = d.bio || "";
    $("p-joined").textContent  = d.createdAt ? "member since " + formatDate(d.createdAt) : "";

    $("p-days").textContent = daysSince(d.createdAt);
    const fmt = fmtMinutes(d.timeSpentMinutes || 0);
    $("p-time").textContent       = fmt.value;
    $("p-time-label").textContent = fmt.label;
    $("p-favs").textContent       = (d.favorites || []).length;

    const favList = $("p-fav-list");
    const favs    = d.favorites || [];
    if (favs.length === 0) {
      favList.innerHTML = '<span class="no-favs">no favorites yet.</span>';
    } else {
      favList.innerHTML = favs.map(g => '<span class="fav-tag">' + g + '</span>').join("");
    }


  const TITLE_ITEMS = {
    title_rookie:   { name: "Rookie",    rarity: "common"    },
    title_gamer:    { name: "Gamer",     rarity: "common"    },
    title_ghost:    { name: "Ghost",     rarity: "common"    },
    title_grinder:  { name: "Grinder",   rarity: "rare"      },
    title_veteran:  { name: "Veteran",   rarity: "rare"      },
    title_shadow:   { name: "Shadow",    rarity: "rare"      },
    title_elite:    { name: "Elite",     rarity: "epic"      },
    title_phantom:  { name: "Phantom",   rarity: "epic"      },
    title_champion: { name: "Champion",  rarity: "epic"      },
    title_legend:   { name: "Legend",    rarity: "epic"      },
    title_goat:     { name: "G.O.A.T",   rarity: "legendary" },
    title_og:       { name: "NRG OG",    rarity: "legendary" },
    title_nrg:      { name: "NRG Elite", rarity: "legendary" },
  };
  const UC_CLASS = { color_purple:"uc-purple", color_blue:"uc-blue", color_rose:"uc-rose", color_lavender:"uc-lavender", color_gold:"uc-gold", color_red:"uc-red", color_green:"uc-green", color_orange:"uc-orange", color_crimson:"uc-crimson", color_toxic:"uc-toxic", color_yellow:"uc-yellow", color_ice:"uc-ice", color_rainbow:"uc-rainbow" };
  const PFP_CLASS = { pfp_glow:"pfp-deco-glow", pfp_blue_glow:"pfp-deco-blue-glow", pfp_silver_ring:"pfp-deco-silver-ring", pfp_gold_ring:"pfp-deco-gold-ring", pfp_void_ring:"pfp-deco-void-ring", pfp_fire_ring:"pfp-deco-fire-ring", pfp_diamond:"pfp-deco-diamond", pfp_rainbow:"pfp-deco-rainbow" };
  const THEME_CLASS = { profile_dark:"theme-dark", profile_neon:"theme-neon", profile_crimson:"theme-crimson", profile_ocean:"theme-ocean", profile_galaxy:"theme-galaxy", profile_gold:"theme-gold", profile_sakura:"theme-sakura", profile_glitch:"theme-glitch", profile_fire:"theme-fire" };

  const equipped = d.equipped || {};

  const unameEl = $("p-username");
  if (equipped.usernameColor && UC_CLASS[equipped.usernameColor]) unameEl.classList.add(UC_CLASS[equipped.usernameColor]);

  const titleEl = $("p-title-tag");
  const t = TITLE_ITEMS[equipped.title];
  if (t) { titleEl.textContent = t.name; titleEl.className = "profile-title-tag rarity-" + t.rarity; }

  const avEl = $("p-avatar");
  if (equipped.pfpDeco && PFP_CLASS[equipped.pfpDeco]) avEl.classList.add(PFP_CLASS[equipped.pfpDeco]);

  const cardEl = $("profile-card");
  if (equipped.profileDeco && THEME_CLASS[equipped.profileDeco]) cardEl.classList.add(THEME_CLASS[equipped.profileDeco]);

  const THRESHOLDS = [0,0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000];
  const xp = d.xp || 0;
  let level = 1;
  for (let i=1;i<THRESHOLDS.length;i++){if(xp>=THRESHOLDS[i])level=i;else break;}
  const cur = THRESHOLDS[level]||0, next = THRESHOLDS[level+1]||(cur+3000);
  const pct = Math.min(100,Math.floor(((xp-cur)/(next-cur))*100));
  $("p-level").textContent = level;
  $("p-xp-bar").style.width = pct + "%";

    $("state").style.display        = "none";
    $("profile-card").style.display = "";

    document.title = "NRG | " + name + (d.username ? " (@" + d.username + ")" : "");
    profileUid = uid;
    setupFriendBtn(uid, d);
    await loadFriendsList(d.friends || []);

  } catch (e) {
    console.error(e);
    $("state").textContent = "failed to load profile.";
  }
}

const uid = new URLSearchParams(window.location.search).get("uid");
if (uid) {
  loadProfile();
} else {
  loadSearchView();
}
