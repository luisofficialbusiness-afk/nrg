<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/nrg-global.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG | Proxy</title>
    <style>

.bottom-sidebar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 14px;
  padding: 10px 18px;

  background: var(--sidebar-bg);
  backdrop-filter: blur(10px);

  border-radius: 40px;
  border: 1px solid var(--sidebar-border);

  z-index: 9999;
}


.nav-icon {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;
  cursor: pointer;

  font-size: 20px;
  color: var(--icon-color);

  transition: background 0.2s ease;
}


.nav-icon:hover {
  background: rgba(255,255,255,0.05);
}


.nav-icon.active {
  background: rgba(255,255,255,0.08);
  color: white;
}
    </style>
</head>

<body style="margin:0; padding:0; background:#0a0f1c; overflow:hidden; font-family:Inter, sans-serif;">


<div style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:calc(100vh - 100px);
">
    <iframe 
        src="/proxy" 
        style="
            width:100%;
            height:100%;
            border:none;
        ">
    </iframe>
</div>

<!-- Bottom Sidebar -->
<div class="bottom-sidebar">
    <div class="nav-icon" data-page="index.html">🏠</div>
    <div class="nav-icon" data-page="games.html">🎮</div>
    <div class="nav-icon" data-page="movies.html">🎬</div>
    <div class="nav-icon" data-page="ai.html">🤖</div>
    <div class="nav-icon" data-page="proxy.html">🌐</div>
     <div class="nav-icon" data-page="music.html">🎵</div>
    <div class="nav-icon" data-page="settings.html">⚙</div>
</div>

</div>
<script>
document.querySelectorAll('.bottom-sidebar .nav-icon').forEach(icon => {

    const currentPage = window.location.pathname.split("/").pop();

    if (icon.dataset.page === currentPage) {
        icon.classList.add("active");
    }

    icon.addEventListener('click', () => {
        const page = icon.dataset.page;
        if (page) {
            window.location.href = "/" + page;
        }
    });

});
</script>
      <script src="index.js"></script>
</body>
</html>
