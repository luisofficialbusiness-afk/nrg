<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sams Proxy | Chat</title>
<script src="index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--surface3:#222;
  --border:#2a2a2a;--accent:#c50cf9;--accent-dim:rgba(197,12,249,0.08);
  --text:#e8e8e8;--text-dim:#666;--text-muted:#3a3a3a;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --red:#ff4f4f;--green:#39d98a;--gold:#f5c518;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Mostly Brand Stuff */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.brand-nrg{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0.12em}
.brand-divider{width:1px;height:13px;background:var(--border)}
.brand-page{font-size:13px;color:var(--text-dim)}
.online-count{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;display:flex;align-items:center;gap:6px}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

/* Main Chat Stuff */
.chat-layout{flex:1;display:flex;overflow:hidden}
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Main Message Stuff */
.messages-wrap{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:2px}
.msg-item{display:flex;align-items:flex-start;gap:10px;padding:6px 20px;transition:background 0.1s;position:relative}
.msg-item:hover{background:var(--surface2)}
.msg-item.own{flex-direction:row}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0;overflow:hidden;cursor:pointer}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-header{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.msg-name{font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
.msg-name:hover{text-decoration:underline}
.msg-handle{font-family:var(--mono);font-size:9px;color:var(--text-dim)}
.msg-time{font-family:var(--mono);font-size:8px;color:var(--text-muted)}
.msg-text{font-size:13px;color:var(--text-dim);line-height:1.6;word-break:break-word}

/* Badges */
.badge{font-family:var(--mono);font-size:7px;letter-spacing:0.12em;padding:2px 6px;border-radius:2px;text-transform:uppercase;font-weight:700;flex-shrink:0}
.badge-admin{background:rgba(255,79,79,0.15);color:#ff4f4f;border:1px solid rgba(255,79,79,0.3)}
.badge-title-common{color:#666;background:rgba(255,255,255,0.05);border:1px solid #333}
.badge-title-rare{color:#4f9cf9;background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.25)}
.badge-title-epic{color:#c50cf9;background:rgba(197,12,249,0.1);border:1px solid rgba(197,12,249,0.25)}
.badge-title-legendary{color:#f5c518;background:rgba(245,197,24,0.12);border:1px solid rgba(245,197,24,0.3)}

/* Username Stuff */
.uc-purple{color:#c50cf9}.uc-blue{color:#4f9cf9}.uc-rose{color:#ff6b9d}.uc-lavender{color:#b57bee}
.uc-gold{color:#f5c518}.uc-red{color:#ff4f4f}.uc-green{color:#39d98a}.uc-orange{color:#ff4500}
.uc-crimson{color:#dc143c}.uc-toxic{color:#00ff41}.uc-yellow{color:#ffe600}.uc-ice{color:#e8f4ff}
.uc-rainbow{background:linear-gradient(90deg,#f00,#f90,#ff0,#0f0,#09f,#c50cf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow-spin 3s linear infinite}
@keyframes rainbow-spin{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}

/* Delete/Deleted Messages */
.msg-delete{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:8px;padding:3px 8px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity 0.1s,color 0.1s,border-color 0.1s}
.msg-item:hover .msg-delete{opacity:1}
.msg-delete:hover{color:var(--red);border-color:var(--red)}

/* Date Dedider */
.date-divider{display:flex;align-items:center;gap:10px;padding:8px 20px;font-family:var(--mono);font-size:8px;color:var(--text-muted);letter-spacing:0.1em}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Input stuff */
.input-bar{flex-shrink:0;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:flex-end}
.input-wrap{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;transition:border-color 0.15s;padding:2px}
.input-wrap:focus-within{border-color:var(--accent)}
.msg-input{width:100%;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;resize:none;max-height:120px;min-height:38px;line-height:1.5}
.msg-input::placeholder{color:var(--text-muted)}
.input-footer{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 6px}
.char-count{font-family:var(--mono);font-size:8px;color:var(--text-muted)}
.char-count.warn{color:var(--red)}
.send-btn{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.12em;padding:10px 18px;border-radius:5px;border:none;background:var(--accent);color:#000;cursor:pointer;flex-shrink:0;transition:opacity 0.13s}
.send-btn:hover:not(:disabled){opacity:0.85}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}

/* Login bar */
.login-bar{flex-shrink:0;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em}
.login-bar a{color:var(--accent);text-decoration:none}
.login-bar a:hover{text-decoration:underline}

.chat-sidebar{width:220px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:8px;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase}
.online-list{flex:1;overflow-y:auto;padding:8px 0}
.online-user{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;transition:background 0.1s;text-decoration:none}
.online-user:hover{background:var(--surface2)}
.ou-av{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0;overflow:hidden}
.ou-av img{width:100%;height:100%;object-fit:cover}
.ou-name{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ou-handle{font-family:var(--mono);font-size:8px;color:var(--text-dim)}

/* Message Shit */
.msg-actions{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;gap:6px;opacity:0;transition:opacity 0.1s}
.msg-item:hover .msg-actions{opacity:1}
.msg-action-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:8px;padding:3px 8px;border-radius:3px;cursor:pointer;transition:color 0.1s,border-color 0.1s}
.msg-action-btn:hover{color:var(--text);border-color:var(--text-dim)}
.msg-action-btn.danger:hover{color:var(--red);border-color:var(--red)}
.msg-edit-wrap{margin-top:6px;display:none}
.msg-edit-wrap.active{display:flex;gap:6px}
.msg-edit-input{flex:1;background:var(--surface2);border:1px solid var(--accent);color:var(--text);font-family:var(--sans);font-size:13px;padding:6px 10px;border-radius:4px;outline:none}
.msg-edit-save{font-family:var(--mono);font-size:8px;font-weight:700;padding:6px 12px;border-radius:3px;border:none;background:var(--accent);color:#000;cursor:pointer}
.msg-edit-cancel{font-family:var(--mono);font-size:8px;padding:6px 10px;border-radius:3px;border:1px solid var(--border);background:none;color:var(--text-muted);cursor:pointer}
.msg-edited{font-family:var(--mono);font-size:8px;color:var(--text-muted);margin-left:4px}

.msg-img{max-width:280px;max-height:200px;border-radius:6px;margin-top:6px;display:block;cursor:pointer;border:1px solid var(--border)}
.msg-img:hover{border-color:var(--accent)}

.input-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px 2px}
.toolbar-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:8px;padding:4px 10px;border-radius:3px;cursor:pointer;transition:color 0.13s,border-color 0.13s;letter-spacing:0.08em}
.toolbar-btn:hover{color:var(--accent);border-color:var(--accent)}
#img-upload-input{display:none}

/* Lightbox stuff */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:zoom-out;display:none}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}

/* Message System */
.msg-system{padding:8px 20px;display:flex;align-items:center;gap:10px}
.msg-system-line{flex:1;height:1px;background:var(--border)}
.msg-system-text{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;white-space:nowrap;padding:0 4px}

/* Mod Panel */
.pinned-bar{flex-shrink:0;padding:8px 20px;border-bottom:1px solid var(--border);background:rgba(197,12,249,0.06);display:none;align-items:center;gap:10px}
.pinned-bar.visible{display:flex}
.pinned-icon{font-size:11px;color:var(--accent);flex-shrink:0}
.pinned-text{font-size:12px;color:var(--text-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned-label{font-family:var(--mono);font-size:8px;color:var(--accent);letter-spacing:0.1em;flex-shrink:0}
.pinned-unpin{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0 2px;transition:color 0.13s}
.pinned-unpin:hover{color:var(--red)}

.slow-mode-bar{flex-shrink:0;padding:5px 20px;border-bottom:1px solid var(--border);background:rgba(79,156,249,0.06);display:none;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;color:#4f9cf9;letter-spacing:0.08em}
.slow-mode-bar.visible{display:flex}

.mod-btn{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.12em;padding:5px 12px;border-radius:3px;border:1px solid var(--red);background:none;color:var(--red);cursor:pointer;transition:background 0.13s;display:none}
.mod-btn.visible{display:block}
.mod-btn:hover{background:rgba(255,79,79,0.1)}


.mod-panel{width:260px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);display:none;flex-direction:column;overflow:hidden}
.mod-panel.open{display:flex}
.mod-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mod-panel-title{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;color:var(--red);text-transform:uppercase}
.mod-close-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;line-height:1;transition:color 0.13s}
.mod-close-btn:hover{color:var(--text)}
.mod-body{flex:1;overflow-y:auto;padding:12px}
.mod-section{margin-bottom:16px}
.mod-section-label{font-family:var(--mono);font-size:7px;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.mod-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 10px;border-radius:4px;outline:none;transition:border-color 0.15s;margin-bottom:6px}
.mod-input:focus{border-color:var(--accent)}
.mod-input::placeholder{color:var(--text-muted)}
.mod-select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:10px;padding:7px 10px;border-radius:4px;outline:none;margin-bottom:6px}
.mod-btn-row{display:flex;gap:6px;flex-wrap:wrap}
.mod-action-btn{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.1em;padding:6px 12px;border-radius:3px;cursor:pointer;transition:background 0.13s,color 0.13s;border:none;flex:1}
.mod-action-btn.red{background:rgba(255,79,79,0.15);color:var(--red)}
.mod-action-btn.red:hover{background:rgba(255,79,79,0.3)}
.mod-action-btn.blue{background:rgba(79,156,249,0.15);color:#4f9cf9}
.mod-action-btn.blue:hover{background:rgba(79,156,249,0.3)}
.mod-action-btn.purple{background:rgba(197,12,249,0.15);color:var(--accent)}
.mod-action-btn.purple:hover{background:rgba(197,12,249,0.3)}
.mod-action-btn.green{background:rgba(57,217,138,0.15);color:var(--green)}
.mod-action-btn.green:hover{background:rgba(57,217,138,0.3)}
.mod-msg{font-family:var(--mono);font-size:9px;margin-top:5px;min-height:12px}
.mod-msg.ok{color:var(--green)}
.mod-msg.err{color:var(--red)}
.mod-sep{height:1px;background:var(--border);margin:12px 0}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-Sams Proxy">Sams Proxy</span>
    <div class="brand-divider"></div>
    <span class="brand-page">Chat</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px"><button class="mod-btn" id="mod-toggle-btn">MOD</button>
  <div class="online-count">
    <span class="online-dot"></span>
    <span id="online-count">0 online</span>
  </div></div>
</div>

<div class="chat-layout">
  <div class="chat-main">
    <div class="pinned-bar" id="pinned-bar"><span class="pinned-icon">&#128204;</span><span class="pinned-label">PINNED</span><span class="pinned-text" id="pinned-text"></span><button class="pinned-unpin" id="pinned-unpin" title="Unpin">&#215;</button></div>
    <div class="slow-mode-bar" id="slow-mode-bar">&#128336; SLOW MODE — <span id="slow-mode-label"></span></div>
    <div class="messages-wrap" id="messages-wrap"></div>
    <div class="input-bar" id="input-bar" style="display:none">
      <div class="input-wrap">
        <div class="input-toolbar">
          <button class="toolbar-btn" id="img-btn">IMG / GIF</button>
          <input type="file" id="img-upload-input" accept="image/*,.gif">
        </div>
        <textarea class="msg-input" id="msg-input" placeholder="say something... (Shift+Enter for new line)" rows="1" maxlength="500"></textarea>
        <div class="input-footer">
          <span class="char-count" id="char-count">0/500</span>
        </div>
      </div>
      <button class="send-btn" id="send-btn">SEND</button>
    </div>
    <div class="login-bar" id="login-bar">
      <a href="/accounts.html">Log in</a> to join the chat
    </div>
  </div>

  <div class="chat-sidebar">
    <div class="sidebar-header">Online Now</div>
    <div class="online-list" id="online-list"></div>
  </div>

  <div class="mod-panel" id="mod-panel">
    <div class="mod-panel-header">
      <span class="mod-panel-title">&#9888; Mod Panel</span>
      <button class="mod-close-btn" id="mod-close-btn">&#215;</button>
    </div>
    <div class="mod-body">

      <div class="mod-section">
        <div class="mod-section-label">System Message</div>
        <input class="mod-input" id="mod-sys-input" placeholder="type announcement..." maxlength="300">
        <div class="mod-btn-row"><button class="mod-action-btn purple" id="mod-sys-send">Send</button></div>
        <div class="mod-msg" id="mod-sys-msg"></div>
      </div>

      <div class="mod-sep"></div>

      <div class="mod-section">
        <div class="mod-section-label">Pin Message</div>
        <input class="mod-input" id="mod-pin-input" placeholder="text to pin..." maxlength="200">
        <div class="mod-btn-row"><button class="mod-action-btn blue" id="mod-pin-btn">Pin</button><button class="mod-action-btn red" id="mod-unpin-btn">Unpin</button></div>
      </div>

      <div class="mod-sep"></div>

      <div class="mod-section">
        <div class="mod-section-label">Slow Mode</div>
        <select class="mod-select" id="mod-slow-select">
          <option value="0">Off</option>
          <option value="1">1 second</option>
          <option value="5">5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="30">30 seconds</option>
          <option value="45">45 seconds</option>
          <option value="60">1 minute</option>
          <option value="3600">1 hour</option>
          <option value="7200">2 hours</option>
          
        </select>
        <div class="mod-btn-row"><button class="mod-action-btn blue" id="mod-slow-btn">Set</button></div>
      </div>

      <div class="mod-sep"></div>

      <div class="mod-section">
        <div class="mod-section-label">User Actions</div>
        <input class="mod-input" id="mod-user-input" placeholder="@username">
        <div class="mod-btn-row">
        </div>
        <select class="mod-select" id="mod-timeout-select" style="margin-top:6px">
          <option value="5">Timeout for 5 min</option>
          <option value="10">Timeout for 10 min</option>
          <option value="30">Timeout for 30 min</option>
          <option value="60">Timeout for 1 hour</option>
          <option value="24">Timeout for 24 hours</option>
        </select>
        <div class="mod-btn-row"><button class="mod-action-btn blue" id="mod-timeout-btn">Timeout</button><button class="mod-action-btn red" id="mod-kick-btn">Kick</button></div>
        <div class="mod-msg" id="mod-user-msg"></div>
      </div>

      <div class="mod-sep"></div>

      <div class="mod-section">
        <div class="mod-section-label">Chat</div>
        <div class="mod-btn-row"><button class="mod-action-btn red" id="mod-clear-btn">Clear All Messages</button></div>
        <div class="mod-msg" id="mod-clear-msg"></div>
      </div>

    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>



<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc,
  collection, addDoc, onSnapshot, query, getDocs, writeBatch,
  orderBy, limit, deleteDoc, serverTimestamp,
  setDoc
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

// Single Firebase project — accounts + chat now live in the same
// Firestore database so request.auth is actually populated on every
// chat read/write (previously the chat side used a separate Firebase
// project with no Auth instance attached, so requests carried no
// login info at all).
const firebaseConfig = {
  apiKey:            "AIzaSyAKPXLTU0z18tsn80JCXJhJ62EEjDl7lqY",
  authDomain:        "nrg-accounts.firebaseapp.com",
  projectId:         "nrg-accounts",
  storageBucket:     "nrg-accounts.firebasestorage.app",
  messagingSenderId: "969467601192",
  appId:             "1:969467601192:web:bd312dd3d58e4b6b7c701d"
};

const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $        = id => document.getElementById(id);
const MAX_MSGS = 100;
const MAX_CHARS = 500;
const RATE_LIMIT_MS = 2000;

let currentUser  = null;
let userProfile  = null;
let isAdmin      = false;
let lastSentAt   = 0;
let onlineRef    = null;

const UC_CLASS = {
  color_purple:"uc-purple",color_blue:"uc-blue",color_rose:"uc-rose",
  color_lavender:"uc-lavender",color_gold:"uc-gold",color_red:"uc-red",
  color_green:"uc-green",color_orange:"uc-orange",color_crimson:"uc-crimson",
  color_toxic:"uc-toxic",color_yellow:"uc-yellow",color_ice:"uc-ice",
  color_rainbow:"uc-rainbow"
};

const TITLE_ITEMS = {
  title_rookie:{name:"Rookie",rarity:"common"},title_gamer:{name:"Gamer",rarity:"common"},
  title_ghost:{name:"Ghost",rarity:"common"},title_grinder:{name:"Grinder",rarity:"rare"},
  title_veteran:{name:"Veteran",rarity:"rare"},title_shadow:{name:"Shadow",rarity:"rare"},
  title_elite:{name:"Elite",rarity:"epic"},title_phantom:{name:"Phantom",rarity:"epic"},
  title_champion:{name:"Champion",rarity:"epic"},title_legend:{name:"Legend",rarity:"epic"},
  title_goat:{name:"G.O.A.T",rarity:"legendary"},title_og:{name:"NRG OG",rarity:"legendary"},
  title_nrg:{name:"NRG Elite",rarity:"legendary"}
};

function fmtTime(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return "Today";
  const yesterday = new Date(Date.now() - 86400000);
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function setAvatar(el, photoURL, name) {
  if (photoURL && photoURL !== "firestore") {
    el.innerHTML = '<img src="' + photoURL + '" alt="">';
  } else {
    el.textContent = (name || "?")[0].toUpperCase();
  }
}

function buildMessage(msg, showDate, canDelete) {
  if (msg.isSystem) {
    const wrapper = document.createElement("div");
    wrapper.dataset.msgWrapper = msg.id;
    const item = document.createElement("div");
    item.className = "msg-system";
    item.dataset.id = msg.id;
    item.innerHTML = '<div class="msg-system-line"></div><span class="msg-system-text">&#9888; ' + escapeHtml(msg.text) + '</span><div class="msg-system-line"></div>';
    if (canDelete) {
      const del = document.createElement("button");
      del.className = "msg-delete"; del.textContent = "delete";
      del.style.cssText = "position:static;opacity:1;margin-left:8px";
      del.addEventListener("click", async () => {
        try { await deleteDoc(doc(db, "messages", msg.id)); } catch(e) {}
      });
      item.appendChild(del);
    }
    wrapper.appendChild(item);
    return wrapper;
  }
  const equipped = msg.equipped || {};
  const ucKey    = equipped.usernameColor;
  const ucClass  = ucKey && UC_CLASS[ucKey] ? UC_CLASS[ucKey] : "";
  const titleKey = equipped.title;
  const titleDef = titleKey && TITLE_ITEMS[titleKey] ? TITLE_ITEMS[titleKey] : null;
  const canEdit  = currentUser && currentUser.uid === msg.uid;

  const adminBadge = msg.isAdmin ? '<span class="badge badge-admin">ADMIN</span>' : "";
  const titleBadge = titleDef   ? '<span class="badge badge-title-' + titleDef.rarity + '">' + titleDef.name + '</span>' : "";
  const nameClass  = ucClass    ? " " + ucClass : "";
  const editedTag  = msg.edited ? '<span class="msg-edited">(edited)</span>' : "";
  const imgHtml    = msg.imageUrl ? '<img class="msg-img" src="' + msg.imageUrl + '" alt="image">' : "";

  const wrapper = document.createElement("div");
  wrapper.dataset.msgWrapper = msg.id;

  if (showDate) {
    const dd = document.createElement("div");
    dd.className = "date-divider";
    dd.textContent = fmtDate(msg.createdAt) || "Today";
    wrapper.appendChild(dd);
  }

  const item = document.createElement("div");
  item.className = "msg-item";
  item.dataset.id = msg.id;
  item.style.position = "relative";
  item.innerHTML =
    '<div class="msg-av" style="position:absolute;left:20px;top:10px;cursor:pointer"></div>' +
    '<div class="msg-body" style="padding-left:42px">' +
      '<div class="msg-header">' +
        '<span class="msg-name' + nameClass + '">' + escapeHtml(msg.displayName || "User") + '</span>' +
        '<span class="msg-handle">' + (msg.username ? "@" + escapeHtml(msg.username) : "") + '</span>' +
        adminBadge + titleBadge +
        '<span class="msg-time">' + fmtTime(msg.createdAt) + '</span>' +
        editedTag +
      '</div>' +
      '<div class="msg-text">' + escapeHtml(msg.text || "") + '</div>' +
      imgHtml +
      '<div class="msg-edit-wrap">' +
        '<input class="msg-edit-input" type="text" maxlength="500">' +
        '<button class="msg-edit-save">Save</button>' +
        '<button class="msg-edit-cancel">Cancel</button>' +
      '</div>' +
    '</div>' +
    '<div class="msg-actions">' +
      (canEdit   ? '<button class="msg-action-btn edit-btn">edit</button>' : '') +
      (canDelete ? '<button class="msg-action-btn danger del-btn">delete</button>' : '') +
    '</div>';

  setAvatar(item.querySelector(".msg-av"), msg.photoURL, msg.displayName);

  item.querySelector(".msg-av").addEventListener("click", () => {
    if (msg.uid) window.open("/profiles.html?uid=" + msg.uid, "_blank");
  });
  item.querySelector(".msg-name").addEventListener("click", () => {
    if (msg.uid) window.open("/profiles.html?uid=" + msg.uid, "_blank");
  });

  if (msg.imageUrl) {
    item.querySelector(".msg-img").addEventListener("click", () => {
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src = msg.imageUrl;
      lb.classList.add("open");
    });
  }

  const editBtn = item.querySelector(".edit-btn");
  if (editBtn) {
    editBtn.addEventListener("click", () => {
      const editWrap = item.querySelector(".msg-edit-wrap");
      const editInput = item.querySelector(".msg-edit-input");
      editInput.value = msg.text || "";
      editWrap.classList.add("active");
    });
    item.querySelector(".msg-edit-cancel").addEventListener("click", () => {
      item.querySelector(".msg-edit-wrap").classList.remove("active");
    });
    item.querySelector(".msg-edit-save").addEventListener("click", async () => {
      const newText = item.querySelector(".msg-edit-input").value.trim();
      if (!newText) return;
      try {
        await updateDoc(doc(db, "messages", msg.id), { text: newText, edited: true });
        item.querySelector(".msg-text").textContent = newText;
        item.querySelector(".msg-edit-wrap").classList.remove("active");
      } catch(e) { console.error(e); }
    });
  }

  const delBtn = item.querySelector(".del-btn");
  if (delBtn) {
    delBtn.addEventListener("click", async () => {
      if (!confirm("Delete this message?")) return;
      try { await deleteDoc(doc(db, "messages", msg.id)); } catch(e) { console.error(e); }
    });
  }

  wrapper.appendChild(item);
  return wrapper;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

let renderedIds  = new Set();
let lastDateShown = "";

function renderMessages(snap) {
  const wrap     = $("messages-wrap");
  const atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;

  snap.docChanges().forEach(change => {
    const msg = { id: change.doc.id, ...change.doc.data() };

    if (change.type === "removed") {
      const el = wrap.querySelector('[data-id="' + msg.id + '"]');
      if (el) { const w = el.parentElement; w ? w.remove() : el.remove(); }
      renderedIds.delete(msg.id);
      return;
    }

    if (change.type === "modified") {
      const el = wrap.querySelector('[data-id="' + msg.id + '"]');
      if (el) {
        if (msg.createdAt) { const te = el.querySelector(".msg-time"); if(te) te.textContent = fmtTime(msg.createdAt); }
        if (msg.text)      { const tx = el.querySelector(".msg-text"); if(tx) tx.textContent = msg.text; }
        const ee = el.querySelector(".msg-edited");
        if (msg.edited && !ee) {
          const te = el.querySelector(".msg-time");
          if (te) { const sp = document.createElement("span"); sp.className="msg-edited"; sp.textContent="(edited)"; te.after(sp); }
        }
      }
      return;
    }

    if (change.type === "added" && !renderedIds.has(msg.id)) {
      renderedIds.add(msg.id);
      const dateStr  = fmtDate(msg.createdAt);
      const showDate = dateStr !== lastDateShown;
      if (showDate && dateStr) lastDateShown = dateStr;
      const canDelete = isAdmin || (currentUser && currentUser.uid === msg.uid);
      const el = buildMessage(msg, showDate, canDelete);
      el.classList.add("msg-wrapper");
      wrap.appendChild(el);
    }
  });

  if (atBottom) wrap.scrollTop = wrap.scrollHeight;
}

function renderOnlineList(users) {
  const list = $("online-list");
  $("online-count").textContent = users.length + " online";
  list.innerHTML = "";
  users.forEach(u => {
    const a = document.createElement("a");
    a.className = "online-user";
    a.href      = "/profiles.html?uid=" + u.uid;
    a.target    = "_blank";

    const av = document.createElement("div");
    av.className = "ou-av";
    setAvatar(av, u.photoURL, u.displayName);

    a.innerHTML =
      '<div><div class="ou-name">' + (u.displayName || "User") + '</div>' +
      '<div class="ou-handle">' + (u.username ? "@" + u.username : "") + '</div></div>';
    a.prepend(av);
    list.appendChild(a);
  });
}

async function sendMessage() {
  const input = $("msg-input");
  const text  = input.value.trim();
  if (!text || !currentUser || !userProfile) return;
  if (text.length > MAX_CHARS) return;

  const now = Date.now();
  const effectiveLimit = Math.max(RATE_LIMIT_MS, slowModeSeconds * 1000);
  if (now - lastSentAt < effectiveLimit) {
    const wait = Math.ceil((effectiveLimit - (now - lastSentAt)) / 1000);
    if (window.NRGNotify) NRGNotify.warning("Slow Mode", "Wait " + wait + "s before sending again.");
    return;
  }
  lastSentAt = now;

  const bannedSnap = await getDoc(doc(db, "chatBanned", currentUser.uid));
  if (bannedSnap.exists()) {
    const b = bannedSnap.data();
    if (b.timeoutUntil && new Date(b.timeoutUntil).getTime() > Date.now()) {
      const mLeft = Math.ceil((new Date(b.timeoutUntil).getTime() - Date.now()) / 60000);
      if (window.NRGNotify) NRGNotify.warning("Timed Out", "You are timed out for " + mLeft + " more minute(s).");
      return;
    } else if (!b.timeoutUntil) {
      if (window.NRGNotify) NRGNotify.warning("Banned", "You are banned from chat.");
      return;
    }
  }

  const equipped = userProfile.equipped || {};
  $("send-btn").disabled = true;
  try {
    await addDoc(collection(db, "messages"), {
      uid:         currentUser.uid,
      username:    userProfile.username    || "",
      displayName: userProfile.displayName || currentUser.email.split("@")[0],
      photoURL:    userProfile.photoURL    || null,
      equipped:    equipped,
      isAdmin:     isAdmin,
      isBanned:    userProfile.isBanned    || false,
      text:        text,
      createdAt:   serverTimestamp()
    });
    input.value = "";
    $("char-count").textContent = "0/" + MAX_CHARS;
    input.style.height = "auto";
    $("messages-wrap").scrollTop = $("messages-wrap").scrollHeight;
  } catch(e) { console.error(e); }
  finally { $("send-btn").disabled = false; }
}

async function registerOnline(user, profile) {
  onlineRef = doc(db, "online", user.uid);
  await setDoc(onlineRef, {
    uid:         user.uid,
    displayName: profile.displayName || user.email.split("@")[0],
    username:    profile.username    || "",
    photoURL:    profile.photoURL    || null,
    lastSeen:    serverTimestamp()
  });
  window.addEventListener("beforeunload", () => {
    if (onlineRef) deleteDoc(onlineRef).catch(() => {});
  });
}


let slowModeSeconds = 0;

function setModMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className   = "mod-msg " + (type === "ok" ? "ok" : "err");
  setTimeout(() => { el.textContent = ""; el.className = "mod-msg"; }, 3000);
}

async function getUidFromUsername(username) {
  const raw  = username.replace(/^@/, "").trim().toLowerCase();
  const snap = await getDoc(doc(db, "usernames", raw));
  return snap.exists() ? snap.data().uid : null;
}

async function sendSystemMessage(text) {
  await addDoc(collection(db, "messages"), {
    uid:         "system",
    username:    "",
    displayName: "NRG System",
    photoURL:    null,
    equipped:    {},

    isSystem:    true,

  });
}

async function setupModPanel() {
  const toggleBtn = $("mod-toggle-btn");
  const panel     = $("mod-panel");
  const closeBtn  = $("mod-close-btn");

  if (!isAdmin) {
    if (toggleBtn) toggleBtn.classList.remove("visible");
    return;
  }
  if (toggleBtn) toggleBtn.classList.add("visible");

  toggleBtn.addEventListener("click", () => panel.classList.toggle("open"));
  closeBtn.addEventListener("click",  () => panel.classList.remove("open"));

  // send system messages
  $("mod-sys-send").addEventListener("click", async () => {
    const text = $("mod-sys-input").value.trim();
    if (!text) return;
    try {
      await sendSystemMessage(text);
      $("mod-sys-input").value = "";
      setModMsg("mod-sys-msg", "message sent!", "ok");
    } catch(e) { setModMsg("mod-sys-msg", "failed.", "err"); }
  });

  // pin messages
  $("mod-pin-btn").addEventListener("click", async () => {
    const text = $("mod-pin-input").value.trim();
    if (!text) return;
    await setDoc(doc(db, "settings", "chat"), { pinnedMessage: text }, { merge: true });
    $("mod-pin-input").value = "";
  });
//unpin button
  $("mod-unpin-btn").addEventListener("click", async () => {
    await setDoc(doc(db, "settings", "chat"), { pinnedMessage: null }, { merge: true });
  });
//unpin messages
  $("pinned-unpin").addEventListener("click", async () => {
    if (!isAdmin) return;
    await setDoc(doc(db, "settings", "chat"), { pinnedMessage: null }, { merge: true });
  });

  // slow-mode-inator
  $("mod-slow-btn").addEventListener("click", async () => {
    const val = parseInt($("mod-slow-select").value);
    await setDoc(doc(db, "settings", "chat"), { slowMode: val }, { merge: true });
  });

  // timeout user (forgot what did does )
  $("mod-timeout-btn").addEventListener("click", async () => {
    const uid  = await getUidFromUsername($("mod-user-input").value);
    if (!uid) { setModMsg("mod-user-msg", "user not found.", "err"); return; }
    const mins = parseInt($("mod-timeout-select").value);
    const until = new Date(Date.now() + mins * 60000).toISOString();
    try {
      await setDoc(doc(db, "chatBanned", uid), { uid, timeoutUntil: until, bannedBy: currentUser.uid });
      await sendSystemMessage("A user has been timed out for " + mins + " minute" + (mins !== 1 ? "s" : "") + ".");
      setModMsg("mod-user-msg", "timed out for " + mins + "m.", "ok");
    } catch(e) { setModMsg("mod-user-msg", "failed.", "err"); }
  });

  // kick user
  $("mod-kick-btn").addEventListener("click", async () => {
    const uid = await getUidFromUsername($("mod-user-input").value);
    if (!uid) { setModMsg("mod-user-msg", "user not found.", "err"); return; }
    try {
      await deleteDoc(doc(db, "online", uid));
      setModMsg("mod-user-msg", "kicked.", "ok");
    } catch(e) { setModMsg("mod-user-msg", "failed.", "err"); }
  });

  // clear messages for no reason 
  $("mod-clear-btn").addEventListener("click", async () => {
    if (!confirm("Delete ALL messages? This cannot be undone.")) return;
    try {
      const snap  = await getDocs(collection(db, "messages"));
      const batch = writeBatch(db);
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      setModMsg("mod-clear-msg", "cleared.", "ok");
    } catch(e) { setModMsg("mod-clear-msg", "failed.", "err"); }
  });
}

onAuthStateChanged(auth, async user => {
  currentUser = user;

  if (!user) {
    sessionStorage.setItem("nrg_chat_redirect", "1");
    window.location.href = "/accounts.html";
    return;
  }

  $("input-bar").style.display = "flex";
  $("login-bar").style.display = "none";

  const [userSnap, adminSnap] = await Promise.all([
    getDoc(doc(db, "users", user.uid)),
    getDoc(doc(db, "admins", user.uid))
  ]);

  userProfile = userSnap.exists() ? userSnap.data() : {};
  isAdmin     = adminSnap.exists();
  setupModPanel();

  if (userProfile.isBanned) {
    $("input-bar").style.display = "none";
    $("login-bar").style.display = "flex";
    $("login-bar").innerHTML     = "Your account has been banned.";
    return;
  }

  await registerOnline(user, userProfile);

  // listen to chat settings (slow mode, pinned message) for every users
  onSnapshot(doc(db, "settings", "chat"), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    slowModeSeconds = d.slowMode || 0;
    const slowBar   = $("slow-mode-bar");
    const slowLabel = $("slow-mode-label");
    if (slowModeSeconds > 0) {
      slowBar.classList.add("visible");
      slowLabel.textContent = slowModeSeconds + (slowModeSeconds >= 60 ? "m wait" : "s wait");
    } else {
      slowBar.classList.remove("visible");
    }
    const pinnedBar  = $("pinned-bar");
    const pinnedText = $("pinned-text");
    if (d.pinnedMessage) {
      pinnedBar.classList.add("visible");
      pinnedText.textContent = d.pinnedMessage;
    } else {
      pinnedBar.classList.remove("visible");
    }
  });

  const msgsQ = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(MAX_MSGS));
  onSnapshot(msgsQ, snap => {
    renderMessages(snap);
  });

  onSnapshot(collection(db, "online"), snap => {
    const users = snap.docs.map(d => d.data());
    renderOnlineList(users);
  });
});

$("img-upload-input").addEventListener("change", async e => {

  if (file.size > 2 * 1024 * 1024) {
    if (window.NRGNotify) NRGNotify.warning("Too large", "Image must be under 2MB.");

  const reader = new FileReader();
  reader.onload = async ev => {
    const dataUrl = ev.target.result;
    const equipped = userProfile.equipped || {};
    try {
      await addDoc(collection(db, "messages"), {
        uid:         currentUser.uid,
        username:    userProfile.username    || "",
        displayName: userProfile.displayName || currentUser.email.split("@")[0],
        photoURL:    userProfile.photoURL    || null,
        equipped:    equipped,
        isAdmin:     isAdmin,
        isBanned:    userProfile.isBanned || false,
        text:        "",
        imageUrl:    dataUrl,
        createdAt:   serverTimestamp()

    } catch(err) { console.error(err); }
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});
