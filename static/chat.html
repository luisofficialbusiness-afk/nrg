<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG | Chat</title>
<script src="index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--surface3:#222;
  --border:#2a2a2a;--accent:#c50cf9;--accent-dim:rgba(197,12,249,0.08);
  --text:#e8e8e8;--text-dim:#666;--text-muted:#3a3a3a;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --red:#ff4f4f;--green:#39d98a;--gold:#f5c518;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}


.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.brand-nrg{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:0.12em}
.brand-divider{width:1px;height:13px;background:var(--border)}
.brand-page{font-size:13px;color:var(--text-dim)}
.online-count{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em;display:flex;align-items:center;gap:6px}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}


.chat-layout{flex:1;display:flex;overflow:hidden}
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}


.messages-wrap{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:2px}
.msg-item{display:flex;align-items:flex-start;gap:10px;padding:6px 20px;transition:background 0.1s;position:relative}
.msg-item:hover{background:var(--surface2)}
.msg-item.own{flex-direction:row}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0;overflow:hidden;cursor:pointer}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-header{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.msg-name{font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
.msg-name:hover{text-decoration:underline}
.msg-handle{font-family:var(--mono);font-size:9px;color:var(--text-dim)}
.msg-time{font-family:var(--mono);font-size:8px;color:var(--text-muted)}
.msg-text{font-size:13px;color:var(--text-dim);line-height:1.6;word-break:break-word}


.badge{font-family:var(--mono);font-size:7px;letter-spacing:0.12em;padding:2px 6px;border-radius:2px;text-transform:uppercase;font-weight:700;flex-shrink:0}
.badge-admin{background:rgba(255,79,79,0.15);color:#ff4f4f;border:1px solid rgba(255,79,79,0.3)}
.badge-title-common{color:#666;background:rgba(255,255,255,0.05);border:1px solid #333}
.badge-title-rare{color:#4f9cf9;background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.25)}
.badge-title-epic{color:#c50cf9;background:rgba(197,12,249,0.1);border:1px solid rgba(197,12,249,0.25)}
.badge-title-legendary{color:#f5c518;background:rgba(245,197,24,0.12);border:1px solid rgba(245,197,24,0.3)}


.uc-purple{color:#c50cf9}.uc-blue{color:#4f9cf9}.uc-rose{color:#ff6b9d}.uc-lavender{color:#b57bee}
.uc-gold{color:#f5c518}.uc-red{color:#ff4f4f}.uc-green{color:#39d98a}.uc-orange{color:#ff4500}
.uc-crimson{color:#dc143c}.uc-toxic{color:#00ff41}.uc-yellow{color:#ffe600}.uc-ice{color:#e8f4ff}
.uc-rainbow{background:linear-gradient(90deg,#f00,#f90,#ff0,#0f0,#09f,#c50cf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow-spin 3s linear infinite}
@keyframes rainbow-spin{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}


.msg-delete{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:8px;padding:3px 8px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity 0.1s,color 0.1s,border-color 0.1s}
.msg-item:hover .msg-delete{opacity:1}
.msg-delete:hover{color:var(--red);border-color:var(--red)}


.date-divider{display:flex;align-items:center;gap:10px;padding:8px 20px;font-family:var(--mono);font-size:8px;color:var(--text-muted);letter-spacing:0.1em}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:var(--border)}


.input-bar{flex-shrink:0;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:flex-end}
.input-wrap{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;transition:border-color 0.15s;padding:2px}
.input-wrap:focus-within{border-color:var(--accent)}
.msg-input{width:100%;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;resize:none;max-height:120px;min-height:38px;line-height:1.5}
.msg-input::placeholder{color:var(--text-muted)}
.input-footer{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 6px}
.char-count{font-family:var(--mono);font-size:8px;color:var(--text-muted)}
.char-count.warn{color:var(--red)}
.send-btn{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.12em;padding:10px 18px;border-radius:5px;border:none;background:var(--accent);color:#000;cursor:pointer;flex-shrink:0;transition:opacity 0.13s}
.send-btn:hover:not(:disabled){opacity:0.85}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}


.login-bar{flex-shrink:0;padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:0.1em}
.login-bar a{color:var(--accent);text-decoration:none}
.login-bar a:hover{text-decoration:underline}


.chat-sidebar{width:220px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:8px;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase}
.online-list{flex:1;overflow-y:auto;padding:8px 0}
.online-user{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;transition:background 0.1s;text-decoration:none}
.online-user:hover{background:var(--surface2)}
.ou-av{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0;overflow:hidden}
.ou-av img{width:100%;height:100%;object-fit:cover}
.ou-name{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ou-handle{font-family:var(--mono);font-size:8px;color:var(--text-dim)}


.nrg-nav-btn{position:fixed;bottom:24px;left:24px;z-index:9998;width:44px;height:44px;border-radius:50%;background:var(--surface,#111);border:1px solid var(--border,#2a2a2a);color:var(--text-dim,#666);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 0.15s,color 0.15s,transform 0.2s;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.nrg-nav-btn:hover{border-color:var(--accent,#c50cf9);color:var(--accent,#c50cf9)}
.nrg-nav-btn.open{border-color:var(--accent,#c50cf9);color:var(--accent,#c50cf9);transform:rotate(45deg)}
.nrg-nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nrg-nav-menu{position:fixed;bottom:78px;left:24px;z-index:9997;background:var(--surface,#111);border:1px solid var(--border,#2a2a2a);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity 0.18s,transform 0.18s}
.nrg-nav-menu.open{opacity:1;pointer-events:all;transform:translateY(0)}
.nrg-nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;cursor:pointer;font-family:var(--mono,'Space Mono',monospace);font-size:10px;letter-spacing:0.1em;color:var(--text-dim,#666);transition:background 0.12s,color 0.12s;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.nrg-nav-item:hover{background:var(--surface2,#1a1a1a);color:var(--text,#e8e8e8)}
.nrg-nav-item.active{color:var(--accent,#c50cf9)}
.nrg-nav-item-dot{width:6px;height:6px;border-radius:50%;background:var(--border,#2a2a2a);flex-shrink:0;transition:background 0.12s}
.nrg-nav-item:hover .nrg-nav-item-dot,.nrg-nav-item.active .nrg-nav-item-dot{background:var(--accent,#c50cf9)}
.nrg-nav-divider{height:1px;background:var(--border,#2a2a2a);margin:4px 6px}

.bottom-sidebar{position:fixed;bottom:0;left:50%;transform:translate(-50%,70%);display:flex;gap:20px;padding:10px 18px;background:rgba(15,15,15,0.95);backdrop-filter:blur(10px);border-radius:40px;border:1px solid rgba(255,255,255,0.05);transition:transform 0.3s ease;z-index:999}
.bottom-sidebar:hover{transform:translate(-50%,0)}
.status-card{color:white;background:var(--surface2);padding:8px 12px;border-radius:10px;font-size:0.75rem;font-family:var(--mono);letter-spacing:0.04em}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-nrg">NRG</span>
    <div class="brand-divider"></div>
    <span class="brand-page">Chat</span>
  </div>
  <div class="online-count">
    <span class="online-dot"></span>
    <span id="online-count">0 online</span>
  </div>
</div>

<div class="chat-layout">
  <div class="chat-main">
    <div class="messages-wrap" id="messages-wrap"></div>
    <div class="input-bar" id="input-bar" style="display:none">
      <div class="input-wrap">
        <textarea class="msg-input" id="msg-input" placeholder="say something..." rows="1" maxlength="500"></textarea>
        <div class="input-footer">
          <span class="char-count" id="char-count">0/500</span>

<button class="nrg-nav-btn" id="nrg-nav-btn" title="Navigation">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<nav class="nrg-nav-menu" id="nrg-nav-menu">
  <a class="nrg-nav-item" data-page="index.html"    href="/index.html"><span class="nrg-nav-item-dot"></span>Home</a>
  <a class="nrg-nav-item" data-page="games.html"    href="/games.html"><span class="nrg-nav-item-dot"></span>Games</a>
  <a class="nrg-nav-item" data-page="movies.html"   href="/movies.html"><span class="nrg-nav-item-dot"></span>Movies</a>
  <a class="nrg-nav-item" data-page="music.html"    href="/music.html"><span class="nrg-nav-item-dot"></span>Music</a>
  <a class="nrg-nav-item" data-page="proxy.html"    href="/proxy.html"><span class="nrg-nav-item-dot"></span>Proxy</a>
  <div class="nrg-nav-divider"></div>
  <a class="nrg-nav-item" data-page="shop.html"     href="/shop.html"><span class="nrg-nav-item-dot"></span>Shop</a>
  <a class="nrg-nav-item" data-page="profiles.html" href="/profiles.html"><span class="nrg-nav-item-dot"></span>Profiles</a>
  <a class="nrg-nav-item" data-page="chat.html"     href="/chat.html"><span class="nrg-nav-item-dot"></span>Chat</a>
  <a class="nrg-nav-item" data-page="accounts.html" href="/accounts.html"><span class="nrg-nav-item-dot"></span>Account</a>
  <div class="nrg-nav-divider"></div>
  <a class="nrg-nav-item" data-page="settings.html" href="/settings.html"><span class="nrg-nav-item-dot"></span>Settings</a>
</nav>

<div class="bottom-sidebar">
  <div class="status-card" id="time-status">Time: --:--</div>
  <div class="status-card" id="battery-status">Battery: --%</div>
  <div class="status-card" id="temperature-status">Temp: -- C</div>
  <div class="status-card" id="ping-status">Ping: -- ms</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getFirestore as getMainFS, doc, getDoc
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import {
  initializeApp as initChatApp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query,
  orderBy, limit, deleteDoc, doc as chatDoc, serverTimestamp,
  setDoc, deleteDoc as chatDeleteDoc, getDocs, where
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


const mainConfig = {
  apiKey:            "AIzaSyAKPXLTU0z18tsn80JCXJhJ62EEjDl7lqY",
  authDomain:        "nrg-accounts.firebaseapp.com",
  projectId:         "nrg-accounts",
  storageBucket:     "nrg-accounts.firebasestorage.app",
  messagingSenderId: "969467601192",
  appId:             "1:969467601192:web:bd312dd3d58e4b6b7c701d"
};


const chatConfig = {
  apiKey:            "AIzaSyA_vWL5TRolNFmeqlSCrlgt-pul5kCZyog",
  authDomain:        "nrg-chat.firebaseapp.com",
  projectId:         "nrg-chat",
  storageBucket:     "nrg-chat.firebasestorage.app",
  messagingSenderId: "844103114783",
  appId:             "1:844103114783:web:8f4096d0ef1a9ffa12b52a"
};

const mainApp  = initializeApp(mainConfig, "main");
const chatApp  = initChatApp(chatConfig, "chat");
const auth     = getAuth(mainApp);
const mainDb   = getMainFS(mainApp);
const chatDb   = getFirestore(chatApp);

const $        = id => document.getElementById(id);
const MAX_MSGS = 100;
const MAX_CHARS = 500;
const RATE_LIMIT_MS = 2000;

let currentUser  = null;
let userProfile  = null;
let isAdmin      = false;
let lastSentAt   = 0;
let onlineRef    = null;

const UC_CLASS = {
  color_purple:"uc-purple",color_blue:"uc-blue",color_rose:"uc-rose",
  color_lavender:"uc-lavender",color_gold:"uc-gold",color_red:"uc-red",
  color_green:"uc-green",color_orange:"uc-orange",color_crimson:"uc-crimson",
  color_toxic:"uc-toxic",color_yellow:"uc-yellow",color_ice:"uc-ice",
  color_rainbow:"uc-rainbow"
};

const TITLE_ITEMS = {
  title_rookie:{name:"Rookie",rarity:"common"},title_gamer:{name:"Gamer",rarity:"common"},
  title_ghost:{name:"Ghost",rarity:"common"},title_grinder:{name:"Grinder",rarity:"rare"},
  title_veteran:{name:"Veteran",rarity:"rare"},title_shadow:{name:"Shadow",rarity:"rare"},
  title_elite:{name:"Elite",rarity:"epic"},title_phantom:{name:"Phantom",rarity:"epic"},
  title_champion:{name:"Champion",rarity:"epic"},title_legend:{name:"Legend",rarity:"epic"},
  title_goat:{name:"G.O.A.T",rarity:"legendary"},title_og:{name:"NRG OG",rarity:"legendary"},
  title_nrg:{name:"NRG Elite",rarity:"legendary"}
};

function fmtTime(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return "Today";
  const yesterday = new Date(Date.now() - 86400000);
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function setAvatar(el, photoURL, name) {
  if (photoURL && photoURL !== "firestore") {
    el.innerHTML = '<img src="' + photoURL + '" alt="">';
  } else {
    el.textContent = (name || "?")[0].toUpperCase();
  }
}

function buildMessage(msg, showDate, canDelete) {
  const equipped = msg.equipped || {};
  const ucKey    = equipped.usernameColor;
  const ucClass  = ucKey && UC_CLASS[ucKey] ? UC_CLASS[ucKey] : "";
  const titleKey = equipped.title;
  const titleDef = titleKey && TITLE_ITEMS[titleKey] ? TITLE_ITEMS[titleKey] : null;

  const dateDiv = showDate
    ? '<div class="date-divider">' + fmtDate(msg.createdAt) + '</div>'
    : "";

  const av = document.createElement("div");
  av.className = "msg-av";
  setAvatar(av, msg.photoURL, msg.displayName);

  const adminBadge  = msg.isAdmin ? '<span class="badge badge-admin">ADMIN</span>' : "";
  const titleBadge  = titleDef   ? '<span class="badge badge-title-' + titleDef.rarity + '">' + titleDef.name + '</span>' : "";
  const nameClass   = ucClass    ? " " + ucClass : "";
  const deleteBtn   = canDelete
    ? '<button class="msg-delete" data-id="' + msg.id + '">delete</button>'
    : "";

  const wrapper = document.createElement("div");
  wrapper.innerHTML = dateDiv;

  const item = document.createElement("div");
  item.className = "msg-item";
  item.dataset.id = msg.id;
  item.innerHTML =
    '<div class="msg-body" style="padding-left:42px">' +
      '<div class="msg-header">' +
        '<span class="msg-name' + nameClass + '">' + (msg.displayName || "User") + '</span>' +
        '<span class="msg-handle">' + (msg.username ? "@" + msg.username : "") + '</span>' +
        adminBadge + titleBadge +
        '<span class="msg-time">' + fmtTime(msg.createdAt) + '</span>' +
      '</div>' +
      '<div class="msg-text">' + escapeHtml(msg.text) + '</div>' +
    '</div>' +
    deleteBtn;

  const avEl = item.querySelector
    ? item.querySelector(".msg-body") : null;
  item.prepend(av);
  av.style.cssText = "position:absolute;left:20px;top:10px";
  item.style.position = "relative";

  av.addEventListener("click", () => {
    if (msg.uid) window.open("/profiles.html?uid=" + msg.uid, "_blank");
  });
  item.querySelector(".msg-name")?.addEventListener("click", () => {
    if (msg.uid) window.open("/profiles.html?uid=" + msg.uid, "_blank");
  });

  const delBtn = item.querySelector(".msg-delete");
  if (delBtn) {
    delBtn.addEventListener("click", async () => {
      if (!confirm("Delete this message?")) return;
      try {
        await chatDeleteDoc(chatDoc(chatDb, "messages", msg.id));
      } catch(e) { console.error(e); }
    });
  }

  wrapper.appendChild(item);
  return wrapper;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

let lastDateShown = "";
let lastMsgCount  = 0;

function renderMessages(msgs) {
  const wrap    = $("messages-wrap");
  const atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;

  if (msgs.length === lastMsgCount) return;
  lastMsgCount = msgs.length;
  wrap.innerHTML = "";
  lastDateShown  = "";

  msgs.forEach(msg => {
    const dateStr  = fmtDate(msg.createdAt);
    const showDate = dateStr !== lastDateShown;
    if (showDate) lastDateShown = dateStr;
    const canDelete = isAdmin || (currentUser && currentUser.uid === msg.uid);
    wrap.appendChild(buildMessage(msg, showDate, canDelete));
  });

  if (atBottom) wrap.scrollTop = wrap.scrollHeight;
}

function renderOnlineList(users) {
  const list = $("online-list");
  $("online-count").textContent = users.length + " online";
  list.innerHTML = "";
  users.forEach(u => {
    const a = document.createElement("a");
    a.className = "online-user";
    a.href      = "/profiles.html?uid=" + u.uid;
    a.target    = "_blank";

    const av = document.createElement("div");
    av.className = "ou-av";
    setAvatar(av, u.photoURL, u.displayName);

    a.innerHTML =
      '<div><div class="ou-name">' + (u.displayName || "User") + '</div>' +
      '<div class="ou-handle">' + (u.username ? "@" + u.username : "") + '</div></div>';
    a.prepend(av);
    list.appendChild(a);
  });
}

async function sendMessage() {
  const input = $("msg-input");
  const text  = input.value.trim();
  if (!text || !currentUser || !userProfile) return;
  if (text.length > MAX_CHARS) return;

  const now = Date.now();
  if (now - lastSentAt < RATE_LIMIT_MS) {
    if (window.NRGNotify) NRGNotify.warning("Slow down", "You're sending messages too fast.");
    return;
  }
  lastSentAt = now;

  const equipped = userProfile.equipped || {};
  $("send-btn").disabled = true;
  try {
    await addDoc(collection(chatDb, "messages"), {
      uid:         currentUser.uid,
      username:    userProfile.username    || "",
      displayName: userProfile.displayName || currentUser.email.split("@")[0],
      photoURL:    userProfile.photoURL    || null,
      equipped:    equipped,
      isAdmin:     isAdmin,
      isBanned:    userProfile.isBanned    || false,
      text:        text,
      createdAt:   serverTimestamp()
    });
    input.value = "";
    $("char-count").textContent = "0/" + MAX_CHARS;
    input.style.height = "auto";
    $("messages-wrap").scrollTop = $("messages-wrap").scrollHeight;
  } catch(e) { console.error(e); }
  finally { $("send-btn").disabled = false; }
}

async function registerOnline(user, profile) {
  onlineRef = chatDoc(chatDb, "online", user.uid);
  await setDoc(onlineRef, {
    uid:         user.uid,
    displayName: profile.displayName || user.email.split("@")[0],
    username:    profile.username    || "",
    photoURL:    profile.photoURL    || null,
    lastSeen:    serverTimestamp()
  });
  window.addEventListener("beforeunload", () => {
    if (onlineRef) chatDeleteDoc(onlineRef).catch(() => {});
  });
}

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    $("input-bar").style.display = "flex";
    $("login-bar").style.display = "none";

    const [userSnap, adminSnap] = await Promise.all([
      getDoc(doc(mainDb, "users", user.uid)),
      getDoc(doc(mainDb, "admins", user.uid))
    ]);

    userProfile = userSnap.exists() ? userSnap.data() : {};
    isAdmin     = adminSnap.exists();

    if (userProfile.isBanned) {
      $("input-bar").style.display = "none";
      $("login-bar").style.display = "flex";
      $("login-bar").textContent   = "Your account has been banned.";
      return;
    }

    await registerOnline(user, userProfile);
  } else {
    $("input-bar").style.display = "none";
    $("login-bar").style.display = "flex";
    userProfile = null;
    isAdmin     = false;
  }
});


const msgsQ = query(collection(chatDb, "messages"), orderBy("createdAt", "asc"), limit(MAX_MSGS));
onSnapshot(msgsQ, snap => {
  const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderMessages(msgs);
});

onSnapshot(collection(chatDb, "online"), snap => {
  const users = snap.docs.map(d => d.data());
  renderOnlineList(users);
});

const input = $("msg-input");
input.addEventListener("input", () => {
  const len = input.value.length;
  const cc  = $("char-count");
  cc.textContent = len + "/" + MAX_CHARS;
  cc.className   = "char-count" + (len > 450 ? " warn" : "");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("send-btn").addEventListener("click", sendMessage);

(function() {
  var btn  = document.getElementById("nrg-nav-btn");
  var menu = document.getElementById("nrg-nav-menu");
  if (!btn || !menu) return;
  var cur = window.location.pathname.split("/").pop();
  menu.querySelectorAll(".nrg-nav-item[data-page]").forEach(function(item) {
    if (item.dataset.page === cur) item.classList.add("active");
  });
  btn.addEventListener("click", function(e) {
    e.stopPropagation();
    var isOpen = menu.classList.toggle("open");
    btn.classList.toggle("open", isOpen);
  });
  document.addEventListener("click", function() {
    menu.classList.remove("open");
    btn.classList.remove("open");
  });
  menu.addEventListener("click", function(e) { e.stopPropagation(); });
})();
</script>

<script src="sidebar-logic.js"></script>
</body>
