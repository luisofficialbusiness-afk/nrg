<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sams | Proxy</title>
  <script src="/sail/baremux/index.js"></script>
  <script src="/sail/scram/scramjet.all.js"></script>
  <script>
    window.scramjetReady = new Promise(async (resolve) => {
      await new Promise(r => window.addEventListener('load', r));
      try {
        // Register scramjet service worker
        await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        await navigator.serviceWorker.ready;

        // Init scramjet controller
        const scramjetModule = await $scramjetLoadController();
        const controller = new scramjetModule.ScramjetController({
          prefix: "/sail/scram/",
          config: "/sail/scram/scramjet.config.js",
        });
        await controller.init();
        window.scramjet = controller;
        console.log("Scramjet ready");
      } catch(e) {
        console.warn("Scramjet init failed:", e);
        window.scramjet = { encodeUrl: function(url) { return url; } };
      }
      resolve();
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0002;
      --surface: #150003;
      --border: #2a0008;
      --crimson: #e8002a;
      --crimson-dim: #6b0010;
      --crimson-deep: #3a0008;
      --fg: #f0e8e8;
      --muted: #7a4050;
      --tab-h: 52px;
    }

    html, body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    canvas#snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }

    /* TOPBAR */
    #tab-bar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--tab-h);
      background: #0f0003; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 1.5rem;
      gap: 8px; z-index: 2000;
    }

    .logo { font-size: 15px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--crimson); font-weight: 500; flex-shrink: 0; }

    #tab-list {
      display: flex; align-items: center; gap: 4px;
      flex: 1; overflow-x: auto; overflow-y: hidden; min-width: 0;
    }
    #tab-list::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0; height: 32px; min-width: 100px; max-width: 180px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center;
      gap: 6px; padding: 0 8px; cursor: pointer; user-select: none;
      transition: background 0.13s, border-color 0.13s;
    }
    .tab:hover { background: var(--crimson-deep); border-color: var(--crimson-dim); }
    .tab.active { background: var(--crimson-deep); border-color: var(--crimson); }

    .tab-favicon { width: 13px; height: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .tab-favicon img { width: 13px; height: 13px; object-fit: contain; border-radius: 2px; }
    .tab-favicon .tab-icon-svg { width: 11px; height: 11px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
    .tab-name { flex: 1; font-size: 11px; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tab.active .tab-name { color: var(--fg); }
    .tab-close { width: 14px; height: 14px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); flex-shrink: 0; transition: background 0.1s, color 0.1s; line-height: 1; }
    .tab-close:hover { background: rgba(232,0,42,0.2); color: var(--crimson); }

    #new-tab-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border); background: none; color: var(--muted);
      font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: border-color 0.13s, color 0.13s;
    }
    #new-tab-btn:hover { border-color: var(--crimson); color: var(--crimson); }

    /* back to site button */
    .back-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); font-size: 11px; letter-spacing: 0.08em;
      padding: 0 12px; height: 28px; cursor: pointer;
      transition: border-color 0.13s, color 0.13s;
      text-decoration: none;
    }
    .back-btn:hover { border-color: var(--crimson); color: var(--crimson); }
    .back-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* VIEWPORT */
    #nrg-viewport {
      position: fixed; left: 0; right: 0; top: var(--tab-h); bottom: 0;
      display: none; background: #fff;
    }
    #nrg-viewport.visible { display: block; }
    #nrg-viewport iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; background: #fff; display: none;
    }
    #nrg-viewport iframe.visible { display: block; }

    /* DASHBOARD */
    #nrg-dashboard {
      position: fixed; left: 0; right: 0; top: var(--tab-h); bottom: 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px; background: var(--bg);
      transition: opacity 0.2s; z-index: 1;
    }
    #nrg-dashboard.hidden { opacity: 0; pointer-events: none; }

    /* LOGO */
    .nrg-logo-wrap { text-align: center; position: relative; z-index: 1; user-select: none; }
    .nrg-logo-wrap h1 {
      font-size: clamp(4rem, 12vw, 8rem); font-weight: 300;
      color: var(--fg); letter-spacing: 0.15em;
      text-shadow: 0 0 40px rgba(232,0,42,0.3), 0 0 80px rgba(232,0,42,0.1);
    }
    .nrg-logo-wrap h1 span { color: var(--crimson); }
    .logo-rule { height: 1px; background: linear-gradient(90deg, transparent, var(--crimson), transparent); margin-top: 8px; opacity: 0.4; }
    .logo-sub { font-size: 9px; letter-spacing: 0.25em; color: var(--muted); margin-top: 10px; text-transform: uppercase; }

    /* SEARCH */
    .nrg-input-wrap { width: 90%; max-width: 520px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
    .search-form {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; transition: border-color 0.18s;
    }
    .search-form:focus-within { border-color: var(--crimson); }
    .input-icon { display: flex; align-items: center; padding: 0 13px; color: var(--muted); flex-shrink: 0; }
    .input-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    #nrg-query {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--fg); font-family: system-ui, sans-serif; font-size: 13px;
      padding: 13px 6px; caret-color: var(--crimson);
    }
    #nrg-query::placeholder { color: var(--muted); }
    .go-btn {
      background: var(--crimson); border: none; color: #fff;
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      padding: 0 18px; cursor: pointer; transition: opacity 0.13s; flex-shrink: 0;
    }
    .go-btn:hover { opacity: 0.85; }
    .input-hint { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-align: center; }

    /* BOOKMARKS */
    .bookmarks-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 24px; }
    .bookmark-item {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 10px; cursor: pointer;
      font-size: 11px; letter-spacing: 0.08em;
      color: var(--muted); transition: border-color 0.13s, color 0.13s;
      position: relative;
    }
    .bookmark-item:hover { border-color: var(--crimson); color: var(--crimson); }
    .bookmark-item img { width: 12px; height: 12px; object-fit: contain; border-radius: 2px; }
    .bookmark-del {
      display: none; position: absolute; top: -5px; right: -5px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--crimson); color: #fff; font-size: 9px; font-weight: 700;
      align-items: center; justify-content: center; cursor: pointer; z-index: 2;
    }
    .bookmark-item:hover .bookmark-del { display: flex; }
    .add-bm-btn {
      width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--muted); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.13s, color 0.13s; flex-shrink: 0;
    }
    .add-bm-btn:hover { border-color: var(--crimson); color: var(--crimson); }

    .bookmark-form {
      display: none; flex-direction: column; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-top: 2px solid var(--crimson); border-radius: 6px; padding: 14px;
    }
    .bookmark-form.open { display: flex; }
    .bookmark-form input {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--fg); font-family: system-ui, sans-serif; font-size: 12px;
      padding: 8px 10px; border-radius: 4px; outline: none; transition: border-color 0.15s;
    }
    .bookmark-form input:focus { border-color: var(--crimson); }
    .bookmark-form input::placeholder { color: var(--muted); }
    .bm-form-row { display: flex; gap: 6px; }
    .bm-save { background: var(--crimson); border: none; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    .bm-save:hover { opacity: 0.85; }
    .bm-cancel { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 11px; letter-spacing: 0.1em; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    .bm-cancel:hover { border-color: var(--crimson-dim); color: var(--fg); }
  </style>
</head>
<body>

<canvas id="snow"></canvas>

<!-- TAB BAR -->
<div id="tab-bar">
  <span class="logo">NRG</span>
  <div id="tab-list"></div>
  <button id="new-tab-btn" title="New tab">+</button>
  <a class="back-btn" href="/index.html">
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    Home
  </a>
</div>

<!-- VIEWPORT -->
<div id="nrg-viewport"></div>

<!-- DASHBOARD -->
<div id="nrg-dashboard">
  <div class="nrg-logo-wrap">
    <h1>N<span>R</span>G</h1>
    <div class="logo-rule"></div>
    <div class="logo-sub">proxy // education</div>
  </div>

  <div class="nrg-input-wrap">
    <form class="search-form" id="nrg-core-form">
      <div class="input-icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <input type="text" id="nrg-query" placeholder="Search or enter a URL..." autocomplete="off" spellcheck="false">
      <button type="submit" class="go-btn">GO</button>
    </form>
    <div class="input-hint">enter a url or search query</div>

    <div class="bookmarks-bar" id="bookmarks-bar">
      <button class="add-bm-btn" id="add-bm-btn" title="Add bookmark">+</button>
    </div>

    <div class="bookmark-form" id="bookmark-form">
      <input type="text" id="bm-name" placeholder="Name">
      <input type="text" id="bm-url" placeholder="URL">
      <div class="bm-form-row">
        <button class="bm-save" id="bm-save">Save</button>
        <button class="bm-cancel" id="bm-cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
// Snow
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let W, H, flakes = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
function init() {
  resize();
  flakes = Array.from({length: 140}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.4+0.3,
    speed: Math.random()*0.5+0.15,
    drift: Math.random()*0.2-0.1,
    opacity: Math.random()*0.25+0.04
  }));
}
function draw() {
  ctx.clearRect(0,0,W,H);
  for(const f of flakes){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,0,30,${f.opacity})`;
    ctx.fill();
    f.y+=f.speed; f.x+=f.drift;
    if(f.y>H+4){f.y=-4;f.x=Math.random()*W;}
    if(f.x>W+4) f.x=-4;
    if(f.x<-4) f.x=W+4;
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize', resize);
init(); draw();

// Proxy
let tabs = [], activeId = null, tabCounter = 0;

function processUrl(raw) {
  if (!raw) return null;
  if (!raw.includes('.') || raw.includes(' ')) return 'https://search.brave.com/search?q=' + encodeURIComponent(raw);
  if (!/^https?:\/\//i.test(raw)) return 'https://' + raw;
  return raw;
}

function getFaviconUrl(url) {
  try { return 'https://www.google.com/s2/favicons?domain=' + new URL(url).hostname + '&sz=32'; } catch(e) { return null; }
}

function getDisplayName(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url.substring(0,20); }
}

function createTab(rawUrl = null) {
  const id = 'tab_' + (++tabCounter);
  const tab = { id, rawUrl, encodedUrl: null, label: 'New Tab' };
  tabs.push(tab);

  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.id = 'tel-' + id;

  const favEl = document.createElement('div');
  favEl.className = 'tab-favicon';
  favEl.id = 'fav-' + id;
  favEl.innerHTML = `<svg class="tab-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>`;

  const nameEl = document.createElement('span');
  nameEl.className = 'tab-name';
  nameEl.id = 'tname-' + id;
  nameEl.textContent = 'New Tab';

  const closeEl = document.createElement('span');
  closeEl.className = 'tab-close';
  closeEl.textContent = '×';
  closeEl.addEventListener('click', e => { e.stopPropagation(); closeTab(id); });

  tabEl.appendChild(favEl);
  tabEl.appendChild(nameEl);
  tabEl.appendChild(closeEl);
  tabEl.addEventListener('click', () => switchTab(id));
  document.getElementById('tab-list').appendChild(tabEl);

  const frame = document.createElement('iframe');
  frame.id = 'frame-' + id;
  frame.sandbox = 'allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation';
  document.getElementById('nrg-viewport').appendChild(frame);

  if (rawUrl) {
    const processed = processUrl(rawUrl);
    if (processed) {
      const encoded = (window.scramjet||{encodeUrl:u=>u}).encodeUrl(processed);
      tab.rawUrl = rawUrl;
      tab.encodedUrl = encoded;
      nameEl.textContent = getDisplayName(rawUrl);
      tab.label = getDisplayName(rawUrl);
      frame.src = encoded;
      frame.addEventListener('load', () => {
        try {
          const title = frame.contentDocument?.title;
          if (title) { nameEl.textContent = title.substring(0,20); tab.label = title; }
          const fav = frame.contentDocument?.querySelector('link[rel*="icon"]')?.href;
          if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
        } catch(e) {
          const fav = getFaviconUrl(rawUrl);
          if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
        }
      });
      const fav = getFaviconUrl(rawUrl);
      if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
    }
  }

  switchTab(id);
  return id;
}

function switchTab(id) {
  activeId = id;
  const tab = tabs.find(t => t.id === id);

  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('tel-' + id);
  if (el) el.classList.add('active');

  document.querySelectorAll('#nrg-viewport iframe').forEach(f => f.classList.remove('visible'));
  const frame = document.getElementById('frame-' + id);
  if (frame) frame.classList.add('visible');

  if (tab && tab.encodedUrl) {
    document.getElementById('nrg-viewport').classList.add('visible');
    document.getElementById('nrg-dashboard').classList.add('hidden');
  } else {
    document.getElementById('nrg-viewport').classList.remove('visible');
    document.getElementById('nrg-dashboard').classList.remove('hidden');
    setTimeout(() => document.getElementById('nrg-query').focus(), 50);
  }
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs.splice(idx, 1);
  document.getElementById('tel-' + id)?.remove();
  document.getElementById('frame-' + id)?.remove();
  if (tabs.length === 0) {
    createTab();
  } else if (activeId === id) {
    switchTab(tabs[Math.max(0, idx - 1)].id);
  }
}

async function navigateActive(raw) {
  if (!raw) return;
  await window.scramjetReady;
  const processed = processUrl(raw);
  if (!processed) return;
  const encoded = (window.scramjet||{encodeUrl:u=>u}).encodeUrl(processed);
  const tab = tabs.find(t => t.id === activeId);
  if (!tab) return;
  tab.rawUrl = raw;
  tab.encodedUrl = encoded;

  const nameEl = document.getElementById('tname-' + activeId);
  if (nameEl) nameEl.textContent = getDisplayName(raw);

  const favEl = document.getElementById('fav-' + activeId);
  if (favEl) {
    const fav = getFaviconUrl(raw);
    if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
  }

  const frame = document.getElementById('frame-' + activeId);
  if (frame) {
    frame.src = encoded;
    frame.addEventListener('load', () => {
      try {
        const title = frame.contentDocument?.title;
        if (title && nameEl) nameEl.textContent = title.substring(0, 20);
      } catch(e) {}
    }, {once: true});
  }

  document.getElementById('nrg-viewport').classList.add('visible');
  document.getElementById('nrg-dashboard').classList.add('hidden');
}

document.getElementById('nrg-core-form').addEventListener('submit', e => {
  e.preventDefault();
  const raw = document.getElementById('nrg-query').value.trim();
  if (!raw) return;
  navigateActive(raw);
  document.getElementById('nrg-query').value = '';
});

document.getElementById('new-tab-btn').addEventListener('click', () => createTab());

// Bookmarks
let bookmarks = [];
try { bookmarks = JSON.parse(localStorage.getItem('nrg_bm') || '[]'); } catch(e) { bookmarks = []; }

function saveBookmarks() { localStorage.setItem('nrg_bm', JSON.stringify(bookmarks)); }

function renderBookmarks() {
  const bar = document.getElementById('bookmarks-bar');
  bar.querySelectorAll('.bookmark-item').forEach(el => el.remove());
  const addBtn = document.getElementById('add-bm-btn');
  bookmarks.forEach((bm, i) => {
    const el = document.createElement('div');
    el.className = 'bookmark-item';
    const fav = getFaviconUrl(bm.url);
    el.innerHTML = `
      ${fav ? `<img src="${fav}" onerror="this.style.display='none'">` : ''}
      <span>${bm.name}</span>
      <div class="bookmark-del" title="Remove">×</div>`;
    el.addEventListener('click', e => {
      if (e.target.classList.contains('bookmark-del')) return;
      createTab(bm.url);
    });
    el.querySelector('.bookmark-del').addEventListener('click', e => {
      e.stopPropagation();
      bookmarks.splice(i, 1);
      saveBookmarks();
      renderBookmarks();
    });
    bar.insertBefore(el, addBtn);
  });
}

document.getElementById('add-bm-btn').addEventListener('click', () => {
  const form = document.getElementById('bookmark-form');
  form.classList.toggle('open');
  if (form.classList.contains('open')) document.getElementById('bm-name').focus();
});

document.getElementById('bm-cancel').addEventListener('click', () => {
  document.getElementById('bookmark-form').classList.remove('open');
  document.getElementById('bm-name').value = '';
  document.getElementById('bm-url').value = '';
});

document.getElementById('bm-save').addEventListener('click', () => {
  const name = document.getElementById('bm-name').value.trim();
  const url  = document.getElementById('bm-url').value.trim();
  if (!name || !url) return;
  bookmarks.push({ name, url });
  saveBookmarks();
  renderBookmarks();
  document.getElementById('bookmark-form').classList.remove('open');
  document.getElementById('bm-name').value = '';
  document.getElementById('bm-url').value = '';
});

document.getElementById('bm-url').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('bm-save').click();
});

renderBookmarks();
createTab();
</script>
</body>
</html>
