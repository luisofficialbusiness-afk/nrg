<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRG | Proxy</title>

  <script src="/sail/baremux/index.js"></script>
  <script src="/sail/scram/scramjet.all.js"></script>
  <script>
    navigator.serviceWorker.register("/sail/sw.js");
  </script>


  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --surface3: #222;
      --border: #2a2a2a;
      --accent: #c50cf9;
      --accent-dim: rgba(197,12,249,0.10);
      --accent-glow: rgba(197,12,249,0.25);
      --text: #e8e8e8;
      --text-dim: #666;
      --text-muted: #3a3a3a;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

   
    .nrg-status-line {
      position: fixed;
      top: 17px;
      right: 24px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.18em;
      pointer-events: none;
      z-index: 2000;
    }
    .nrg-status-line span { color: var(--accent); }

    
    .nrg-rail {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 52px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 14px;
      gap: 0;
      z-index: 1000;
    }

    #node-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      width: 100%;
    }

    .node-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .nrg-node {
      width: 100%;
      height: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      transition: background 0.13s, border-color 0.13s, color 0.13s;
    }
    .nrg-node:hover { border-color: var(--text-dim); color: var(--text-dim); }
    .nrg-node.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .close-node {
      position: absolute;
      top: -4px; right: -4px;
      width: 14px; height: 14px;
      background: #ff3a3a;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border-radius: 2px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.13s;
      z-index: 1001;
    }
    .node-wrapper:hover .close-node { opacity: 1; }

   
    #init-node {
      width: 36px; height: 36px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 6px;
      transition: border-color 0.13s, color 0.13s;
      flex-shrink: 0;
    }
    #init-node:hover { border-color: var(--accent); color: var(--accent); }


    #nrg-viewport {
      position: fixed;
      left: 52px; right: 0; top: 0; bottom: 0;
      background: #fff;
      display: none;
    }
    #nrg-viewport.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }


    #nrg-dashboard {
      position: fixed;
      left: 52px; right: 0; top: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      transition: opacity 0.25s;
      background: var(--bg);
    }


    #nrg-dashboard::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 55% 40% at 50% 50%, var(--accent-dim) 0%, transparent 70%);
      pointer-events: none;
    }


    .nrg-logo-container {
      text-align: center;
      position: relative;
      z-index: 1;
      user-select: none;
    }
    .nrg-logo-container h1 {
      font-family: var(--mono);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.15em;
      text-shadow: 0 0 40px var(--accent-glow), 0 0 80px var(--accent-dim);
      position: relative;
      display: inline-block;
    }

    .nrg-logo-container h1::before {
      content: attr(data-text);
      position: absolute; top: 0; left: 0;
      color: var(--accent);
      opacity: 0.06;
      letter-spacing: 0.15em;
      animation: glitch 6s infinite step-start;
    }
    @keyframes glitch {
      0%,91%,100% { clip-path: inset(100% 0 0 0); transform: none; }
      92% { clip-path: inset(18% 0 64% 0); transform: translateX(-3px); }
      94% { clip-path: inset(52% 0 22% 0); transform: translateX(3px); }
      96% { clip-path: inset(78% 0 8% 0);  transform: translateX(-2px); }
    }
    .logo-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin-top: 8px;
      opacity: 0.4;
    }
    .logo-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      margin-top: 10px;
      text-transform: uppercase;
    }

  
    .nrg-input-wrap {
      width: 90%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .nrg-input-wrap form {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.18s;
    }
    .nrg-input-wrap form:focus-within { border-color: var(--accent); }

    .input-icon {
      display: flex; align-items: center;
      padding: 0 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #nrg-query {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 13px 6px;
      caret-color: var(--accent);
    }
    #nrg-query::placeholder { color: var(--text-muted); }

    .go-btn {
      background: var(--accent);
      border: none;
      color: #000;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 0 18px;
      cursor: pointer;
      transition: opacity 0.13s;
      flex-shrink: 0;
    }
    .go-btn:hover { opacity: 0.85; }

    .input-hint {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }


  </style>
</head>
<body>

  <div class="nrg-status-line">proxy — <span>active</span></div>


  <nav class="nrg-rail">
    <div id="node-stack"></div>
    <div class="nrg-node" id="init-node" title="New tab">+</div>
  </nav>


  <div id="nrg-viewport"></div>


  <main id="nrg-dashboard">
    <div class="nrg-logo-container">
      <h1 data-text="NRG">NRG</h1>
      <div class="logo-rule"></div>
      <div class="logo-sub">proxy — browse freely</div>
    </div>

    <div class="nrg-input-wrap">
      <form id="nrg-core-form">
        <div class="input-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>
        <input type="text" id="nrg-query" placeholder="enter url or search…" autocomplete="off" spellcheck="false">
        <button class="go-btn" type="submit">GO</button>
      </form>
      <div class="input-hint">urls and searches routed through scramjet</div>
    </div>
  </main>




  
  <script>
    const wispUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/wisp/';
    
    const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");
    connection.setTransport("/sail/libcurl/index.mjs", [{ websocket: wispUrl }]);

    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
        files: {
            all: "/sail/scram/scramjet.all.js",
            wasm: "/sail/scram/scramjet.wasm.wasm",
            sync: "/sail/scram/scramjet.sync.js"
        },
        prefix: "/sail/go/"
    });
    scramjet.init();

    let nrg_nodes = [];
    let active_node_id = null;

    function createNode(url = null) {
      const id = 'node_' + Date.now();
      const nodeObj = { id, url };
      nrg_nodes.push(nodeObj);

      const wrapper = document.createElement('div');
      wrapper.className = 'node-wrapper';
      wrapper.id = `wrap-${id}`;

      const btn = document.createElement('div');
      btn.className = 'nrg-node';
      btn.id = `btn-${id}`;
      btn.innerText = 'N';
      btn.onclick = () => switchNode(id);
      
      const close = document.createElement('div');
      close.className = 'close-node';
      close.innerText = '×';
      close.onclick = (e) => {
        e.stopPropagation();
        deleteNode(id);
      };

      wrapper.appendChild(btn);
      wrapper.appendChild(close);
      document.getElementById('node-stack').appendChild(wrapper);

      const frame = document.createElement('iframe');
      frame.id = `frame-${id}`;
      frame.style.display = 'none';
      if (url) frame.src = url;
      document.getElementById('nrg-viewport').appendChild(frame);

      switchNode(id);
    }

    function deleteNode(id) {
      const index = nrg_nodes.findIndex(n => n.id === id);
      if (index === -1) return;
      nrg_nodes.splice(index, 1);
      document.getElementById(`wrap-${id}`).remove();
      document.getElementById(`frame-${id}`).remove();

      if (active_node_id === id) {
        if (nrg_nodes.length > 0) {
          switchNode(nrg_nodes[nrg_nodes.length - 1].id);
        } else {
          createNode();
        }
      }
    }

    function switchNode(id) {
      active_node_id = id;
      const node = nrg_nodes.find(n => n.id === id);

      document.querySelectorAll('.nrg-node').forEach(e => e.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${id}`);
      if(activeBtn) activeBtn.classList.add('active');

      document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
      const activeFrame = document.getElementById(`frame-${id}`);
      if(activeFrame) activeFrame.style.display = 'block';

      if (node && node.url) {
        document.getElementById('nrg-viewport').classList.add('active');
        document.getElementById('nrg-dashboard').style.opacity = '0';
        document.getElementById('nrg-dashboard').style.pointerEvents = 'none';
      } else {
        document.getElementById('nrg-viewport').classList.remove('active');
        document.getElementById('nrg-dashboard').style.opacity = '1';
        document.getElementById('nrg-dashboard').style.pointerEvents = 'all';
      }
    }

    document.getElementById('nrg-core-form').onsubmit = (e) => {
      e.preventDefault();
      let raw = document.getElementById('nrg-query').value.trim();
      if (!raw) return;

      if (!raw.includes('.') || raw.includes(' ')) {
        raw = "https://search.brave.com/search?q=" + encodeURIComponent(raw);
      } else if (!/^https?:\/\//i.test(raw)) {
        raw = "https://" + raw;
      }

      const encoded = scramjet.encodeUrl(raw);
      const node = nrg_nodes.find(n => n.id === active_node_id);
      node.url = encoded;
      
      document.getElementById(`frame-${active_node_id}`).src = encoded;
      switchNode(active_node_id);
      document.getElementById('nrg-query').value = "";
    };

    document.getElementById('init-node').onclick = () => createNode();

    createNode();
  </script>

  <script>
    document.querySelectorAll('.nrg-sidebar .nav-icon').forEach(icon => {
      const cur = window.location.pathname.split('/').pop();
      if (icon.dataset.page === cur) icon.classList.add('active');
      icon.addEventListener('click', () => { if (icon.dataset.page) window.location.href = '/' + icon.dataset.page; });
    });
  </script>

</body>
</html>
