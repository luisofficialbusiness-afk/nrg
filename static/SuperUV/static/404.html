<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Educational page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --nrg-blue: #0044ff;      
            --nrg-cyan: #00f2ff;      
            --nrg-electric: #4488ff;  
            --deep-void: #000105;     
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-void);
            background-image: radial-gradient(circle at center, #001133 0%, var(--deep-void) 70%);
            color: var(--nrg-electric);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }


        body::after {
            content: "";
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0, 68, 255, 0.03) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 9999;
        }

        .nrg-container {
            width: 100%;
            max-width: 500px;
            background: rgba(0, 5, 15, 0.9);
            border: 1px solid var(--nrg-blue);
            padding: 60px 40px;
            position: relative;
            z-index: 1;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 68, 255, 0.15);
        }

        .nrg-container::before {
            content: 'ERR_LOG'; position: absolute; top: 10px; left: 15px; 
            font-family: 'Space Mono'; font-size: 0.6rem; color: var(--nrg-blue); opacity: 0.5;
        }

        .error-code {
            font-family: 'Syncopate', sans-serif;
            font-size: 7rem;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 2px var(--nrg-cyan);
            line-height: 0.8;
            margin-bottom: 20px;
            letter-spacing: -5px;
        }

        .error-title {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .error-message {
            color: var(--nrg-electric);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            margin-bottom: 40px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .nrg-btn {
            background: var(--nrg-blue);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nrg-btn:hover {
            background: var(--nrg-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--nrg-cyan);
        }

        .abort-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--nrg-blue);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .abort-link:hover {
            color: var(--nrg-cyan);
            text-shadow: 0 0 10px var(--nrg-cyan);
        }

        .nrg-pulse {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 12px;
        }

        .pulse-bar {
            width: 4px;
            height: 20px;
            background-color: var(--nrg-cyan);
            animation: bar-grow 1.2s infinite ease-in-out;
        }

        .pulse-bar:nth-child(2) { animation-delay: 0.2s; }
        .pulse-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bar-grow {
            0%, 100% { transform: scaleY(0.5); opacity: 0.2; }
            50% { transform: scaleY(1.5); opacity: 1; background-color: var(--nrg-blue); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="nrg-container animate__animated animate__fadeIn">
        <div id="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not found!</h2>
            <p class="error-message">ERROR_CODE:PAGE_NOT_FOUND </p>
            <a href="javascript:void(0)" onclick="gohome();" class="nrg-btn">Go home</a>
        </div>

        <div id="proxy-content" class="hidden">
            <h1 class="error-code">NRG</h1>
            <h2 class="error-title">Syncing Flux</h2>
            <p class="error-message">Waking server nodes..... Manual override required after 10 seconds</p>
            
            <form id="regform">
                <button id="uv-register-sw" class="nrg-btn" type="submit" onclick="window.location.reload(1);">
                    Engage Flux
                </button>
            </form>

            <div class="nrg-pulse">
                <div class="pulse-bar"></div>
                <div class="pulse-bar"></div>
                <div class="pulse-bar"></div>
            </div>
            <a href="javascript:void(0)" onclick="gohome();" class="abort-link">Abort Sequence</a>
        </div>
    </div>

    <script>
   
        if(window.location.href.includes("/service/")) {
            document.getElementById("error-content").classList.add("hidden");
            document.getElementById("proxy-content").classList.remove("hidden");
        }
        
        function gohome() {
            window.location.href = window.location.origin;
        }
    </script>

    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <script src="/search.js" defer></script>
    <script src="/scripts/load.js" defer></script>
    <script src="/error.js" defer></script>
</body>
</html>
