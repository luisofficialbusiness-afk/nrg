(function() {
  var THEMES = {
    midnight: { bg:"#0a0a0a", surface:"#111", surface2:"#1a1a1a", border:"#2a2a2a", accent:"#c50cf9", text:"#e8e8e8", textDim:"#666", textMuted:"#3a3a3a" },
    neon:     { bg:"#050510", surface:"#0d0d1f", surface2:"#14142e", border:"#1e1e3f", accent:"#4f9cf9", text:"#e8f0ff", textDim:"#5a6a88", textMuted:"#2a3048" },
    galaxy:   { bg:"#06020f", surface:"#100820", surface2:"#180c2e", border:"#2a1540", accent:"#b57bee", text:"#eee8ff", textDim:"#6a5a88", textMuted:"#2e1e44" },
    ocean:    { bg:"#020a14", surface:"#061622", surface2:"#0b2233", border:"#0e3040", accent:"#00c8ff", text:"#d8f4ff", textDim:"#4a7a99", textMuted:"#0d2233" },
    crimson:  { bg:"#0f0005", surface:"#1a0008", surface2:"#220010", border:"#3a0018", accent:"#ff2255", text:"#ffe8ec", textDim:"#884455", textMuted:"#3a1020" },
    gold:     { bg:"#0a0800", surface:"#141000", surface2:"#1e1800", border:"#302400", accent:"#f5c518", text:"#fff8e0", textDim:"#886633", textMuted:"#2e2200" },
    forest:   { bg:"#020a04", surface:"#071208", surface2:"#0d1e10", border:"#142e18", accent:"#39d98a", text:"#d8ffe8", textDim:"#4a8860", textMuted:"#0d2214" },
    sakura:   { bg:"#0f0508", surface:"#1a0810", surface2:"#220e18", border:"#381a28", accent:"#ff6b9d", text:"#ffe8f0", textDim:"#885566", textMuted:"#2e0e1a" },
  };
  function rgba(hex,a){hex=hex.replace("#","");if(hex.length===3)hex=hex.split("").map(function(c){return c+c;}).join("");var n=parseInt(hex,16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
  window.applyTheme=function(id){var t=THEMES[id]||THEMES.midnight;var s=document.documentElement.style;s.setProperty("--bg",t.bg);s.setProperty("--surface",t.surface);s.setProperty("--surface2",t.surface2);s.setProperty("--surface3",t.surface2);s.setProperty("--border",t.border);s.setProperty("--accent",t.accent);s.setProperty("--accent-dim",rgba(t.accent,0.10));s.setProperty("--accent-glow",rgba(t.accent,0.25));s.setProperty("--text",t.text);s.setProperty("--text-dim",t.textDim);s.setProperty("--text-muted",t.textMuted);};
  window.applyTheme(localStorage.getItem("nrg_theme")||"midnight");
})();
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a; --surface3: #222;
  --border: #2a2a2a; --accent: #c50cf9; --accent-dim: rgba(197,12,249,0.10);
  --accent-glow: rgba(197,12,249,0.25); --text: #e8e8e8; --text-dim: #666;
  --text-muted: #3a3a3a; --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; height: 100vh; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; position: relative; z-index: 1;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-nrg { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.12em; }
.brand-divider { width: 1px; height: 13px; background: var(--border); }
.brand-tagline { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.2em; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.version-badge { font-family: var(--mono); font-size: 8px; letter-spacing: 0.15em; color: var(--text-muted); border: 1px solid var(--border); padding: 3px 8px; border-radius: 3px; }
.live-badge { font-family: var(--mono); font-size: 8px; letter-spacing: 0.15em; color: var(--accent); border: 1px solid var(--accent); padding: 3px 8px; border-radius: 3px; display:flex;align-items:center;gap:5px; }
.live-dot { width:5px;height:5px;border-radius:50%;background:var(--accent);animation:livepulse 1.2s ease-in-out infinite; }
@keyframes livepulse { 0%,100%{opacity:1}50%{opacity:0.2} }

.filterbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; overflow-x: auto; position: relative; z-index:1;
}
.filterbar::-webkit-scrollbar { display: none; }
.filter-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); font-family: var(--mono); font-size: 8px;
  letter-spacing: 0.12em; padding: 5px 12px; border-radius: 3px;
  cursor: pointer; white-space: nowrap; transition: border-color 0.13s, color 0.13s, background 0.13s;
}
.filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.search-wrap { margin-left: auto; position: relative; flex-shrink: 0; }
.search-input {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em;
  padding: 6px 10px 6px 28px; width: 180px; border-radius: 3px; outline: none;
  transition: border-color 0.15s, width 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); width: 220px; }
.search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.search-icon svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.grid-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; position: relative; z-index: 1; }
.channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

.ch-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 5px; cursor: pointer; overflow: hidden; position: relative;
  transition: border-color 0.18s, transform 0.18s;
}
.ch-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--accent); transform: scaleY(0); transform-origin: bottom; transition: transform 0.18s;
}
.ch-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.ch-card:hover::before { transform: scaleY(1); }
.ch-thumb {
  aspect-ratio: 16/9; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
}
.ch-thumb img { width: 55%; height: 55%; object-fit: contain; opacity: 0.85; transition: opacity 0.15s; }
.ch-card:hover .ch-thumb img { opacity: 1; }
.ch-fallback { font-family: var(--mono); font-size: 9px; color: var(--text-muted); text-align: center; padding: 8px; letter-spacing: 0.05em; }
.ch-on-air {
  position: absolute; top: 6px; right: 6px;
  background: rgba(10,10,10,0.85); border: 1px solid rgba(197,12,249,0.3);

.ch-fav-btn {

.ch-card:hover .ch-fav-btn { opacity: 1; }
.ch-fav-btn.active { opacity: 1; background: rgba(197,12,249,0.4); border-color: var(--accent); }
.ch-info { padding: 9px 10px 10px; }
.ch-name { font-size: 11px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-region { font-family: var(--mono); font-size: 8px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.05em; }

.skel { background: var(--surface2); border-radius: 3px; animation: skelflash 1.4s ease-in-out infinite; }
@keyframes skelflash { 0%,100%{opacity:0.4}50%{opacity:0.8} }

.empty-state { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; gap: 12px; }
.empty-icon svg { width: 36px; height: 36px; stroke: var(--text-muted); fill: none; stroke-width: 1.5; stroke-linecap: round; }
.empty-text { font-family: var(--mono); font-size: 9px; letter-spacing: 0.15em; color: var(--text-muted); }

.popup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.popup-overlay.open { opacity: 1; pointer-events: all; }
.popup {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 2px solid var(--accent); border-radius: 5px;
  width: 90%; max-width: 380px;
  transform: scale(0.96); transition: transform 0.2s;
}
.popup-overlay.open .popup { transform: scale(1); }
.popup-header {
  display: flex; align-items: center; gap: 14px;
  padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
}
.popup-logo {
  width: 48px; height: 48px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
}
.popup-logo img { width: 80%; height: 80%; object-fit: contain; }
.popup-logo-fallback svg { width: 22px; height: 22px; stroke: var(--text-muted); fill: none; stroke-width: 1.5; }
.popup-title { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; line-height: 1.4; }
.popup-on-air { font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; color: var(--accent); display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.popup-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
.popup-watch-btn {
  background: var(--accent); border: none; color: #000;
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.15em;
  padding: 10px 18px; border-radius: 3px; cursor: pointer;
  transition: opacity 0.13s; width: 100%;
}
.popup-watch-btn:hover { opacity: 0.85; }
.popup-fav-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
  padding: 8px 18px; border-radius: 3px; cursor: pointer;
  transition: border-color 0.13s, color 0.13s; width: 100%;
}
.popup-fav-btn:hover { border-color: var(--accent); color: var(--accent); }
.popup-fav-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.popup-dismiss {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
  padding: 8px 18px; border-radius: 3px; cursor: pointer;
  transition: border-color 0.13s, color 0.13s; width: 100%;
}
.popup-dismiss:hover { border-color: var(--text-dim); color: var(--text); }
.popup-login-note { font-family: var(--mono); font-size: 8px; color: var(--text-muted); text-align: center; letter-spacing: 0.08em; }

#player-view {
  position: fixed; inset: 0; background: #000; z-index: 8000;
  flex-direction: column; display: none;
}
#player-view.open { display: flex; }
.player-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.player-live { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; color: var(--accent); }
.player-name { font-family: var(--mono); font-size: 10px; color: var(--text); letter-spacing: 0.05em; }
.player-close {
  margin-left: auto; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em;
  padding: 5px 12px; border-radius: 3px; cursor: pointer; transition: border-color 0.13s, color 0.13s;
}
.player-close:hover { border-color: var(--text-dim); color: var(--text); }
#player-frame { flex: 1; border: none; width: 100%; }

#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
</style>
</head>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKPXLTU0z18tsn80JCXJhJ62EEjDl7lqY",
  authDomain: "nrg-accounts.firebaseapp.com",
  projectId: "nrg-accounts",
  storageBucket: "nrg-accounts.firebasestorage.app",
  messagingSenderId: "969467601192",
  appId: "1:969467601192:web:bd312dd3d58e4b6b7c701d"
};
const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const BASE = 'https://toustream.glseries.net';
let allChannels = [], filtered = [], current = null;
let currentFilter = 'all', searchQ = '';
let loadedCount = 0;
const PAGE = 36;
let loading = false, done = false;
let currentUser = null;
let favSlugs = new Set();

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      const d = snap.data();
      favSlugs = new Set(d.tvFavourites || []);
    }
  } else {
    favSlugs = new Set();
  }
  applyFilter();
  updatePopupFavBtn();
});

async function toggleFav(slug) {
  if (!currentUser) return false;
  const ref = doc(db, 'users', currentUser.uid);
  if (favSlugs.has(slug)) {
    favSlugs.delete(slug);
    await updateDoc(ref, { tvFavourites: arrayRemove(slug) });
  } else {
    favSlugs.add(slug);
    await updateDoc(ref, { tvFavourites: arrayUnion(slug) });
  }
  return true;
}

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const particles = Array.from({length: 35}, () => ({
  x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
  r: Math.random() * 1.2 + 0.3, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
  o: Math.random() * 0.4 + 0.1
}));
function drawBG() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c50cf9';
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=accent.replace(')',`,${p.o})`).replace('rgb(','rgba(') || `rgba(197,12,249,${p.o})`;
    ctx.fill();
  });
  requestAnimationFrame(drawBG);
}
drawBG();

const SPORTS = ['sports','espn','nfl','nba','nhl','mlb','fox sports','sky sports','tsn','sportsnet','nesn','msg','bein','tennis','golf','cricket','willow','astro','wwe'];
const NEWS   = ['news','cnn','msnbc','cnbc','al jazeera','fox news','c-span','fox business','abc','nbc 4','cbs 2'];
const KIDS   = ['nickelodeon','nick','cartoon','disney','boomerang','peppa','spongebob','bluey','kids','jr'];
const ANIME  = ['anime'];
const LATINO = ['latino','espanol','español','deportes','estrella','telemundo','univision'];
const KNOWN_REGIONS = ['| usa','| us ','| uk','| ca','| ind','| in','| my','| latino'];

function cat(ch) {
  const n=ch.name.toLowerCase();
  if(ANIME.some(k=>n.includes(k))) return 'anime';
  if(KIDS.some(k=>n.includes(k))) return 'kids';
  if(NEWS.some(k=>n.includes(k))) return 'news';
  if(SPORTS.some(k=>n.includes(k))) return 'sports';
  if(LATINO.some(k=>n.includes(k))) return 'latino';
  return null;
}
function region(ch) {
  const n=ch.name.toLowerCase();
  if(n.includes('| usa')||n.includes('| us ')) return 'usa';
  if(n.includes('| uk')) return 'uk';
  if(n.includes('| ca')) return 'ca';
  if(n.includes('| ind')||n.includes('| in')) return 'in';
  if(n.includes('| my')) return 'my';
  if(n.includes('| latino')) return 'latino';
  return null;
}
function isIntl(ch) {
  const n=ch.name.toLowerCase();
  const hasRegion=KNOWN_REGIONS.some(r=>n.includes(r));
  return !hasRegion;
}
function is247(ch) { return ch.name.startsWith('24/7'); }

// Start time helpers — ready for upcoming API update
function formatStartTime(ts) {
  if(!ts) return null;
  try {
    const d = new Date(typeof ts==='number' ? ts*1000 : ts);
    if(isNaN(d)) return null;
    const now = new Date();
    const diffMs = d - now;
    if(diffMs < 0) return null; // already started
    const diffMins = Math.floor(diffMs/60000);
    if(diffMins < 60) return `STARTS IN ${diffMins}M`;
    const diffHrs = Math.floor(diffMins/60);
    const remMins = diffMins%60;
    if(diffHrs < 24) return remMins ? `STARTS IN ${diffHrs}H ${remMins}M` : `STARTS IN ${diffHrs}H`;
    return `STARTS ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
  } catch { return null; }
}

function applyFilter() {
  const f=currentFilter, q=searchQ.trim().toLowerCase();
  let base=[...allChannels];
  if(f==='favs') base=base.filter(c=>favSlugs.has(c.slug));
  else if(f==='usa') base=base.filter(c=>region(c)==='usa');
  else if(f==='uk')  base=base.filter(c=>region(c)==='uk');
  else if(f==='ca')  base=base.filter(c=>region(c)==='ca');
  else if(f==='in')  base=base.filter(c=>region(c)==='in');
  else if(f==='latino') base=base.filter(c=>cat(c)==='latino'||region(c)==='latino');
  else if(f==='intl')   base=base.filter(c=>isIntl(c));
  else if(f==='247')    base=base.filter(c=>is247(c));
  else if(['sports','news','kids','anime'].includes(f)) base=base.filter(c=>cat(c)===f);
  else if(f==='az_a'){base=base.filter(c=>/^[a-hA-H0-9]/.test(c.name));base.sort((a,b)=>a.name.localeCompare(b.name));}
  else if(f==='az_i'){base=base.filter(c=>/^[i-qI-Q]/.test(c.name));base.sort((a,b)=>a.name.localeCompare(b.name));}
  else if(f==='az_r'){base=base.filter(c=>/^[r-zR-Z]/.test(c.name));base.sort((a,b)=>a.name.localeCompare(b.name));}
  filtered=q?base.filter(c=>c.name.toLowerCase().includes(q)):base;
  loadedCount=0; done=false;
  document.getElementById('channel-grid').innerHTML='';
  document.getElementById('grid-wrap').scrollTop=0;
  loadPage();
}

document.querySelector('.filterbar').addEventListener('click', e => {
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter=btn.dataset.filter;
  applyFilter();
});

let deb;
document.getElementById('search').addEventListener('input', e => {
  searchQ=e.target.value; clearTimeout(deb); deb=setTimeout(applyFilter,200);
});

function shortName(name) { return name.replace(/\s*\|.*$/,'').trim(); }
function regionLabel(name) { const m=name.match(/\|\s*(.+)$/); return m?m[1].trim():''; }

function makeCard(ch) {
  const card=document.createElement('div');
  card.className='ch-card';
  const sn=shortName(ch.name);
  const rl=regionLabel(ch.name);
  const isFav=favSlugs.has(ch.slug);
  const startLabel = formatStartTime(ch.start_time);
  card.innerHTML=`
    <div class="ch-thumb">
      ${ch.image
        ?`<img src="${BASE}${ch.image}" alt="${sn}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=ch-fallback>${sn}</div>'">`
        :`<div class="ch-fallback">${sn}</div>`}
      ${startLabel
        ?`<div class="ch-on-air" style="background:rgba(10,10,10,0.9);border-color:rgba(245,197,24,0.4);color:#f5c518;"><span style="width:4px;height:4px;border-radius:50%;background:#f5c518;display:inline-block"></span>${startLabel}</div>`
        :`<div class="ch-on-air"><span class="live-dot" style="width:4px;height:4px"></span>LIVE</div>`}
      <button class="ch-fav-btn ${isFav?'active':''}" data-slug="${ch.slug}" title="${isFav?'Remove favourite':'Add favourite'}">${isFav?'♥':'♡'}</button>
    </div>
    <div class="ch-info">
      <div class="ch-name">${sn}</div>
      ${rl?`<div class="ch-region">${rl}</div>`:''}
    </div>`;

  card.querySelector('.ch-fav-btn').addEventListener('click', async e => {
    e.stopPropagation();
    if(!currentUser) { window.NRGAuth?.open('login'); return; }
    await toggleFav(ch.slug);
    const btn=e.currentTarget;
    const isNowFav=favSlugs.has(ch.slug);
    btn.classList.toggle('active', isNowFav);
    btn.textContent=isNowFav?'♥':'♡';
    if(currentFilter==='favs') applyFilter();
  });

  card.addEventListener('click', ()=>openPopup(ch));
  return card;
}

function loadPage() {
  if(loading||done) return;
  loading=true;
  const grid=document.getElementById('channel-grid');
  const slice=filtered.slice(loadedCount, loadedCount+PAGE);
  if(loadedCount===0 && slice.length===0) {
    const msg = currentFilter==='favs' && !currentUser
      ? 'SIGN IN TO SEE YOUR FAVOURITES'
      : currentFilter==='favs'
      ? 'NO FAVOURITES YET — CLICK ♡ ON ANY CHANNEL'
      : 'NO CHANNELS FOUND';
    grid.innerHTML=`<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/></svg></div><div class="empty-text">${msg}</div></div>`;
    loading=false; done=true; return;
  }
  const frag=document.createDocumentFragment();
  slice.forEach(ch=>frag.appendChild(makeCard(ch)));
  grid.appendChild(frag);
  loadedCount+=slice.length;
  if(loadedCount>=filtered.length) done=true;
  loading=false;
}

new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting) loadPage();
},{rootMargin:'300px'}).observe(document.getElementById('sentinel'));

document.getElementById('grid-wrap').addEventListener('scroll', e=>{
  const el=e.target;
  if(!done && el.scrollTop+el.clientHeight>=el.scrollHeight-400) loadPage();
},{passive:true});

function updatePopupFavBtn() {
  if(!current) return;
  const btn=document.getElementById('popup-fav');
  const note=document.getElementById('popup-login-note');
  const isFav=favSlugs.has(current.slug);
  if(currentUser) {
    note.style.display='none';
    btn.style.display='';
    btn.classList.toggle('active', isFav);
    btn.textContent=isFav?'♥ REMOVE FROM FAVOURITES':'♡ ADD TO FAVOURITES';
  } else {
    btn.style.display='none';
    note.style.display='';
  }
}

function openPopup(ch) {
  current=ch;
  const sn=shortName(ch.name);
  document.getElementById('popup-title').textContent=sn;
  const logoEl=document.getElementById('popup-logo');
  logoEl.innerHTML=ch.image
    ?`<img src="${BASE}${ch.image}" alt="${sn}" style="width:80%;height:80%;object-fit:contain" onerror="this.outerHTML='<div class=popup-logo-fallback><svg viewBox=\\'0 0 24 24\\'><rect x=\\'2\\' y=\\'7\\' width=\\'20\\' height=\\'15\\' rx=\\'2\\'/></svg></div>'">`
    :`<div class="popup-logo-fallback"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/></svg></div>`;

  // Start time — shown when API provides it
  const startLabel = formatStartTime(ch.start_time);
  const onAirEl = document.getElementById('popup-on-air');
  if(startLabel) {
    onAirEl.style.color='#f5c518';
    onAirEl.innerHTML=`<span style="width:5px;height:5px;border-radius:50%;background:#f5c518;display:inline-block"></span>${startLabel}`;
  } else {
    onAirEl.style.color='';
    onAirEl.innerHTML=`<span class="live-dot"></span>ON AIR`;
  }

  // Event name — shown when API provides it
  const eventEl = document.getElementById('popup-event');
  if(ch.event) {
    eventEl.textContent = ch.event;
    eventEl.style.display = '';
  } else {
    eventEl.style.display = 'none';
  }

  updatePopupFavBtn();
  document.getElementById('popup-overlay').classList.add('open');
}

function closePopup() { document.getElementById('popup-overlay').classList.remove('open'); current=null; }

document.getElementById('popup-dismiss').addEventListener('click', closePopup);
document.getElementById('popup-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('popup-overlay')) closePopup();
});

document.getElementById('popup-fav').addEventListener('click', async () => {
  if(!currentUser) { window.NRGAuth?.open('login'); return; }
  if(!current) return;
  await toggleFav(current.slug);
  updatePopupFavBtn();
  const cardBtn=document.querySelector(`.ch-fav-btn[data-slug="${current.slug}"]`);
  if(cardBtn) {
    const isNowFav=favSlugs.has(current.slug);
    cardBtn.classList.toggle('active', isNowFav);
    cardBtn.textContent=isNowFav?'♥':'♡';
  }
  if(currentFilter==='favs') applyFilter();
});

document.getElementById('popup-watch').addEventListener('click', ()=>{
  if(!current) return;
  document.getElementById('player-name').textContent=shortName(current.name);
  document.getElementById('player-frame').src=`${BASE}/tou/live/${current.slug}?color=0000FF`;
  document.getElementById('player-view').classList.add('open');
  closePopup();
});

document.getElementById('player-close').addEventListener('click', ()=>{
  document.getElementById('player-view').classList.remove('open');
  document.getElementById('player-frame').src='';
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    closePopup();
    document.getElementById('player-view').classList.remove('open');
    document.getElementById('player-frame').src='';
  }
});

(async()=>{
  const grid=document.getElementById('channel-grid');
  for(let i=0;i<18;i++){
    const s=document.createElement('div'); s.className='ch-card';
    s.innerHTML=`<div class="skel" style="height:90px"></div><div style="padding:9px 10px"><div class="skel" style="height:9px;border-radius:2px;margin-bottom:5px"></div><div class="skel" style="height:8px;border-radius:2px;width:55%"></div></div>`;
    grid.appendChild(s);
  }
  try {
    const res=await fetch(`${BASE}/tou/api/channels`);
    allChannels=await res.json();
    document.getElementById('ch-count').textContent=`${allChannels.length} CH`;
    applyFilter();
  } catch(e) {
    grid.innerHTML=`<div class="empty-state"><div class="empty-text">FAILED TO LOAD CHANNELS</div></div>`;
  }
})();
</script>
<script type="module" src="nrg-auth-ui.js"></script>
</body>
</html>
