<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #dvd-img {
      position: fixed;
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 10px;
      z-index: 1;
      transition: filter 0.1s;
    }

    #dvd-fallback {
      position: fixed;
      width: 120px;
      height: 120px;
      border-radius: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #1a1a1a;
      border: 2px solid #444;
      z-index: 1;
      text-align: center;
      padding: 8px;
      line-height: 1.4;
    }

    #center-text {
      position: relative;
      z-index: 2;
      text-align: center;
      pointer-events: none;
    }

    #maintenance-label {
      font-size: 12px;
      color: #444;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    #main-title {
      font-size: 32px;
      font-weight: 500;
      color: #f0f0f0;
      letter-spacing: 0.02em;
    }

    #timer-block {
      position: relative;
      z-index: 2;
      margin-top: 32px;
      text-align: center;
    }

    #timer-label {
      font-size: 11px;
      color: #3a3a3a;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #timer-display {
      font-size: 42px;
      font-weight: 500;
      color: #b0b0b0;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.06em;
    }

    #zinko-credit {
      font-size: 11px;
      color: #2e2e2e;
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    #scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.07) 3px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="scanlines"></div>

  <img id="dvd-img" src="images/waiting.gif" alt="waiting"
    onerror="this.style.display='none'; document.getElementById('dvd-fallback').style.display='flex';" />
  <div id="dvd-fallback">waiting.png</div>

  <div id="center-text">
    <div id="maintenance-label">maintenance</div>
    <div id="main-title">NRG fell down the stairs</div>
  </div>

  <div id="timer-block">
    <div id="timer-label">you have been waiting</div>
    <div id="timer-display">00:00:00</div>
    <div id="zinko-credit">maintenance page idea from zinko inc (RIP)</div>
  </div>

  <script>
    const img = document.getElementById('dvd-img');
    const fallback = document.getElementById('dvd-fallback');
    const timerEl = document.getElementById('timer-display');

    const SIZE = 120;
    const colors = [
      '#e05c5c','#5c9ee0','#5ce07a','#e0c05c',
      '#c05ce0','#5ce0d4','#e07a5c','#ffffff'
    ];
    let ci = 0;

    let x = Math.random() * (window.innerWidth - SIZE);
    let y = Math.random() * (window.innerHeight - SIZE);
    let vx = 2.4;
    let vy = 1.9;

    function activeEl() {
      return img.style.display === 'none' ? fallback : img;
    }

    function applyColor() {
      const c = colors[ci % colors.length];
      ci++;
      const el = activeEl();
      el.style.filter = 'none';
      if (el === fallback) {
        el.style.borderColor = c;
        el.style.color = c;
      } else {
        el.style.outline = `3px solid ${c}`;
      }
    }

    function move() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      x += vx;
      y += vy;
      let bounced = false;
      if (x <= 0) { x = 0; vx = Math.abs(vx); bounced = true; }
      if (x + SIZE >= W) { x = W - SIZE; vx = -Math.abs(vx); bounced = true; }
      if (y <= 0) { y = 0; vy = Math.abs(vy); bounced = true; }
      if (y + SIZE >= H) { y = H - SIZE; vy = -Math.abs(vy); bounced = true; }
      if (bounced) applyColor();
      const el = activeEl();
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      requestAnimationFrame(move);
    }

    activeEl().style.left = x + 'px';
    activeEl().style.top = y + 'px';
    applyColor();
    requestAnimationFrame(move);

    const start = Date.now();
    function updateTimer() {
      const elapsed = Math.floor((Date.now() - start) / 1000);
      const h = Math.floor(elapsed / 3600);
      const m = Math.floor((elapsed % 3600) / 60);
      const s = elapsed % 60;
      timerEl.textContent =
        String(h).padStart(2, '0') + ':' +
        String(m).padStart(2, '0') + ':' +
        String(s).padStart(2, '0');
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
