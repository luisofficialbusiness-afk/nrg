<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRG Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0a1f3f;
            --bg-gradient-1: #0a0a0a;
            --bg-gradient-2: #0a1f3f;
            --bg-gradient-3: #001f4f;
            --bg-gradient-4: #0a0a0a;
            --card-bg: #1a1a1a;
            --card-hover-bg: #007bff;
            --card-text: white;
            --btn-bg: #007bff;
            --nav-icon-color: #00e5ff;
            --sidebar-bg: rgba(10, 18, 35, 0.85);
            --sidebar-border: rgba(0, 229, 255, 0.25);
            --sidebar-shadow: rgba(0, 229, 255, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1.logo { font-size: 3rem; margin: 20px 0; text-align: center; text-shadow: 0 0 15px var(--nav-icon-color); }

        .music-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            padding: 20px 20px 220px 20px;
        }

        .music-card {
            background-color: var(--card-bg);
            width: 170px;
            height: 240px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .music-card:hover {
            background-color: var(--card-hover-bg);
            box-shadow: 0 0 20px var(--btn-bg);
            transform: translateY(-5px);
        }

        .music-card img { width: 100%; height: 130px; object-fit: cover; }
        .text-content { padding: 10px; text-align: center; }
        .music-card h3 { font-size: 0.85rem; margin-bottom: 5px; color: white; }
        .music-card p { font-size: 0.7rem; color: #aaa; }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 700px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid var(--sidebar-border);
            padding: 15px 25px;
            z-index: 9998;
            box-shadow: 0 0 25px var(--sidebar-shadow);
        }

        .player-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        
        .now-playing-info { display: flex; align-items: center; gap: 12px; width: 220px; }
        .now-playing-info img { width: 45px; height: 45px; border-radius: 8px; border: 1px solid var(--nav-icon-color); object-fit: cover; }

        .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; }
        .progress-container span { font-size: 0.65rem; min-width: 35px; color: var(--nav-icon-color); }
        
        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            accent-color: var(--nav-icon-color);
            height: 4px;
        }

        .player-controls { display: flex; align-items: center; gap: 20px; }
        .player-controls i { color: var(--nav-icon-color); font-size: 1.4rem; cursor: pointer; transition: 0.2s; }
        .player-controls i:hover { transform: scale(1.2); text-shadow: 0 0 10px var(--nav-icon-color); }

        /* Bottom Sidebar */
       .bottom-sidebar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 14px;
  padding: 10px 18px;

  background: var(--sidebar-bg);
  backdrop-filter: blur(10px);

  border-radius: 40px;
  border: 1px solid var(--sidebar-border);

  z-index: 9999;
}


.nav-icon {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;
  cursor: pointer;

  font-size: 20px;
  color: var(--icon-color);

  transition: background 0.2s ease;
}


.nav-icon:hover {
  background: rgba(255,255,255,0.05);
}


.nav-icon.active {
  background: rgba(255,255,255,0.08);
  color: white;
}
    </style>
</head>
<body>

<h1 class="logo">NRG MUSIC</h1>

<div class="music-container">
    <div class="music-card" onclick="playTrack(this, 'Expresso', 'Sabrina Carpenter', 'images/espresso.webp', 'music/Espresso.mp3')">
        <img src="images/espresso.webp" alt="Song">
        <div class="text-content">
            <h3>Expresso</h3>
            <p>Sabrina Carpenter</p>
        </div>
    </div>

    <div class="music-card" onclick="playTrack(this, 'Washing Machine Heart', 'Mitski', 'images/wmh.jpg', 'music/Washing Machine Heart.mp3')">
        <img src="images/wmh.jpg" alt="Song">
        <div class="text-content">
            <h3>Washing Machine Heart</h3>
            <p>Mitski</p>
        </div>
    </div>

    <div class="music-card" onclick="playTrack(this, 'Golden Hour', 'JVKE', 'images/JVKE_-_Golden_Hour.png', 'music/golden hour.mp3')">
        <img src="images/JVKE_-_Golden_Hour.png" alt="Song">
        <div class="text-content">
            <h3>Golden Hour</h3>
            <p>JVKE</p>
        </div>
    </div>

    <div class="music-card" onclick="playTrack(this, 'LO QUE LE PASÓ A HAWAii', 'Bad Bunny', 'images/LO QUE LE PASÓ A HAWAii.jpg', 'music/LO QUE LE PASÓ A HAWAii.mp3')">
        <img src="images/LO QUE LE PASÓ A HAWAii.jpg" alt="Song">
        <div class="text-content">
            <h3>LO QUE LE PASÓ A HAWAii</h3>
            <p>Bad Bunny</p>
        </div>
    </div>

    <div class="music-card" onclick="playTrack(this, 'MATADORA', 'DJ Asul', 'images/ab67616d0000b2738630ce04dcdf0c89f218b7d8.jpg', 'music/MATADORA.mp3')">
        <img src="images/ab67616d0000b2738630ce04dcdf0c89f218b7d8.jpg" alt="Song">
        <div class="text-content">
            <h3>MATADORA</h3>
            <p>DJ Asul</p>
        </div>
    </div>

     <div class="music-card" onclick="playTrack(this, 'this is what falling in love feels like', 'J4KE', 'images/this is what falling in love feels like.jpg', 'music/this is what falling in love feels like.mp3')">
        <img src="images/this is what falling in love feels like.jpg" alt="Song">
        <div class="text-content">
            <h3>this is what falling in love feels like</h3>
            <p>J4KE</p>
        </div>
    </div>

     <div class="music-card" onclick="playTrack(this, 'Die With A Smile', 'Lady GaGa', 'images/Die With A Smile.jpg', 'music/Die With A Smile.mp3')">
        <img src="images/Die With A Smile.jpg" alt="Song">
        <div class="text-content">
            <h3>Die With A Smile</h3>
            <p>Lady GaGa</p>
        </div>
    </div>

     <div class="music-card" onclick="playTrack(this, 'Join Us for a Bite', 'JT Music', 'images/Join Us for a Bite.jpg', 'music/Join Us for a Bite.mp3')">
        <img src="images/Join Us for a Bite.jpg" alt="Song">
        <div class="text-content">
            <h3>Join Us for a Bite</h3>
            <p>JT Music</p>
        </div>
    </div>
</div>

<div class="player-bar">
    <div class="player-top">
        <div class="now-playing-info">
            <img src="https://via.placeholder.com/50" id="current-art">
            <div style="overflow: hidden;">
                <div id="current-track-name" style="white-space: nowrap; font-weight: bold; font-size: 0.8rem;">Idle</div>
                <div id="current-artist-name" style="font-size: 0.6rem; color: var(--nav-icon-color);">Select a song</div>
            </div>
        </div>

        <div class="player-controls">
            <i class="fas fa-step-backward" onclick="prevTrack()"></i>
            <i class="fas fa-play" id="masterPlay" onclick="toggleAudio()"></i>
            <i class="fas fa-step-forward" onclick="nextTrack()"></i>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="range" style="width: 60px;" min="0" max="100" value="100" oninput="setVolume(this.value)">
        </div>
    </div>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100" oninput="seekAudio()">
        <span id="time-total">0:00</span>
    </div>
</div>

<div class="bottom-sidebar">
    <div class="nav-icon" data-page="index.html">🏠</div>
    <div class="nav-icon" data-page="games.html">🎮</div>
    <div class="nav-icon" data-page="movies.html">🎬</div>
    <div class="nav-icon" data-page="ai.html">🤖</div>
    <div class="nav-icon" data-page="proxy.html">🌐</div>
    <div class="nav-icon active" data-page="music.html">🎵</div>
    <div class="nav-icon" data-page="settings.html">⚙</div>
</div>

<audio id="audio-player"></audio>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('masterPlay');
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    
    let currentCard = null; // Keeps track of which HTML element is "active"

    function playTrack(element, name, artist, art, url) {
        currentCard = element; // Save the clicked card
        
        document.getElementById('current-track-name').innerText = name;
        document.getElementById('current-artist-name').innerText = artist;
        document.getElementById('current-art').src = art;
        
        audio.src = url;
        audio.play();
        playBtn.className = "fas fa-pause";
    }

    function toggleAudio() {
        if (!audio.src) return;
        if (audio.paused) {
            audio.play();
            playBtn.className = "fas fa-pause";
        } else {
            audio.pause();
            playBtn.className = "fas fa-play";
        }
    }

    // SKIP FORWARD
    function nextTrack() {
        if (!currentCard) return;
        let next = currentCard.nextElementSibling;
        // If it's the last card, go back to the first one
        if (!next || !next.classList.contains('music-card')) {
            next = document.querySelector('.music-card');
        }
        next.click(); // Trigger the onclick of the next card
    }

    // SKIP BACKWARD
    function prevTrack() {
        if (!currentCard) return;
        let prev = currentCard.previousElementSibling;
        // If it's the first card, go to the last one
        if (!prev || !prev.classList.contains('music-card')) {
            const allCards = document.querySelectorAll('.music-card');
            prev = allCards[allCards.length - 1];
        }
        prev.click(); // Trigger the onclick of the previous card
    }

    // SCRUBBER (Skip to point in song)
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.value = percent;
            timeCurrent.innerText = formatTime(audio.currentTime);
            timeTotal.innerText = formatTime(audio.duration);
        }
    });

    function seekAudio() {
        if (!audio.duration) return;
        const seekTo = audio.duration * (progressBar.value / 100);
        audio.currentTime = seekTo;
    }

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function setVolume(v) { audio.volume = v / 100; }

    // Auto-play next song when finished
    audio.addEventListener('ended', nextTrack);

    // Sidebar Navigation
    document.querySelectorAll('.nav-icon').forEach(icon => {
        icon.addEventListener('click', () => {
            const page = icon.dataset.page;
            if (page) window.location.href = "/" + page;
        });
    });
</script>

</body>
</html>
