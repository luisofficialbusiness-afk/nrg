<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRG Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0a1f3f;
            --bg-gradient-1: #0a0a0a;
            --bg-gradient-2: #0a1f3f;
            --bg-gradient-3: #001f4f;
            --bg-gradient-4: #0a0a0a;

            --card-bg: #1a1a1a;
            --card-hover-bg: #007bff;
            --card-text: white;
            --btn-bg: #007bff;
            --btn-text: white;
            --btn-hover-bg: #005bb5;

            --sidebar-bg: rgba(10, 18, 35, 0.85);
            --sidebar-border: rgba(0, 229, 255, 0.25);
            --sidebar-shadow: rgba(0, 229, 255, 0.25);
            --nav-icon-color: #00e5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1.logo {
            font-size: 4rem;
            margin: 20px 0;
            text-align: center;
            color: var(--card-text);
            text-shadow: 0 0 15px var(--nav-icon-color);
        }

        /* Music Grid - Matching Game Card Style */
        .music-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            padding: 20px 20px 150px 20px; /* Space for sidebar and player */
        }

        .music-card {
            background-color: var(--card-bg);
            width: 170px;
            height: 240px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            padding-bottom: 15px;
        }

        .music-card:hover {
            background-color: var(--card-hover-bg);
            box-shadow: 0 0 20px var(--btn-bg);
            transform: translateY(-5px);
        }

        .music-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .music-card .text-content {
            padding: 5px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .music-card h3 { font-size: 0.9rem; color: var(--card-text); }
        .music-card p { font-size: 0.7rem; color: #aaa; margin-top: 4px; }

        /* Floating Audio Player */
        .player-bar {
            position: fixed;
            bottom: 100px; /* Sits above the sidebar */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            border: 1px solid var(--sidebar-border);
            padding: 10px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9998;
            box-shadow: 0 0 20px var(--sidebar-shadow);
        }

        .now-playing-info { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; width: 150px; }
        .now-playing-info img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--nav-icon-color); }

        .player-controls i {
            color: var(--nav-icon-color);
            font-size: 1.5rem;
            cursor: pointer;
            margin: 0 15px;
            transition: 0.2s;
        }

        .player-controls i:hover { transform: scale(1.2); text-shadow: 0 0 10px var(--nav-icon-color); }

        /* SIDEBAR FROM FILE */
        .bottom-sidebar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            padding: 14px 26px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(14px);
            border-radius: 60px;
            border: 1px solid var(--sidebar-border);
            box-shadow: 0 0 30px var(--sidebar-shadow);
            z-index: 9999;
        }

        .nav-icon {
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; cursor: pointer;
            font-size: 22px; color: var(--nav-icon-color);
            transition: all 0.25s ease;
        }

        .nav-icon:hover {
            background: linear-gradient(135deg, var(--btn-bg), #0066ff);
            color: #000;
            transform: translateY(-6px);
            box-shadow: 0 0 20px var(--btn-bg);
        }

        .nav-icon.active {
            background: linear-gradient(135deg, var(--btn-bg), #0066ff);
            color: #000;
            box-shadow: 0 0 20px var(--btn-bg);
        }
    </style>
</head>
<body>

<h1 class="logo">NRG MUSIC</h1>


    <div class="music-card" onclick="playTrack('Expresso', 'Sabrina Carpenter', 'images/Espresso_-_Sabrina_Carpenter.png', 'music/Espresso.mp3')">
        <img src="images/espresso.webp" alt="Song">
        <div class="text-content">
            <h3>Expresso</h3>
            <p>Sabrina Carpenter</p>
        </div>
    </div>


<div class="player-bar">
    <div class="now-playing-info">
        <img src="https://via.placeholder.com/50" id="current-art">
        <div style="overflow: hidden;">
            <div id="current-track-name" style="white-space: nowrap; font-weight: bold;">Idle</div>
            <div id="current-artist-name" style="font-size: 0.6rem; color: var(--nav-icon-color);">Select a song</div>
        </div>
    </div>
    <div class="player-controls">
        <i class="fas fa-step-backward"></i>
        <i class="fas fa-play" id="masterPlay" onclick="toggleAudio()"></i>
        <i class="fas fa-step-forward"></i>
    </div>
    <input type="range" style="width: 80px; accent-color: var(--nav-icon-color);" onchange="setVolume(this.value)">
</div>

<div class="bottom-sidebar">
    <div class="nav-icon" data-page="index.html">🏠</div>
    <div class="nav-icon" data-page="games.html">🎮</div>
    <div class="nav-icon" data-page="movies.html">🎬</div>
    <div class="nav-icon" data-page="ai.html">🤖</div>
    <div class="nav-icon" data-page="proxy.html">🌐</div>
    <div class="nav-icon active" data-page="music.html">🎵</div>
    <div class="nav-icon" data-page="settings.html">⚙</div>
</div>

<audio id="audio-player"></audio>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('masterPlay');

    function playTrack(name, artist, art, url) {
        document.getElementById('current-track-name').innerText = name;
        document.getElementById('current-artist-name').innerText = artist;
        document.getElementById('current-art').src = art;
        audio.src = url;
        audio.play();
        playBtn.className = "fas fa-pause";
    }

    function toggleAudio() {
        if (audio.paused) {
            audio.play();
            playBtn.className = "fas fa-pause";
        } else {
            audio.pause();
            playBtn.className = "fas fa-play";
        }
    }

    function setVolume(v) {
        audio.volume = v / 100;
    }

    // Exact Sidebar Script from your file
    document.querySelectorAll('.bottom-sidebar .nav-icon').forEach(icon => {
        icon.addEventListener('click', () => {
            const page = icon.dataset.page;
            if (page) {
                window.location.href = "/" + page;
            }
        });
    });
</script>
    <script src="index.js"></script>

</body>
</html>
