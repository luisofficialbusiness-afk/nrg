<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Orbitron', sans-serif;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
  }

  @keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

  .iframe-container {
    flex: 1 1 auto; /* takes all available space */
    width: 100%;
    overflow: hidden;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

.bottom-sidebar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  gap: 14px;
  padding: 10px 18px;

  background: var(--sidebar-bg);
  backdrop-filter: blur(10px);

  border-radius: 40px;
  border: 1px solid var(--sidebar-border);

  z-index: 9999;
}


.nav-icon {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;
  cursor: pointer;

  font-size: 20px;
  color: var(--icon-color);

  transition: background 0.2s ease;
}


.nav-icon:hover {
  background: rgba(255,255,255,0.05);
}


.nav-icon.active {
  background: rgba(255,255,255,0.08);
  color: white;
}
</style>
</head>
<body>

<div class="iframe-container">
  <iframe src="/tiny?go=https://rousing-nrg-ai-go.base44.app/" allowfullscreen></iframe>
</div>

<div class="bottom-sidebar">
    <div class="nav-icon" data-page="index.html">🏠</div>
    <div class="nav-icon" data-page="games.html">🎮</div>
    <div class="nav-icon" data-page="movies.html">🎬</div>
    <div class="nav-icon" data-page="ai.html">🤖</div>
    <div class="nav-icon" data-page="proxy.html">🌐</div>
    <div class="nav-icon" data-page="settings.html">⚙</div>
</div>

<script>
document.querySelectorAll('.bottom-sidebar .nav-icon').forEach(icon => {

    const currentPage = window.location.pathname.split("/").pop();

    if (icon.dataset.page === currentPage) {
        icon.classList.add("active");
    }

    icon.addEventListener('click', () => {
        const page = icon.dataset.page;
        if (page) {
            window.location.href = "/" + page;
        }
    });

});

</script>
    <script>

window.addEventListener('load', () => {
   
    addXP(5);
    addCoins(2)

    addProgress("aiUses", 1);

    console.log("AI page XP added and progress updated.");
});
</script>
    <script src="index.js"></script>
<script src="nrg-system.js"></script>

</body>
</html>
