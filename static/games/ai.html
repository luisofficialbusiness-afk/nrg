<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG AI</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --nrg-bg:#0a0b0d;
    --nrg-panel:#0f1116;
    --nrg-border:#1e2530;
    --nrg-accent:#00d4ff;
    --nrg-accent2:#7c3aed;
    --nrg-accent3:#10b981;
    --nrg-text:#c8d6e5;
    --nrg-muted:#4a5568;
  }
  body{
    background:var(--nrg-bg);
    color:var(--nrg-text);
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
  }
  header{
    position:relative;
    z-index:10;
    background:var(--nrg-panel);
    border-bottom:1px solid var(--nrg-border);
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:16px;
    height:56px;
    flex-shrink:0;
  }
  header::after{
    content:'';
    position:absolute;
    bottom:0;left:0;right:0;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--nrg-accent),transparent);
    opacity:0.6;
  }
  .logo{
    font-family:'Orbitron',monospace;
    font-size:20px;
    font-weight:900;
    color:var(--nrg-accent);
    letter-spacing:4px;
    text-shadow:0 0 20px rgba(0,212,255,0.5);
  }
  .logo span{
    color:var(--nrg-muted);
    font-size:11px;
    font-weight:400;
    letter-spacing:2px;
    font-family:'Share Tech Mono',monospace;
    display:block;
    margin-top:-4px;
  }
  nav{display:flex;gap:4px;margin-left:20px}
  nav a{
    color:var(--nrg-muted);
    text-decoration:none;
    font-family:'Rajdhani',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:3px;
    transition:all 0.2s;
  }
  nav a:hover,nav a.active{color:var(--nrg-accent);background:rgba(0,212,255,0.08)}
  nav a.active{border:1px solid rgba(0,212,255,0.2)}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--nrg-accent3);
    box-shadow:0 0 8px var(--nrg-accent3);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .status-label{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--nrg-accent3);letter-spacing:1px}
  .model-select{
    background:rgba(0,212,255,0.05);
    border:1px solid var(--nrg-border);
    color:var(--nrg-accent);
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:3px;
    outline:none;
    cursor:pointer;
    letter-spacing:1px;
  }
  .model-select:focus{border-color:var(--nrg-accent)}
  .model-select option{background:#0f1116;color:var(--nrg-text)}
  main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
  .chat-area{
    flex:1;overflow-y:auto;padding:20px;
    display:flex;flex-direction:column;gap:16px;
    scrollbar-width:thin;scrollbar-color:var(--nrg-border) transparent;
  }
  .chat-area::-webkit-scrollbar{width:4px}
  .chat-area::-webkit-scrollbar-thumb{background:var(--nrg-border);border-radius:2px}
  .welcome{
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;flex:1;gap:24px;
    padding:40px 20px;text-align:center;
  }
  .welcome-logo{
    font-family:'Orbitron',monospace;font-size:48px;font-weight:900;
    color:var(--nrg-accent);text-shadow:0 0 40px rgba(0,212,255,0.4);
    letter-spacing:8px;animation:flicker 4s infinite;
  }
  @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:0.8}94%{opacity:1}97%{opacity:0.9}98%{opacity:1}}
  .welcome-sub{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--nrg-muted);letter-spacing:3px;text-transform:uppercase}
  .welcome-desc{color:var(--nrg-muted);max-width:420px;line-height:1.7;font-size:15px}
  .starter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:500px;width:100%;margin-top:8px}
  .starter-btn{
    background:rgba(0,212,255,0.04);border:1px solid var(--nrg-border);
    color:var(--nrg-text);padding:12px 14px;border-radius:4px;cursor:pointer;
    font-family:'Rajdhani',sans-serif;font-size:13px;text-align:left;
    transition:all 0.2s;line-height:1.4;
  }
  .starter-btn:hover{border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.08);color:var(--nrg-accent)}
  .starter-icon{font-size:16px;display:block;margin-bottom:4px}
  .msg{display:flex;gap:12px;animation:fadeIn 0.3s ease;max-width:840px;width:100%;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{flex-direction:row-reverse}
  .msg-avatar{
    width:32px;height:32px;flex-shrink:0;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;
  }
  .msg.user .msg-avatar{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.4);color:#a78bfa}
  .msg.ai .msg-avatar{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--nrg-accent)}
  .msg-body{flex:1}
  .msg-role{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .msg.user .msg-role{color:rgba(167,139,250,0.7);text-align:right}
  .msg.ai .msg-role{color:rgba(0,212,255,0.6)}
  .msg-bubble{padding:12px 16px;border-radius:4px;line-height:1.7;font-size:15px}
  .msg.user .msg-bubble{
    background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);
    color:#e2d9f3;text-align:right;border-radius:4px 0 4px 4px;
  }
  .msg.ai .msg-bubble{
    background:rgba(0,212,255,0.04);border:1px solid var(--nrg-border);
    border-left:2px solid rgba(0,212,255,0.4);color:var(--nrg-text);border-radius:0 4px 4px 4px;
  }
  .msg.ai .msg-bubble pre{
    background:rgba(0,0,0,0.4);border:1px solid var(--nrg-border);border-radius:3px;
    padding:10px 12px;overflow-x:auto;margin:10px 0;
    font-family:'Share Tech Mono',monospace;font-size:12px;line-height:1.6;color:#7dd3fc;
  }
  .msg.ai .msg-bubble code{
    font-family:'Share Tech Mono',monospace;font-size:12px;color:#7dd3fc;
    background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:2px;
  }
  .typing{display:flex;gap:5px;align-items:center;padding:12px 16px}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--nrg-accent);
    opacity:0.5;animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.2s}
  .typing span:nth-child(3){animation-delay:0.4s}
  @keyframes blink{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
  .input-zone{
    background:var(--nrg-panel);border-top:1px solid var(--nrg-border);
    padding:16px 20px;position:relative;flex-shrink:0;
  }
  .input-zone::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent);
  }
  .input-row{display:flex;gap:10px;align-items:flex-end;max-width:840px;margin:0 auto}
  .input-wrap{flex:1;position:relative}
  .prompt-label{
    font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--nrg-accent);
    letter-spacing:2px;margin-bottom:6px;display:block;opacity:0.7;
  }
  textarea{
    width:100%;background:rgba(0,212,255,0.03);border:1px solid var(--nrg-border);
    border-radius:4px;color:var(--nrg-text);font-family:'Rajdhani',sans-serif;
    font-size:15px;padding:10px 14px;resize:none;outline:none;
    min-height:44px;max-height:180px;line-height:1.5;transition:border-color 0.2s;overflow-y:auto;
  }
  textarea::placeholder{color:var(--nrg-muted)}
  textarea:focus{border-color:rgba(0,212,255,0.4)}
  .send-btn{
    background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.4);
    color:var(--nrg-accent);width:44px;height:44px;border-radius:4px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;font-size:18px;
  }
  .send-btn:hover:not(:disabled){background:rgba(0,212,255,0.2);box-shadow:0 0 16px rgba(0,212,255,0.2)}
  .send-btn:disabled{opacity:0.3;cursor:not-allowed}
  .clear-btn{
    background:transparent;border:1px solid var(--nrg-border);color:var(--nrg-muted);
    padding:0 12px;height:44px;border-radius:4px;cursor:pointer;
    font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;
    text-transform:uppercase;transition:all 0.2s;flex-shrink:0;
  }
  .clear-btn:hover{border-color:rgba(255,80,80,0.4);color:#f87171}
  .footer-info{
    text-align:center;margin-top:10px;font-family:'Share Tech Mono',monospace;
    font-size:10px;color:var(--nrg-muted);letter-spacing:1px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">NRG<span>// LEARNING TERMINAL</span></div>
  <nav>
<a href="/proxy">PROXY</a>
  </nav>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-label">ONLINE</span>
    <select class="model-select" id="modelSelect">
      <option value="google/gemini-2.0-flash-001">GEMINI 2.0 FLASH</option>
      <option value="openai/gpt-4o-mini">GPT-4O MINI</option>
      <option value="anthropic/claude-3-haiku">CLAUDE HAIKU</option>
      <option value="meta-llama/llama-3.1-8b-instruct:free">LLAMA 3.1 8B FREE</option>
      <option value="deepseek/deepseek-chat">DEEPSEEK V3</option>
      <option value="mistralai/mistral-7b-instruct:free">MISTRAL 7B FREE</option>
    </select>
  </div>
</header>
<main>
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">NRG AI</div>
      <div class="welcome-sub">// ARTIFICIAL INTELLIGENCE MODULE //</div>
      <p class="welcome-desc">Powered by OpenRouter. Access multiple AI models through the NRG learning terminal. Ask anything — code, homework, ideas, or just chat.</p>
      <div class="starter-grid">
        <button class="starter-btn" onclick="sendStarter(this)">Explain quantum computing simply</button>
        <button class="starter-btn" onclick="sendStarter(this)">Write a Python web scraper</button>
        <button class="starter-btn" onclick="sendStarter(this)">Help me with calculus derivatives</button>
        <button class="starter-btn" onclick="sendStarter(this)">How does the internet work?</button>
      </div>
    </div>
  </div>
  <div class="input-zone">
    <div class="input-row">
      <div class="input-wrap">
        <span class="prompt-label">&#9658; QUERY INPUT</span>
        <textarea id="inputBox" placeholder="Enter your message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">&#10148;</button>
      <button class="clear-btn" onclick="clearChat()">CLR</button>
    </div>
    <div class="footer-info">NRG LEARNING &middot; AI MODULE &middot; POWERED BY OPENROUTER</div>
  </div>
</main>

<script>
const API_KEY = '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';
const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
let history = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendStarter(btn) {
  document.getElementById('inputBox').value = btn.textContent.trim();
  sendMessage();
}

function clearChat() {
  history = [];
  const area = document.getElementById('chatArea');
  area.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-logo">NRG AI</div>
      <div class="welcome-sub">// ARTIFICIAL INTELLIGENCE MODULE //</div>
      <p class="welcome-desc">Powered by OpenRouter. Access multiple AI models through the NRG learning terminal. Ask anything — code, homework, ideas, or just chat.</p>
      <div class="starter-grid">
        <button class="starter-btn" onclick="sendStarter(this)"><span class="starter-icon">⚡</span>Explain quantum computing simply</button>
        <button class="starter-btn" onclick="sendStarter(this)"><span class="starter-icon">💻</span>Write a Python web scraper</button>
        <button class="starter-btn" onclick="sendStarter(this)"><span class="starter-icon">📐</span>Help me with calculus derivatives</button>
        <button class="starter-btn" onclick="sendStarter(this)"><span class="starter-icon">🌐</span>How does the internet work?</button>
      </div>
    </div>`;
}

function appendMsg(role, text) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? 'YOU' : 'NRG'}</div>
    <div class="msg-body">
      <div class="msg-role">${role === 'user' ? '// USER' : '// AI RESPONSE'}</div>
      <div class="msg-bubble">${formatText(text)}</div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div.querySelector('.msg-bubble');
}

function appendTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">NRG</div><div class="msg-body"><div class="msg-role">// PROCESSING</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function formatText(text) {
  text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

async function sendMessage() {
  if (isLoading) return;
  const box = document.getElementById('inputBox');
  const msg = box.value.trim();
  if (!msg) return;
  const model = document.getElementById('modelSelect').value;
  box.value = ''; autoResize(box);
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  history.push({ role: 'user', content: msg });
  appendMsg('user', msg);
  appendTyping();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + API_KEY,
        'Content-Type': 'application/json',
        'HTTP-Referer': 'https://nrglearning.installgentoo.com',
        'X-Title': 'NRG AI'
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: 'You are NRG AI, a helpful assistant on the NRG Learning terminal. Be concise, accurate, and helpful. You can assist with homework, coding, general knowledge, and anything educational.' },
          ...history
        ],
        max_tokens: 1500,
        stream: true
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'API error ' + res.status); }
    removeTyping();
    let full = '';
    const bubble = appendMsg('ai', '');
    const reader = res.body.getReader(); const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') break;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content || '';
          full += delta;
          bubble.innerHTML = formatText(full);
          document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
        } catch (e) {}
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    removeTyping();
    appendMsg('ai', '&#9888; ERROR: ' + err.message + '\n\nCheck your connection or try a different model.');
    history.pop();
  }
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  box.focus();
}
</script>
</body>
</html>
