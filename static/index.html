<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRG</title>
  <script src="/sail/baremux/index.js"></script>
  <script src="/sail/scram/scramjet.all.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a; --surface3: #222;
      --border: #2a2a2a; --accent: #c50cf9; --accent-dim: rgba(197,12,249,0.10);
      --accent-glow: rgba(197,12,249,0.25); --text: #e8e8e8; --text-dim: #666;
      --text-muted: #3a3a3a; --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
      --tab-h: 38px; --bar-h: 42px;
    }
    html, body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── TAB BAR ── */
    #tab-bar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--tab-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-end; padding: 0 8px; gap: 2px;
      overflow-x: auto; overflow-y: hidden; z-index: 2000;
    }
    #tab-bar::-webkit-scrollbar { display: none; }
    #tab-list { display: flex; align-items: flex-end; gap: 2px; flex: 1; min-width: 0; }

    .tab {
      flex-shrink: 0; height: 30px; min-width: 90px; max-width: 180px;
      background: var(--surface2); border: 1px solid var(--border);
      border-bottom: none; border-radius: 6px 6px 0 0;
      display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px;
      cursor: pointer; user-select: none; transition: background 0.13s;
    }
    .tab:hover { background: var(--surface3); }
    .tab.active {
      background: var(--bg); border-color: var(--border);
      border-bottom: 1px solid var(--bg); margin-bottom: -1px; z-index: 1;
      border-top-color: var(--accent);
    }
    .tab-favicon { width: 13px; height: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .tab-favicon img { width: 13px; height: 13px; object-fit: contain; border-radius: 2px; }
    .tab-favicon .tab-icon-svg { width: 11px; height: 11px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; }
    .tab-favicon .tab-icon-nrg { width: 11px; height: 11px; fill: var(--accent); }
    .tab-name { flex: 1; font-family: var(--mono); font-size: 8px; letter-spacing: 0.04em; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tab.active .tab-name { color: var(--text); }
    .tab-close { width: 14px; height: 14px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); flex-shrink: 0; transition: background 0.1s, color 0.1s; line-height: 1; }
    .tab-close:hover { background: rgba(255,58,58,0.2); color: #ff3a3a; }

    #new-tab-btn {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 4px;
      border: 1px solid var(--border); background: none; color: var(--text-muted);
      font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; align-self: center; margin-bottom: 2px;
      transition: border-color 0.13s, color 0.13s;
    }
    #new-tab-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── NAV BAR ── */
    #nav-bar {
      position: fixed; top: var(--tab-h); left: 0; right: 0; height: var(--bar-h);
      background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 1900;
    }
    .nav-btn {
      width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--text-muted); cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      transition: border-color 0.13s, color 0.13s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #url-bar-wrap {
      flex: 1; display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden; transition: border-color 0.18s;
    }
    #url-bar-wrap:focus-within { border-color: var(--accent); }
    #url-bar {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--mono); font-size: 10px;
      padding: 0 12px; caret-color: var(--accent); letter-spacing: 0.03em;
    }
    #url-bar::placeholder { color: var(--text-muted); }
    #url-go {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--text-muted); padding: 0 12px; cursor: pointer; font-family: var(--mono);
      font-size: 8px; letter-spacing: 0.12em; transition: color 0.13s, background 0.13s;
    }
    #url-go:hover { color: var(--accent); background: var(--accent-dim); }

    /* ── VIEWPORT ── */
    #nrg-viewport {
      position: fixed; left: 0; right: 0;
      top: calc(var(--tab-h) + var(--bar-h)); bottom: 0;
      display: none; background: #fff;
    }
    #nrg-viewport.visible { display: block; }
    #nrg-viewport iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; background: #fff; display: none;
    }
    #nrg-viewport iframe.visible { display: block; }

    /* ── NEW TAB / DASHBOARD ── */
    #nrg-dashboard {
      position: fixed; left: 0; right: 0; top: calc(var(--tab-h) + var(--bar-h)); bottom: 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px; background: var(--bg);
      transition: opacity 0.2s; z-index: 1;
    }
    #nrg-dashboard.hidden { opacity: 0; pointer-events: none; }
    #bg-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }

    .nrg-clock {
      position: absolute; top: 18px; right: 24px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
      color: var(--text-muted); z-index: 1; pointer-events: none;
    }
    .nrg-logo-wrap { text-align: center; position: relative; z-index: 1; user-select: none; }
    .nrg-logo-wrap h1 {
      font-family: var(--mono); font-size: clamp(4rem,12vw,8rem); font-weight: 700;
      color: var(--text); letter-spacing: 0.15em; position: relative; display: inline-block;
    }
    .logo-rule { height: 1px; background: linear-gradient(90deg,transparent,var(--accent),transparent); margin-top: 8px; opacity: 0.4; }
    .logo-sub { font-family: var(--mono); font-size: 9px; letter-spacing: 0.25em; color: var(--text-muted); margin-top: 10px; text-transform: uppercase; }

    .nrg-input-wrap { width: 90%; max-width: 520px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
    .search-form {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden; transition: border-color 0.18s;
    }
    .search-form:focus-within { border-color: var(--accent); }
    .input-icon { display: flex; align-items: center; padding: 0 13px; color: var(--text-muted); flex-shrink: 0; }
    .input-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    #nrg-query {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--sans); font-size: 13px;
      padding: 13px 6px; caret-color: var(--accent);
    }
    #nrg-query::placeholder { color: var(--text-muted); }
    .go-btn {
      background: var(--accent); border: none; color: #000;
      font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: 0.15em; padding: 0 18px; cursor: pointer;
      transition: opacity 0.13s; flex-shrink: 0;
    }
    .go-btn:hover { opacity: 0.85; }
    .input-hint { font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; color: var(--text-muted); text-align: center; }

    /* ── BOOKMARKS ── */
    .bookmarks-section { position: relative; z-index: 1; width: 90%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; }
    .bookmarks-label { font-family: var(--mono); font-size: 8px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }

    .pinned-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .pinned-item {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; padding: 5px 12px; cursor: pointer;
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em;
      color: var(--accent); transition: border-color 0.13s, background 0.13s;
      user-select: none;
    }
    .pinned-item:hover { border-color: var(--accent); background: var(--accent-dim); }
    .pinned-item svg { width: 10px; height: 10px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .bookmarks-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 24px; }
    .bookmark-item {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; padding: 4px 10px; cursor: pointer;
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.08em;
      color: var(--text-dim); transition: border-color 0.13s, color 0.13s;
      position: relative;
    }
    .bookmark-item:hover { border-color: var(--accent); color: var(--accent); }
    .bookmark-item img { width: 12px; height: 12px; object-fit: contain; border-radius: 2px; }
    .bookmark-del {
      display: none; position: absolute; top: -5px; right: -5px;
      width: 13px; height: 13px; border-radius: 50%;
      background: #ff3a3a; color: #fff; font-size: 9px; font-weight: 700;
      align-items: center; justify-content: center; cursor: pointer; z-index: 2;
    }
    .bookmark-item:hover .bookmark-del { display: flex; }
    .add-bm-btn {
      width: 24px; height: 24px; border-radius: 3px; border: 1px solid var(--border);
      background: none; color: var(--text-muted); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.13s, color 0.13s; flex-shrink: 0;
    }
    .add-bm-btn:hover { border-color: var(--accent); color: var(--accent); }

    .bookmark-form {
      display: none; flex-direction: column; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-top: 2px solid var(--accent); border-radius: 4px; padding: 14px;
    }
    .bookmark-form.open { display: flex; }
    .bookmark-form input {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-family: var(--sans); font-size: 12px;
      padding: 8px 10px; border-radius: 3px; outline: none; transition: border-color 0.15s;
    }
    .bookmark-form input:focus { border-color: var(--accent); }
    .bookmark-form input::placeholder { color: var(--text-muted); }
    .bm-form-row { display: flex; gap: 6px; }
    .bm-save { background: var(--accent); border: none; color: #000; font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 0.12em; padding: 8px 14px; border-radius: 3px; cursor: pointer; }
    .bm-save:hover { opacity: 0.85; }
    .bm-cancel { background: none; border: 1px solid var(--border); color: var(--text-muted); font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; padding: 8px 14px; border-radius: 3px; cursor: pointer; }
    .bm-cancel:hover { border-color: var(--text-dim); color: var(--text); }

    .nrg-status { position: fixed; bottom: 8px; right: 16px; font-family: var(--mono); font-size: 8px; color: var(--text-muted); letter-spacing: 0.15em; z-index: 3000; pointer-events: none; }
    .nrg-status span { color: var(--accent); }

    /* ── MINI PLAYER ── */
    #mini-player {
      position: fixed; bottom: 16px; right: 16px;
      width: 260px;
      background: var(--surface); border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 6px;
      display: none; flex-direction: column; gap: 10px; padding: 12px;
      z-index: 4000;
    }
    #mini-player.visible { display: flex; }
    .mp-top { display: flex; align-items: center; gap: 10px; }
    .mp-cover {
      width: 40px; height: 40px; border-radius: 3px; flex-shrink: 0;
      background: var(--surface2); overflow: hidden; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .mp-cover img { width: 100%; height: 100%; object-fit: cover; }
    .mp-cover svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .mp-info { flex: 1; min-width: 0; }
    .mp-title { font-family: var(--mono); font-size: 9px; color: var(--text); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-artist { font-family: var(--sans); font-size: 10px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .mp-btn {
      width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--text-dim); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: border-color 0.13s, color 0.13s;
      flex-shrink: 0;
    }
    .mp-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mp-btn.play { border-color: var(--accent); color: var(--accent); width: 34px; height: 34px; }
    .mp-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mp-btn.play svg { width: 13px; height: 13px; }
    .mp-progress { display: flex; flex-direction: column; gap: 4px; }
    .mp-prog-track { width: 100%; height: 2px; background: var(--surface2); border-radius: 2px; cursor: pointer; position: relative; }
    .mp-prog-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.5s linear; pointer-events: none; }
    .mp-times { display: flex; justify-content: space-between; }
    .mp-times span { font-family: var(--mono); font-size: 8px; color: var(--text-muted); }
    .mp-footer { display: flex; justify-content: space-between; align-items: center; }
    .mp-open-btn {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em;
      color: var(--text-muted); background: none; border: 1px solid var(--border);
      border-radius: 3px; padding: 3px 8px; cursor: pointer;
      transition: border-color 0.13s, color 0.13s;
    }
    .mp-open-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mp-close-btn {
      font-family: var(--mono); font-size: 10px; color: var(--text-muted);
      background: none; border: none; cursor: pointer; line-height: 1;
      transition: color 0.13s;
    }
    .mp-close-btn:hover { color: #ff3a3a; }

    /* ── ERROR OVERLAY ── */
    .nrg-error {
      position: absolute; inset: 0; background: var(--bg);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; z-index: 10; font-family: var(--mono);
    }
    .nrg-error.visible { display: flex; }
    .nrg-error-code { font-size: 10px; letter-spacing: 0.2em; color: var(--accent); }
    .nrg-error-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; }
    .nrg-error-url { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; max-width: 480px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nrg-error-msg {
      background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--accent);
      border-radius: 4px; padding: 14px 18px; font-size: 10px; color: var(--text-dim);
      max-width: 480px; width: 90%; line-height: 1.8; letter-spacing: 0.03em;
    }
    .nrg-error-msg .err-label { color: var(--accent); margin-right: 8px; }
    .nrg-error-actions { display: flex; gap: 8px; }
    .nrg-error-btn {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
      padding: 8px 18px; border-radius: 3px; border: 1px solid var(--border);
      background: none; color: var(--text-dim); cursor: pointer; transition: all 0.13s;
    }
    .nrg-error-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nrg-error-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
    .nrg-error-btn.primary:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="tab-bar">
  <div id="tab-list"></div>
  <button id="new-tab-btn" title="New tab">+</button>
</div>

<div id="nav-bar" style="display:flex">
  <button class="nav-btn" id="nav-back" title="Back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="nav-btn" id="nav-forward" title="Forward">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <button class="nav-btn" id="nav-reload" title="Reload">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
  </button>
  <button class="nav-btn" id="nav-home" title="New tab">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>
  <div id="url-bar-wrap">
    <input type="text" id="url-bar" placeholder="enter url or search…" autocomplete="off" spellcheck="false">
    <button id="url-go">GO</button>
  </div>
</div>

<div id="nrg-viewport">
  <div class="nrg-error" id="nrg-error">
    <div class="nrg-error-code" id="err-code">ERR_CONNECTION_FAILED</div>
    <div class="nrg-error-title">failed to load page</div>
    <div class="nrg-error-url" id="err-url"></div>
    <div class="nrg-error-msg" id="err-msg">
      <div><span class="err-label">message</span><span id="err-message">unknown error</span></div>
      <div><span class="err-label">code</span><span id="err-code-num">—</span></div>
      <div><span class="err-label">destination</span><span id="err-dest">—</span></div>
    </div>
    <div class="nrg-error-actions">
      <button class="nrg-error-btn primary" id="err-retry">RETRY</button>
      <button class="nrg-error-btn" id="err-newtab">NEW TAB</button>
    </div>
  </div>
</div>

<div id="nrg-dashboard">
  <canvas id="bg-canvas"></canvas>

  <div class="nrg-clock" id="nrg-clock">00:00:00</div>

  <div class="nrg-logo-wrap">
    <h1>NRG</h1>
    <div class="logo-rule"></div>
    <div class="logo-sub">browse freely</div>
  </div>

  <div class="nrg-input-wrap">
    <form class="search-form" id="nrg-core-form">
      <div class="input-icon">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <input type="text" id="nrg-query" placeholder="enter url or search…" autocomplete="off" spellcheck="false">
      <button class="go-btn" type="submit">GO</button>
    </form>
    <div class="input-hint">urls and searches routed through scramjet</div>
  </div>

  <div class="bookmarks-section">
    <div class="bookmarks-label">// pinned</div>
    <div class="pinned-bar" id="pinned-bar"></div>
    <div class="bookmarks-label" style="margin-top:6px">// bookmarks</div>
    <div class="bookmarks-bar" id="bookmarks-bar">
      <button class="add-bm-btn" id="add-bm-btn" title="Add bookmark">+</button>
    </div>
    <div class="bookmark-form" id="bookmark-form">
      <input type="text" id="bm-name" placeholder="Name (e.g. Google)">
      <input type="text" id="bm-url" placeholder="URL (e.g. google.com)">
      <div class="bm-form-row">
        <button class="bm-save" id="bm-save">SAVE</button>
        <button class="bm-cancel" id="bm-cancel">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<div class="nrg-status">proxy — <span>active</span></div>

<!-- Persistent music iframe — never destroyed -->
<iframe id="music-iframe" src="/static/music.html" style="position:fixed;width:0;height:0;border:none;opacity:0;pointer-events:none;z-index:-1;" allow="autoplay"></iframe>

<!-- Mini Player -->
<div id="mini-player">
  <div class="mp-top">
    <div class="mp-cover" id="mp-cover">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="mp-info">
      <div class="mp-title" id="mp-title">nothing playing</div>
      <div class="mp-artist" id="mp-artist">—</div>
    </div>
  </div>
  <div class="mp-progress">
    <div class="mp-prog-track" id="mp-prog-track">
      <div class="mp-prog-fill" id="mp-prog-fill"></div>
    </div>
    <div class="mp-times">
      <span id="mp-cur">0:00</span>
      <span id="mp-dur">0:00</span>
    </div>
  </div>
  <div class="mp-controls">

<!-- Background canvas animation -->
<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const SPACING=36, PUSH_R=80, PUSH_F=0.18, FRICTION=0.82, RETURN=0.06;
  let W, H, dots=[], bolts=[];
  let mouse = {x:-999, y:-999};

  function getAccent() { return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#c50cf9'; }
  function hexToRgb(hex) { hex=hex.replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

  function buildDots() {
    dots=[];
    const cols=Math.floor(W/SPACING)+1, rows=Math.floor(H/SPACING)+1;
    for(let r=0;r<=rows;r++) for(let c=0;c<=cols;c++) dots.push({ox:c*SPACING,oy:r*SPACING,x:c*SPACING,y:r*SPACING,vx:0,vy:0});
  }
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = rect.width || window.innerWidth;
    H = canvas.height = rect.height || window.innerHeight;
    buildDots();
  }

  class Bolt {
    constructor(x,y,a) {
      this.segments=[]; this.life=1; this.decay=0.04+Math.random()*0.03;
      let px=x,py=y; const len=60+Math.random()*80,steps=8+Math.floor(Math.random()*6);
      for(let i=0;i<steps;i++){const j=(Math.random()-0.5)*28,nx=px+Math.cos(a)*(len/steps)+Math.cos(a+Math.PI/2)*j,ny=py+Math.sin(a)*(len/steps)+Math.sin(a+Math.PI/2)*j;this.segments.push({x1:px,y1:py,x2:nx,y2:ny});px=nx;py=ny;}
    }
    draw(accent) {
      ctx.save(); ctx.globalAlpha=this.life*this.life; ctx.strokeStyle=accent;
      ctx.lineWidth=1.5*this.life+0.5;
      ctx.beginPath(); for(const s of this.segments){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);} ctx.stroke();
      ctx.restore(); this.life-=this.decay;
    }
  }

  window.addEventListener('resize', resize);
  document.getElementById('nrg-dashboard').addEventListener('mousemove', e => {
    const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  });
  document.getElementById('nrg-dashboard').addEventListener('mouseleave', ()=>{mouse.x=-999;mouse.y=-999;});
  document.getElementById('nrg-dashboard').addEventListener('click', e => {
    if(e.target.closest('form')||e.target.closest('.bookmarks-section')) return;
    const r=canvas.getBoundingClientRect();
    const cx=e.clientX-r.left, cy=e.clientY-r.top;
    for(let i=0;i<8;i++){const a=(Math.PI*2/8)*i+(Math.random()-0.5)*0.4; bolts.push(new Bolt(cx,cy,a));}
  });

  function draw() {
    ctx.clearRect(0,0,W,H);
    const accent=getAccent(), [r,g,b]=hexToRgb(accent);
    for(const d of dots) {
      const dx=mouse.x-d.x, dy=mouse.y-d.y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<PUSH_R&&dist>0){const f=(1-dist/PUSH_R)*PUSH_F; d.vx-=(dx/dist)*f*12; d.vy-=(dy/dist)*f*12;}
      d.vx+=(d.ox-d.x)*RETURN; d.vy+=(d.oy-d.y)*RETURN;
      d.vx*=FRICTION; d.vy*=FRICTION; d.x+=d.vx; d.y+=d.vy;
      const dist2=Math.sqrt((mouse.x-d.x)**2+(mouse.y-d.y)**2), glow=Math.max(0,1-dist2/PUSH_R), radius=1.5+glow*2;
      ctx.beginPath(); ctx.arc(d.x,d.y,radius,0,Math.PI*2);
      if(glow>0.05){ctx.fillStyle=`rgba(${r},${g},${b},${0.25+glow*0.75})`;}
      else{ctx.fillStyle=`rgba(${r},${g},${b},0.18)`;}
      ctx.fill();
    }
    bolts=bolts.filter(b=>b.life>0);
    for(const b of bolts) b.draw(accent);
    requestAnimationFrame(draw);
  }
  resize(); draw();
})();
</script>

<!-- Main app logic -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // ── PINNED NRG PAGES (global so available immediately) ──
  const PINNED_PAGES = [
    { name: 'games',    url: 'nrgmain://games',    path: '/static/games.html',    icon: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M12 6V2M8 6V2M16 6V2M6 10h4M8 8v4M14 11h4"/></svg>' },
    { name: 'movies',   url: 'nrgmain://movies',   path: '/static/movies.html',   icon: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>' },
    { name: 'music',    url: 'nrgmain://music',    path: '/static/music.html',    icon: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' },
    { name: 'chat',     url: 'nrgmain://chat',     path: '/static/chat.html',     icon: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' },
    { name: 'settings', url: 'nrgmain://settings', path: '/static/settings.html', icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>' },
  ];

  // Render pinned bookmarks immediately (before scramjet)
  const pinnedBar = document.getElementById('pinned-bar');
  PINNED_PAGES.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pinned-item';
    el.innerHTML = `${p.icon}<span>${p.name}</span>`;
    el.addEventListener('click', () => createTab(p.url));
    pinnedBar.appendChild(el);
  });

  let tabs = [];
  let activeId = null;
  let scramjet = null;

  // ── nrgmain:// RESOLVER ──
  function isNrgMain(url) { return url && url.startsWith('nrgmain://'); }
  function resolveNrgMain(url) {
    const route = url.replace('nrgmain://', '').split('/')[0];
    const page = PINNED_PAGES.find(p => p.name === route);
    return page ? page.path : null;
  }
  function getNrgMainLabel(url) {
    const route = url.replace('nrgmain://', '').split('/')[0];
    return 'nrg/' + route;
  }

  function getFaviconUrl(rawUrl) {
    if (isNrgMain(rawUrl)) return null;
    try {
      let url = rawUrl;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
    } catch(e) { return null; }
  }

  function processUrl(raw) {
    raw = raw.trim();
    if (!raw) return null;
    if (isNrgMain(raw)) return raw;
    if (!raw.includes('.') || raw.includes(' ')) {
      return 'https://search.brave.com/search?q=' + encodeURIComponent(raw);
    }
    if (!/^https?:\/\//i.test(raw)) return 'https://' + raw;
    return raw;
  }

  function getDisplayName(url) {
    if (!url) return 'NEW TAB';
    if (isNrgMain(url)) return getNrgMainLabel(url);
    try {
      let u = url;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      return new URL(u).hostname.replace('www.','');
    } catch(e) { return url.substring(0,16); }
  }

  function showNavBar(show) { /* nav bar always visible */ }

  function updateUrlBar(url) {
    document.getElementById('url-bar').value = url || '';
  }

  function createTab(rawUrl) {
    const id = 'tab_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const tab = { id, rawUrl: rawUrl || null, encodedUrl: null, isNrg: false };
    tabs.push(tab);

    const el = document.createElement('div');
    el.className = 'tab';
    el.id = 'tel-' + id;

    const favEl = document.createElement('div');
    favEl.className = 'tab-favicon';
    favEl.id = 'fav-' + id;

    if (rawUrl && isNrgMain(rawUrl)) {
      const route = rawUrl.replace('nrgmain://','').split('/')[0];
      const page = PINNED_PAGES.find(p => p.name === route);
      favEl.innerHTML = page ? page.icon.replace('viewBox','class="tab-icon-nrg" viewBox') : `<svg class="tab-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>`;
    } else {
      favEl.innerHTML = `<svg class="tab-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a14.5 14.5 0 000 20A14.5 14.5 0 0012 2z"/></svg>`;
    }

    const nameEl = document.createElement('span');
    nameEl.className = 'tab-name';
    nameEl.id = 'tname-' + id;
    nameEl.textContent = rawUrl ? getDisplayName(rawUrl) : 'NEW TAB';

    const closeEl = document.createElement('div');
    closeEl.className = 'tab-close';
    closeEl.textContent = '×';
    closeEl.addEventListener('click', e => { e.stopPropagation(); closeTab(id); });

    el.appendChild(favEl);
    el.appendChild(nameEl);
    el.appendChild(closeEl);
    el.addEventListener('click', () => switchTab(id));
    document.getElementById('tab-list').appendChild(el);

    const frame = document.createElement('iframe');
    frame.id = 'frame-' + id;
    frame.setAttribute('allowfullscreen', '');
    document.getElementById('nrg-viewport').appendChild(frame);

    if (rawUrl) {
      if (isNrgMain(rawUrl)) {
        // Internal NRG page — load directly, no proxy
        const path = resolveNrgMain(rawUrl);
        if (path) {
          tab.encodedUrl = path;
          tab.isNrg = true;
          frame.src = path;
        }
      } else {
        const processed = processUrl(rawUrl);
        if (processed) {
          const encoded = scramjet.encodeUrl(processed);
          tab.encodedUrl = encoded;
          tab.isNrg = false;
          frame.src = encoded;
          // Poll for title/favicon updates after load
          frame.addEventListener('load', () => {
            const tryUpdate = () => {
              try {
                const doc = frame.contentDocument;
                if (!doc) return;
                const title = doc.title;
                if (title && title !== 'about:blank') { nameEl.textContent = title.substring(0,20); tab.label = title; }
                const fav = doc.querySelector('link[rel*="icon"]')?.href;
                if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
              } catch(e) {
                // Cross-origin — fall back to google favicon
                const fav = getFaviconUrl(rawUrl);
                if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
              }
            };
            tryUpdate();
            // Try again after a short delay in case page is still loading
            setTimeout(tryUpdate, 1500);
          }, {once: true});
          const fav = getFaviconUrl(rawUrl);
          if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
        }
      }
    }

    switchTab(id);
    return id;
  }

  function switchTab(id) {
    activeId = id;
    const tab = tabs.find(t => t.id === id);

    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('tel-' + id);
    if (el) el.classList.add('active');

    document.querySelectorAll('#nrg-viewport iframe').forEach(f => f.classList.remove('visible'));
    const frame = document.getElementById('frame-' + id);
    if (frame) frame.classList.add('visible');

    if (tab && tab.encodedUrl) {
      document.getElementById('nrg-viewport').classList.add('visible');
      document.getElementById('nrg-dashboard').classList.add('hidden');
      hideError();
      updateUrlBar(tab.rawUrl || '');
    } else {
      document.getElementById('nrg-viewport').classList.remove('visible');
      document.getElementById('nrg-dashboard').classList.remove('hidden');
      updateUrlBar('');
      setTimeout(() => document.getElementById('nrg-query').focus(), 50);
    }
  }

  function closeTab(id) {
    const idx = tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    tabs.splice(idx, 1);
    document.getElementById('tel-' + id)?.remove();
    document.getElementById('frame-' + id)?.remove();
    if (tabs.length === 0) {
      // All tabs closed — go to new tab (dashboard)
      createTab();
    } else if (activeId === id) {
      switchTab(tabs[Math.max(0, idx - 1)].id);
    }
  }

  function navigateActive(raw) {
    if (!raw) return;
    const tab = tabs.find(t => t.id === activeId);
    if (!tab) return;

    if (isNrgMain(raw)) {
      const path = resolveNrgMain(raw);
      if (!path) return;
      tab.rawUrl = raw;
      tab.encodedUrl = path;
      tab.isNrg = true;
      const nameEl = document.getElementById('tname-' + activeId);
      if (nameEl) nameEl.textContent = getNrgMainLabel(raw);
      const frame = document.getElementById('frame-' + activeId);
      if (frame) frame.src = path;
      document.getElementById('nrg-viewport').classList.add('visible');
      document.getElementById('nrg-dashboard').classList.add('hidden');
      showNavBar(false);
      updateUrlBar(raw);
      return;
    }

    const processed = processUrl(raw);
    if (!processed) return;
    const encoded = scramjet.encodeUrl(processed);
    tab.rawUrl = raw;
    tab.encodedUrl = encoded;
    tab.isNrg = false;

    const nameEl = document.getElementById('tname-' + activeId);
    if (nameEl) nameEl.textContent = getDisplayName(raw);

    const favEl = document.getElementById('fav-' + activeId);
    if (favEl) {
      const fav = getFaviconUrl(raw);
      if (fav) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
    }

    if (frame) {
      frame.src = encoded;
      frame.addEventListener('load', () => {
        try {
          const title = frame.contentDocument?.title;
          if (title && title !== 'about:blank' && nameEl) nameEl.textContent = title.substring(0, 20);
          const fav = frame.contentDocument?.querySelector('link[rel*="icon"]')?.href;
          if (fav && favEl) favEl.innerHTML = `<img src="${fav}" onerror="this.style.display='none'">`;
        } catch(e) {}
        setTimeout(() => {
          try {
            const title = frame.contentDocument?.title;
            if (title && title !== 'about:blank' && nameEl) nameEl.textContent = title.substring(0, 20);
          } catch(e) {}
        }, 1500);
      }, {once: true});
    }

    document.getElementById('nrg-viewport').classList.add('visible');
    document.getElementById('nrg-dashboard').classList.add('hidden');
    showNavBar(true);
    updateUrlBar(raw);
  }

  // ── FORM HANDLERS ──
  document.getElementById('nrg-core-form').addEventListener('submit', e => {
    e.preventDefault();
    const raw = document.getElementById('nrg-query').value.trim();
    if (!raw) return;
    navigateActive(raw);
    document.getElementById('nrg-query').value = '';
  });

  document.getElementById('url-bar').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const raw = e.target.value.trim();
      if (raw) navigateActive(raw);
    }
  });
  document.getElementById('url-go').addEventListener('click', () => {
    const raw = document.getElementById('url-bar').value.trim();
    if (raw) navigateActive(raw);
  });

  document.getElementById('new-tab-btn').addEventListener('click', () => createTab());
  document.getElementById('nav-home').addEventListener('click', () => {
    const tab = tabs.find(t => t.id === activeId);
    if (tab) { tab.encodedUrl = null; tab.rawUrl = null; tab.isNrg = false; }
    document.getElementById('nrg-viewport').classList.remove('visible');
    document.getElementById('nrg-dashboard').classList.remove('hidden');
    showNavBar(false);
    updateUrlBar('');
    const nameEl = document.getElementById('tname-' + activeId);
    if (nameEl) nameEl.textContent = 'NEW TAB';
    setTimeout(() => document.getElementById('nrg-query').focus(), 50);
  });
  document.getElementById('nav-back').addEventListener('click', () => {
    const frame = document.getElementById('frame-' + activeId);
    if (frame) frame.contentWindow?.history.back();
  });
  document.getElementById('nav-forward').addEventListener('click', () => {
    const frame = document.getElementById('frame-' + activeId);
    if (frame) frame.contentWindow?.history.forward();
  });
  document.getElementById('nav-reload').addEventListener('click', () => {
    const frame = document.getElementById('frame-' + activeId);
    if (frame) frame.contentWindow?.location.reload();
  });

  // ── KEYBOARD SHORTCUTS ──
  document.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key === 't') { e.preventDefault(); createTab(); }
    if (ctrl && e.key === 'w') { e.preventDefault(); if (activeId) closeTab(activeId); }
    if (ctrl && e.key === 'l') { e.preventDefault(); const bar = document.getElementById('url-bar'); bar.focus(); bar.select(); }
    if (ctrl && e.key === 'r') { e.preventDefault(); const frame = document.getElementById('frame-' + activeId); if (frame) frame.contentWindow?.location.reload(); }
    // Tab switching Ctrl+1-9
    if (ctrl && e.key >= '1' && e.key <= '9') {
      e.preventDefault();
      const idx = parseInt(e.key) - 1;
      if (tabs[idx]) switchTab(tabs[idx].id);
    }
  });

  // ── MINI PLAYER ──
  const musicFrame = document.getElementById('music-iframe');
  let musicReady = false;

  function mpSend(cmd, data={}) {
    musicFrame.contentWindow?.postMessage({ nrgMusic: true, cmd, ...data }, '*');
  }

  musicFrame.addEventListener('load', () => { musicReady = true; });

  // Receive state from music iframe
  window.addEventListener('message', e => {
    if (e.data?.nrgMusicState) {
      const { playing, title, artist, cover, current, duration, progress } = e.data;
      const player = document.getElementById('mini-player');
      if (title) {
        player.classList.add('visible');
        document.getElementById('mp-title').textContent = title || 'unknown';
        document.getElementById('mp-artist').textContent = artist || '—';
        // Update cover
        const coverEl = document.getElementById('mp-cover');
        if (cover) coverEl.innerHTML = `<img src="${cover}" onerror="this.innerHTML='<svg viewBox=\'0 0 24 24\'><path d=\'M9 18V5l12-2v13\'/><circle cx=\'6\' cy=\'18\' r=\'3\'/><circle cx=\'18\' cy=\'16\' r=\'3\'/></svg>'">`;
        // Update play icon
        const icon = document.getElementById('mp-play-icon');
        icon.innerHTML = playing
          ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
          : '<polygon points="5 3 19 12 5 21 5 3"/>';
        // Update progress
        document.getElementById('mp-prog-fill').style.width = progress + '%';
        const fmt = s => { s=Math.floor(s||0); return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; };
        document.getElementById('mp-cur').textContent = fmt(current);
        document.getElementById('mp-dur').textContent = fmt(duration);
      }
    }
  });

  document.getElementById('mp-play').addEventListener('click', () => mpSend('play'));
  document.getElementById('mp-next').addEventListener('click', () => mpSend('next'));
  document.getElementById('mp-prev').addEventListener('click', () => mpSend('prev'));
  document.getElementById('mp-prog-track').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    mpSend('seek', { pct: (e.clientX - r.left) / r.width });
  });
  document.getElementById('mp-open').addEventListener('click', () => createTab('nrgmain://music'));
  document.getElementById('mp-close').addEventListener('click', () => document.getElementById('mini-player').classList.remove('visible'));
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    const el = document.getElementById('nrg-clock');
    if (el) el.textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── BOOKMARKS ──
  let bookmarks = [];
  try { bookmarks = JSON.parse(localStorage.getItem('nrg_bm') || '[]'); } catch(e) { bookmarks = []; }
  function saveBookmarks() { localStorage.setItem('nrg_bm', JSON.stringify(bookmarks)); }

  function renderBookmarks() {
    const bar = document.getElementById('bookmarks-bar');
    bar.querySelectorAll('.bookmark-item').forEach(el => el.remove());
    const addBtn = document.getElementById('add-bm-btn');
    bookmarks.forEach((bm, i) => {
      const el = document.createElement('div');
      el.className = 'bookmark-item';
      const fav = getFaviconUrl(bm.url);
      el.innerHTML = `${fav ? `<img src="${fav}" onerror="this.style.display='none'">` : ''}<span>${bm.name}</span><div class="bookmark-del" title="Remove">×</div>`;
      el.addEventListener('click', e => { if (e.target.classList.contains('bookmark-del')) return; createTab(bm.url); });
      el.querySelector('.bookmark-del').addEventListener('click', e => { e.stopPropagation(); bookmarks.splice(i, 1); saveBookmarks(); renderBookmarks(); });
      bar.insertBefore(el, addBtn);
    });
  }

  document.getElementById('add-bm-btn').addEventListener('click', () => {
    const form = document.getElementById('bookmark-form');
    form.classList.toggle('open');
    if (form.classList.contains('open')) document.getElementById('bm-name').focus();
  });
  document.getElementById('bm-cancel').addEventListener('click', () => {
    document.getElementById('bookmark-form').classList.remove('open');
    document.getElementById('bm-name').value = '';
    document.getElementById('bm-url').value = '';
  });
  document.getElementById('bm-save').addEventListener('click', () => {
    const name = document.getElementById('bm-name').value.trim();
    const url  = document.getElementById('bm-url').value.trim();
    if (!name || !url) return;
    bookmarks.push({ name, url });
    saveBookmarks();
    renderBookmarks();
    document.getElementById('bookmark-form').classList.remove('open');
    document.getElementById('bm-name').value = '';
    document.getElementById('bm-url').value = '';
  });
  document.getElementById('bm-url').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('bm-save').click(); });

  renderBookmarks();
  createTab();

  // ── THEME / SETTINGS SYNC ──
  function hexToRgba(hex, a) {
    hex = hex.replace('#','');
    if (hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    const n=parseInt(hex,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    return `rgba(${r},${g},${b},${a})`;
  }

  function applyTheme(t) {
    const r = document.documentElement.style;
    r.setProperty('--bg',          t.bg);
    r.setProperty('--surface',     t.surface);
    r.setProperty('--surface2',    t.surface2);
    r.setProperty('--surface3',    t.surface2);
    r.setProperty('--border',      t.border);
    r.setProperty('--accent',      t.accent);
    r.setProperty('--accent-dim',  hexToRgba(t.accent, 0.10));
    r.setProperty('--accent-glow', hexToRgba(t.accent, 0.25));
    r.setProperty('--text',        t.text);
    r.setProperty('--text-dim',    t.textDim);
    r.setProperty('--text-muted',  t.textMuted);
  }

  // Apply saved theme on load
  const THEMES = [
    { id:'midnight', name:'Midnight', bg:'#0a0a0a', surface:'#111', surface2:'#1a1a1a', border:'#2a2a2a', accent:'#c50cf9', text:'#e8e8e8', textDim:'#666', textMuted:'#3a3a3a' },
    { id:'neon',     name:'Neon',     bg:'#050510', surface:'#0d0d1f', surface2:'#14142e', border:'#1e1e3f', accent:'#4f9cf9', text:'#e8f0ff', textDim:'#5a6a88', textMuted:'#2a3048' },
    { id:'galaxy',   name:'Galaxy',   bg:'#06020f', surface:'#100820', surface2:'#180c2e', border:'#2a1540', accent:'#b57bee', text:'#eee8ff', textDim:'#6a5a88', textMuted:'#2e1e44' },
    { id:'ocean',    name:'Ocean',    bg:'#020a14', surface:'#061622', surface2:'#0b2233', border:'#0e3040', accent:'#00c8ff', text:'#d8f4ff', textDim:'#4a7a99', textMuted:'#0d2233' },
    { id:'crimson',  name:'Crimson',  bg:'#0f0005', surface:'#1a0008', surface2:'#220010', border:'#3a0018', accent:'#ff2255', text:'#ffe8ec', textDim:'#884455', textMuted:'#3a1020' },
    { id:'gold',     name:'Gold',     bg:'#0a0800', surface:'#141000', surface2:'#1e1800', border:'#302400', accent:'#f5c518', text:'#fff8e0', textDim:'#886633', textMuted:'#2e2200' },
    { id:'forest',   name:'Forest',   bg:'#020a04', surface:'#071208', surface2:'#0d1e10', border:'#142e18', accent:'#39d98a', text:'#d8ffe8', textDim:'#4a8860', textMuted:'#0d2214' },
    { id:'sakura',   name:'Sakura',   bg:'#0f0508', surface:'#1a0810', surface2:'#220e18', border:'#381a28', accent:'#ff6b9d', text:'#ffe8f0', textDim:'#885566', textMuted:'#2e0e1a' },
  ];
  const savedTheme = localStorage.getItem('nrg_theme');
  if (savedTheme) { const t = THEMES.find(x => x.id === savedTheme); if (t) applyTheme(t); }

  // Apply saved cloak on load
  const cloakTitle = localStorage.getItem('nrg_cloak_title');
  const cloakIcon  = localStorage.getItem('nrg_cloak_icon');
  if (cloakTitle) document.title = cloakTitle;
  if (cloakIcon)  { const link = document.querySelector("link[rel*='icon']") || Object.assign(document.createElement('link'), {rel:'shortcut icon'}); link.href = cloakIcon; document.head.appendChild(link); }

  // Apply saved panic key on load
  const panicKey = localStorage.getItem('nrg_panic_key') || '\\';
  const panicUrl = localStorage.getItem('nrg_panic_url') || 'https://google.com';
  document.addEventListener('keydown', e => { if (e.key === panicKey) window.location.href = panicUrl; });

  // ── ERROR OVERLAY ──
  function showError(tabId, url, message, code, dest) {
    const overlay = document.getElementById('nrg-error');
    document.getElementById('err-url').textContent = url || '';
    document.getElementById('err-message').textContent = message || 'unknown error';
    document.getElementById('err-code-num').textContent = code || '—';
    document.getElementById('err-dest').textContent = dest || '—';

    // Map error codes to NRG error labels
    let errLabel = 'ERR_CONNECTION_FAILED';
    if (message && message.includes('SSL')) errLabel = 'ERR_SSL_CONNECT';
    else if (message && message.includes('timeout')) errLabel = 'ERR_TIMED_OUT';
    else if (message && message.includes('refused')) errLabel = 'ERR_CONNECTION_REFUSED';
    else if (code === 404) errLabel = 'ERR_NOT_FOUND';
    document.getElementById('err-code').textContent = errLabel;

    // Hide iframe, show overlay
    const frame = document.getElementById('frame-' + tabId);
    if (frame) frame.classList.remove('visible');
    overlay.classList.add('visible');

    document.getElementById('err-retry').onclick = () => {
      overlay.classList.remove('visible');
      if (frame) { frame.classList.add('visible'); frame.src = frame.src; }
    };
    document.getElementById('err-newtab').onclick = () => {
      overlay.classList.remove('visible');
      createTab();
    };
  }

  function hideError() {
    document.getElementById('nrg-error').classList.remove('visible');
  }

  // Listen for scramjet error messages from iframes
  window.addEventListener('message', e => {
    if (!e.data || !e.data.type) return;
    if (e.data.type === 'nrg-theme' && e.data.theme) {
      applyTheme(e.data.theme);
    }
    if (e.data.type === 'scramjet-error' || (e.data.message && e.data.url)) {
      const activeTab = tabs.find(t => t.id === activeId);
      showError(activeId, activeTab?.rawUrl, e.data.message, e.data.code, e.data.destination);
    }
  });

  // ── TAB HISTORY ──
  let tabHistory = [];
  try { tabHistory = JSON.parse(localStorage.getItem('nrg_tab_history') || '[]'); } catch(e) { tabHistory = []; }
  let closedTabs = [];

  function addToHistory(rawUrl, label) {
    if (!rawUrl || rawUrl.startsWith('nrgmain://')) return;
    tabHistory.unshift({ url: rawUrl, label: label || rawUrl, time: Date.now() });
    if (tabHistory.length > 50) tabHistory = tabHistory.slice(0, 50);
    localStorage.setItem('nrg_tab_history', JSON.stringify(tabHistory));
  }

  function clearHistory() {
    tabHistory = [];
    localStorage.removeItem('nrg_tab_history');
  }

  // Save to history when navigating
  const _origNavigate = navigateActive;
  navigateActive = function(raw) {
    _origNavigate(raw);
    setTimeout(() => {
      const tab = tabs.find(t => t.id === activeId);
      if (tab?.rawUrl) addToHistory(tab.rawUrl, document.getElementById('tname-' + activeId)?.textContent);
    }, 200);
  };

  // Save closed tab for Ctrl+Shift+T restore
  const _origClose = closeTab;
  closeTab = function(id) {
    const tab = tabs.find(t => t.id === id);
    if (tab?.rawUrl) closedTabs.push({ url: tab.rawUrl, label: document.getElementById('tname-' + id)?.textContent });
    _origClose(id);
  };

  // Ctrl+Shift+T — reopen last closed tab
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'T') {
      e.preventDefault();
      const last = closedTabs.pop();
      if (last) createTab(last.url);
    }
  });

  // ── TAB GROUPS ──
  const TAB_GROUP_COLORS = ['#c50cf9','#00c8ff','#39d98a','#ff2255','#f5c518','#ff6b9d','#b57bee','#4f9cf9'];
  let tabGroups = {};

  function setTabGroup(id, colorIdx) {
    tabGroups[id] = colorIdx;
    const el = document.getElementById('tel-' + id);
    if (!el) return;
    el.style.borderTopColor = colorIdx !== null ? TAB_GROUP_COLORS[colorIdx] : 'var(--border)';
    if (colorIdx !== null) el.style.borderTopWidth = '2px';
  }

  // Right-click tab to assign group color
  document.getElementById('tab-list').addEventListener('contextmenu', e => {
    e.preventDefault();
    const tabEl = e.target.closest('.tab');
    if (!tabEl) return;
    const id = tabEl.id.replace('tel-','');

    // Remove existing picker
    document.getElementById('tab-group-picker')?.remove();

    const picker = document.createElement('div');
    picker.id = 'tab-group-picker';
    picker.style.cssText = `position:fixed;top:${e.clientY}px;left:${e.clientX}px;background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:9999;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;`;

    const label = document.createElement('div');
    label.textContent = '// TAB GROUP';
    label.style.cssText = 'color:var(--text-muted);margin-bottom:2px;';
    picker.appendChild(label);

    const colors = document.createElement('div');
    colors.style.cssText = 'display:flex;gap:5px;';
    TAB_GROUP_COLORS.forEach((c, i) => {
      const dot = document.createElement('div');
      dot.style.cssText = `width:16px;height:16px;border-radius:50%;background:${c};cursor:pointer;border:2px solid transparent;transition:border-color 0.1s;`;
      dot.title = `Group ${i+1}`;
      dot.addEventListener('click', () => { setTabGroup(id, i); picker.remove(); });
      dot.addEventListener('mouseenter', () => dot.style.borderColor = '#fff');
      dot.addEventListener('mouseleave', () => dot.style.borderColor = 'transparent');
      colors.appendChild(dot);
    });
    picker.appendChild(colors);

    const clearBtn = document.createElement('div');
    clearBtn.textContent = 'CLEAR GROUP';
    clearBtn.style.cssText = 'color:var(--text-muted);cursor:pointer;margin-top:2px;padding:3px 0;border-top:1px solid var(--border);';
    clearBtn.addEventListener('click', () => { setTabGroup(id, null); tabEl.style.borderTopColor=''; tabEl.style.borderTopWidth=''; picker.remove(); });
    picker.appendChild(clearBtn);

    document.body.appendChild(picker);
    const hide = (ev) => { if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener('click', hide); } };
    setTimeout(() => document.addEventListener('click', hide), 0);
  });

  // ── DRAG TO REORDER TABS ──
  let dragSrc = null;
  function initTabDrag(el) {
    el.setAttribute('draggable', true);
    el.addEventListener('dragstart', e => {
      dragSrc = el;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => el.style.opacity = '0.4', 0);
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; dragSrc = null; });
    el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    el.addEventListener('dragenter', e => { e.preventDefault(); if (el !== dragSrc) el.style.outline = '1px solid var(--accent)'; });
    el.addEventListener('dragleave', () => el.style.outline = '');
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      el.style.outline = '';
      if (dragSrc && dragSrc !== el) {
        const list = document.getElementById('tab-list');
        const els = [...list.querySelectorAll('.tab')];
        const srcIdx = els.indexOf(dragSrc);
        const dstIdx = els.indexOf(el);
        if (srcIdx < dstIdx) list.insertBefore(dragSrc, el.nextSibling);
        else list.insertBefore(dragSrc, el);
        // Sync tabs array order
        const srcTabIdx = tabs.findIndex(t => t.id === dragSrc.id.replace('tel-',''));
        const dstTabIdx = tabs.findIndex(t => t.id === el.id.replace('tel-',''));
        const [moved] = tabs.splice(srcTabIdx, 1);
        tabs.splice(dstTabIdx, 0, moved);
      }
    });
  }

  // Patch createTab to init drag on new tabs
  const _origCreateTab = createTab;
  createTab = function(rawUrl) {
    const id = _origCreateTab(rawUrl);
    const el = document.getElementById('tel-' + id);
    if (el) initTabDrag(el);
    return id;
  };

}); // end DOMContentLoaded
</script>
</body>
</html>
