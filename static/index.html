<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;
  --surface:#150003;
  --border:#2a0008;
  --crimson:#e8002a;
  --crimson-dim:#6b0010;
  --crimson-deep:#3a0008;
  --fg:#f0e8e8;
  --muted:#7a4050;
}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none}

canvas#snow{position:fixed;inset:0;pointer-events:none;z-index:0}

/* TOP BAR */
.topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:#0f0003;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:8px}
.logo{font-size:15px;letter-spacing:0.15em;text-transform:uppercase;color:var(--crimson);font-weight:500}

.topbar-nav{display:flex;align-items:center;gap:4px}
.nav-icon{
  position:relative;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;cursor:pointer;color:var(--muted);
  transition:background 0.15s,color 0.15s;border:none;background:none;
}
.nav-icon:hover{background:var(--crimson-deep);color:var(--fg)}
.nav-icon.active{color:var(--crimson)}
.nav-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.tooltip{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#1e0006;border:1px solid var(--border);
  color:var(--fg);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:4px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 0.1s;
}
.nav-icon:hover .tooltip{opacity:1}

.topbar-right{display:flex;align-items:center;gap:10px}
.search-btn{
  width:34px;height:34px;border-radius:8px;border:none;background:none;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background 0.15s,color 0.15s;
}
.search-btn:hover{background:var(--crimson-deep);color:var(--fg)}
.search-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.account-btn{
  width:34px;height:34px;border-radius:50%;overflow:hidden;cursor:pointer;
  border:1.5px solid var(--crimson-deep);transition:border-color 0.15s;
  background:none;padding:0;flex-shrink:0;
}
.account-btn:hover{border-color:var(--crimson)}
.account-btn img{width:100%;height:100%;object-fit:cover;display:block}
.account-wrap{position:relative}
.account-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;
  background:#150003;border:1px solid var(--border);
  border-radius:10px;width:200px;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(-6px);
  transition:opacity 0.15s,transform 0.15s;z-index:200;
}
.account-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0)}
.dropdown-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dropdown-pfp{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--crimson-deep);flex-shrink:0}
.dropdown-name{font-size:13px;color:var(--fg);font-weight:500}
.dropdown-role{font-size:11px;color:var(--muted);margin-top:1px}
.dropdown-items{padding:6px}
.dropdown-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:6px;
  font-size:13px;color:var(--muted);cursor:pointer;
  transition:background 0.12s,color 0.12s;
}
.dropdown-item:hover{background:var(--crimson-deep);color:var(--fg)}
.dropdown-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}
.dropdown-item.danger:hover{background:#2a0008;color:#e8002a}

/* MAIN */
.main{
  position:fixed;top:52px;left:0;right:0;bottom:0;
  overflow-y:auto;z-index:1;padding:3rem 2rem 2rem;
}

/* GREETING */
.greeting{margin-bottom:3rem}
.greeting-time{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--crimson-dim);margin-bottom:0.5rem}
.greeting-name{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:300;color:var(--fg);letter-spacing:-0.02em}
.greeting-name span{color:var(--crimson)}

/* SECTION */
.section{margin-bottom:2.5rem}
.section-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem;border-left:2px solid var(--crimson-deep);padding-left:10px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:1.25rem 1rem;cursor:pointer;
  transition:border-color 0.15s,background 0.15s;
  display:flex;flex-direction:column;gap:10px;
}
.card:hover{border-color:var(--crimson-deep);background:#1a0005}
.card-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--crimson)}
.card-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.card-title{font-size:14px;color:var(--fg);font-weight:500}
.card-sub{font-size:12px;color:var(--muted)}
</style>
</head>

<script>
// Greeting
const h = new Date().getHours();
const label = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
document.getElementById('timeLabel').textContent = label;

// Snowfall
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let W, H, flakes = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
function init() {
  resize();
  flakes = Array.from({length: 140}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.4+0.3,
    speed: Math.random()*0.5+0.15,
    drift: Math.random()*0.2-0.1,
    opacity: Math.random()*0.25+0.04
  }));
}
function draw() {
  ctx.clearRect(0,0,W,H);
  for(const f of flakes){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,0,30,${f.opacity})`;
    ctx.fill();
    f.y+=f.speed; f.x+=f.drift;
    if(f.y>H+4){f.y=-4;f.x=Math.random()*W;}
    if(f.x>W+4) f.x=-4;
    if(f.x<-4) f.x=W+4;
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
init(); draw();


const accountBtn = document.getElementById('accountBtn');
const accountDropdown = document.getElementById('accountDropdown');
accountBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  accountDropdown.classList.toggle('open');
});
document.addEventListener('click', () => accountDropdown.classList.remove('open'));
</script>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKPXLTU0z18tsn80JCXJhJ62EEjDl7lqY",
  authDomain: "nrg-accounts.firebaseapp.com",
  projectId: "nrg-accounts",
  storageBucket: "nrg-accounts.firebasestorage.app",
  messagingSenderId: "969467601192",
  appId: "1:969467601192:web:bd312dd3d58e4b6b7c701d"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'accounts.html';
    return;
  }

  // Fetch user doc
  const snap = await getDoc(doc(db, 'users', user.uid));
  const data = snap.exists() ? snap.data() : {};

  const displayName = data.username || data.displayName || user.displayName || user.email?.split('@')[0] || 'User';
  const photoURL = data.avatarURL || data.photoURL || user.photoURL || null;
  const role = data.role || data.plan || 'Member';

  // Update greeting
  const greetingName = document.querySelector('.greeting-name span');
  if (greetingName) greetingName.textContent = displayName;

  // Update dropdown
  const dropName = document.querySelector('.dropdown-name');
  const dropRole = document.querySelector('.dropdown-role');
  if (dropName) dropName.textContent = displayName;
  if (dropRole) dropRole.textContent = role;

  // Update pfp if user has one
  if (photoURL) {
    document.querySelectorAll('.account-btn img, .dropdown-pfp').forEach(img => {
      img.src = photoURL;
    });
  }
});

// Sign out
document.querySelectorAll('.dropdown-item.danger').forEach(btn => {
  btn.addEventListener('click', async () => {
    await signOut(auth);
    location.href = 'accounts.html';
  });
});
</script>
