<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a; --surface3: #222;
  --border: #2a2a2a; --accent: #c50cf9; --accent-dim: rgba(197,12,249,0.08);
  --text: #e8e8e8; --text-dim: #666; --text-muted: #3a3a3a;
  --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  --red: #ff4f4f; --green: #39d98a; --gold: #f5c518; --blue: #4f9cf9;
  --rare: #4f9cf9; --epic: #c50cf9; --legendary: #f5c518; --common: #666;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-nrg { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.12em; }
.brand-divider { width: 1px; height: 13px; background: var(--border); }
.brand-page { font-size: 13px; color: var(--text-dim); }
.topbar-right { display: flex; align-items: center; gap: 12px; }

.coin-display { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border); padding: 5px 12px; border-radius: 4px; }
.coin-icon { color: var(--gold); font-size: 13px; }
.coin-count { color: var(--text); font-weight: 700; }

.login-prompt { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }

.main { flex: 1; overflow-y: auto; padding: 28px 24px 80px; }

.shop-header { margin-bottom: 28px; }
.shop-title { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: 0.08em; margin-bottom: 6px; }
.shop-sub { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; }

.category-tabs { display: flex; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
.cat-tab { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; padding: 6px 14px; border-radius: 3px; border: 1px solid var(--border); background: none; color: var(--text-muted); cursor: pointer; transition: border-color 0.13s, color 0.13s, background 0.13s; text-transform: uppercase; }
.cat-tab:hover { border-color: var(--text-dim); color: var(--text); }
.cat-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

.shop-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.2s, transform 0.2s; position: relative; }
.shop-card:hover { transform: translateY(-2px); }
.shop-card.rarity-common  { border-top: 2px solid var(--common); }
.shop-card.rarity-rare    { border-top: 2px solid var(--rare); }
.shop-card.rarity-epic    { border-top: 2px solid var(--epic); }
.shop-card.rarity-legendary { border-top: 2px solid var(--legendary); box-shadow: 0 0 20px rgba(245,197,24,0.1); }

.shop-card-preview { width: 100%; height: 110px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; overflow: hidden; }
.shop-card-preview.username-color { font-family: var(--mono); font-size: 15px; font-weight: 700; }
.shop-card-preview.xpboost { flex-direction: column; gap: 4px; }
.shop-card-preview.xpboost .boost-mult { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--accent); }
.shop-card-preview.xpboost .boost-dur  { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }

.rarity-badge { position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: 7px; letter-spacing: 0.15em; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; font-weight: 700; }
.rarity-common    { background: rgba(102,102,102,0.2); color: var(--common); }
.rarity-rare      { background: rgba(79,156,249,0.15); color: var(--rare); }
.rarity-epic      { background: rgba(197,12,249,0.15); color: var(--epic); }
.rarity-legendary { background: rgba(245,197,24,0.15); color: var(--legendary); }

.shop-card-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; }
.shop-card-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.shop-card-desc { font-family: var(--mono); font-size: 9px; color: var(--text-dim); line-height: 1.5; letter-spacing: 0.04em; flex: 1; }

.shop-card-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.shop-card-price { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--gold); }
.shop-card-price .coin-icon { font-size: 11px; }

.buy-btn { font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; transition: background 0.13s; }
.buy-btn:hover:not(:disabled) { background: var(--accent-dim); }
.buy-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
.buy-btn.owned { border-color: var(--green); color: var(--green); }

.no-items { font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.15em; text-align: center; padding: 60px 0; grid-column: 1/-1; }

.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--green); padding: 10px 18px; border-radius: 4px; font-family: var(--mono); font-size: 10px; color: var(--text); letter-spacing: 0.06em; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-left-color: var(--red); }

.nrg-sidebar { width: 110px; background: rgba(15,15,15,0.95); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; padding: 28px 0; position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-96px); transition: transform 0.3s ease; z-index: 999; }
.nrg-sidebar:hover { transform: translateX(0); }
.nrg-sidebar .nav-icon { width: 86px; height: 56px; margin: 6px 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-size: 16px; color: #ccc; font-family: var(--sans); transition: background 0.2s ease; }
.nrg-sidebar .nav-icon:hover, .nrg-sidebar .nav-icon.active { background: rgba(255,255,255,0.08); color: white; }

.bottom-sidebar { position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 70%); display: flex; gap: 20px; padding: 10px 18px; background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s ease; z-index: 999; }
.bottom-sidebar:hover { transform: translate(-50%, 0); }

.preview-profiledeco { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.preview-profiledeco .p-card-mock { width: 120px; height: 72px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 8px 10px; gap: 5px; position: relative; overflow: hidden; }
.preview-profiledeco .p-avatar-mock { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
.preview-profiledeco .p-line { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); }
.preview-profiledeco .p-line.short { width: 50%; }

.preview-pfpdeco { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; background: var(--surface2); }
.pfp-mock-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.pfp-mock { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; font-weight: 700; color: #000; }

.preview-title { width: 100%; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: var(--surface2); }
.title-name-mock { font-size: 14px; font-weight: 500; color: var(--text); font-family: var(--sans); }
.title-tag-mock { font-family: var(--mono); font-size: 9px; letter-spacing: 0.15em; padding: 2px 8px; border-radius: 2px; }

@keyframes rainbow-spin { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
    @keyframes blue-pulse { 0%,100%{box-shadow:0 0 0 2px #4f9cf9,0 0 8px #4f9cf9} 50%{box-shadow:0 0 0 2px #4f9cf9,0 0 20px #4f9cf9} }
    @keyframes diamond-spin { 0%{filter:hue-rotate(0deg) brightness(1)} 50%{filter:hue-rotate(180deg) brightness(1.4)} 100%{filter:hue-rotate(360deg) brightness(1)} }
@keyframes fire-glow { 0%,100%{box-shadow:0 0 8px #f50,0 0 16px #f50} 50%{box-shadow:0 0 16px #ff0,0 0 30px #f50} }
@keyframes pulse-glow { 0%,100%{box-shadow:0 0 6px var(--accent)} 50%{box-shadow:0 0 18px var(--accent)} }
@keyframes galaxy-bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

.status-card { color: white; background: var(--surface2); padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-family: var(--mono); letter-spacing: 0.04em; }
</style>
</head>

function toast(msg, type = "success") {
  const el = $("toast");
  el.textContent = msg;
  el.className   = "toast " + type + " show";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2800);
}

      ? "background:linear-gradient(90deg,#f00,#f90,#ff0,#0f0,#09f,#c50cf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow-spin 3s linear infinite"
      : "color:" + item.color;
    return '<div class="shop-card-preview username-color" style="background:var(--surface2)">' +
           '<span style="font-family:var(--mono);font-size:15px;font-weight:700;' + style + '">@username</span>' +
           '</div>';
  }

  if (item.category === "xpboost") {
    const col = item.multiplier >= 5 ? "var(--legendary)" : item.multiplier >= 3 ? "var(--epic)" : "var(--accent)";
    return '<div class="shop-card-preview xpboost" style="background:var(--surface2)">' +
           '<span class="boost-mult" style="color:' + col + '">' + item.multiplier + 'x</span>' +
           '<span class="boost-dur">' + (item.duration >= 60 ? item.duration/60 + ' hr' : item.duration + ' min') + '</span>' +
           '</div>';
  }

  if (item.category === "profiledeco") {
    const themes = {
      profile_dark:    { bg: "#0a0a0a", border: "#2a2a2a", av: "#333" },
      profile_neon:    { bg: "#0a0a1a", border: "#4f9cf9", av: "#4f9cf9", glow: "box-shadow:0 0 12px #4f9cf9" },
      profile_crimson: { bg: "#1a0008", border: "#dc143c", av: "#dc143c", glow: "box-shadow:0 0 12px #dc143c" },
      profile_ocean:   { bg: "#020a14", border: "#0077b6", av: "#0077b6", glow: "box-shadow:0 0 12px #0077b6" },
      profile_galaxy:  { bg: "linear-gradient(135deg,#0a0a2a,#1a0a3a,#0a1a2a)", border: "#c50cf9", av: "#c50cf9", anim: "animation:galaxy-bg 4s ease infinite;background-size:200% 200%" },
      profile_gold:    { bg: "#0d0900", border: "#f5c518", av: "#f5c518", glow: "box-shadow:0 0 12px rgba(245,197,24,0.5)" },
      profile_sakura:  { bg: "#1a0a0f", border: "#ff9db5", av: "#ff9db5", glow: "box-shadow:0 0 12px #ff9db5" },
      profile_glitch:  { bg: "#000", border: "#0ff", av: "#0ff", glow: "box-shadow:0 0 8px #0ff,0 0 16px #f0f;animation:fire-glow 0.3s ease-in-out infinite" },
      profile_fire:    { bg: "#1a0a00", border: "#f50", av: "#f50", glow: "animation:fire-glow 1.5s ease-in-out infinite" },
    };
    const t = themes[item.id] || { bg: "#111", border: "#2a2a2a", av: "#444" };
    const bgStyle = typeof t.bg === "string" && t.bg.includes("gradient")
      ? "background:" + t.bg + ";" + (t.anim || "")
      : "background:" + t.bg;
    return '<div class="preview-profiledeco" style="' + bgStyle + '">' +
           '<div class="p-card-mock" style="border-color:' + t.border + ';' + (t.glow || '') + '">' +
           '<div style="display:flex;align-items:center;gap:6px">' +
           '<div class="p-avatar-mock" style="background:' + t.av + '"></div>' +
           '<div style="flex:1"><div class="p-line" style="width:70%;margin-bottom:3px"></div><div class="p-line short"></div></div>' +
           '</div>' +
           '<div class="p-line" style="margin-top:6px"></div>' +
           '<div class="p-line short" style="margin-top:3px"></div>' +
           '</div></div>';
  }

  if (item.category === "pfpdeco") {
    const decos = {
      pfp_glow:        { ring: "none",                    shadow: "0 0 0 2px #c50cf9,0 0 14px #c50cf9",          anim: "animation:pulse-glow 2s ease-in-out infinite" },
      pfp_blue_glow:   { ring: "none",                    shadow: "0 0 0 2px #4f9cf9,0 0 14px #4f9cf9",          anim: "animation:blue-pulse 2s ease-in-out infinite" },
      pfp_silver_ring: { ring: "3px solid #aaa",          shadow: "0 0 8px rgba(170,170,170,0.4)" },
      pfp_gold_ring:   { ring: "3px solid #f5c518",       shadow: "0 0 10px rgba(245,197,24,0.4)" },
      pfp_void_ring:   { ring: "3px solid #fff",          shadow: "0 0 12px rgba(255,255,255,0.15),inset 0 0 12px rgba(0,0,0,0.8)" },
      pfp_fire_ring:   { ring: "3px solid #f50",          shadow: "none",                                         anim: "animation:fire-glow 1.5s ease-in-out infinite" },
      pfp_diamond:     { ring: "3px solid #a8d8ea",       shadow: "0 0 8px #a8d8ea,0 0 20px rgba(168,216,234,0.4)", anim: "animation:diamond-spin 3s linear infinite" },
      pfp_rainbow:     { ring: "3px solid transparent",   shadow: "none",                                         anim: "animation:rainbow-spin 2s linear infinite", extra: "background:linear-gradient(var(--surface2),var(--surface2)) padding-box,linear-gradient(90deg,#f00,#f90,#ff0,#0f0,#09f,#c50cf9) border-box" },
    };
    const d = decos[item.id] || { ring: "2px solid var(--border)" };
    const ringStyle = "border:" + (d.ring || "none") + ";box-shadow:" + (d.shadow || "none") + ";" + (d.anim || "") + ";" + (d.extra || "");
    return '<div class="preview-pfpdeco">' +
           '<div class="pfp-mock-wrap"><div class="pfp-mock" style="' + ringStyle + '">A</div></div>' +
           '</div>';
  }

  if (item.category === "title") {
    const cols = { common: "var(--text-dim)", rare: "var(--rare)", epic: "var(--epic)", legendary: "var(--legendary)" };
    const col  = cols[item.rarity] || "var(--text-dim)";
    const bg   = item.rarity === "legendary" ? "background:rgba(245,197,24,0.12);border:1px solid rgba(245,197,24,0.3)"
               : item.rarity === "epic"       ? "background:rgba(197,12,249,0.1);border:1px solid rgba(197,12,249,0.25)"
               : item.rarity === "rare"       ? "background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.25)"
               : "background:rgba(255,255,255,0.05);border:1px solid var(--border)";
    return '<div class="preview-title">' +
           '<div class="title-name-mock">Player</div>' +
           '<div class="title-tag-mock" style="color:' + col + ';' + bg + '">' + item.name + '</div>' +
           '</div>';
  }

  return '<div class="shop-card-preview" style="background:var(--surface2)"></div>';
}

function renderShop(items, inventory) {
  const grid = $("shop-grid");
  const filtered = activeCategory === "all" ? items : items.filter(i => i.category === activeCategory);
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-items">NO ITEMS IN THIS CATEGORY YET.</div>';
    return;
  }
  grid.innerHTML = filtered.map(item => {
    const owned    = inventory.includes(item.id);
    const canAfford = userCoins >= item.price;
    return `
      <div class="shop-card rarity-${item.rarity}" data-id="${item.id}">
        ${buildPreview(item)}
        <span class="rarity-badge rarity-${item.rarity}">${item.rarity}</span>
        <div class="shop-card-body">
          <div class="shop-card-name">${item.name}</div>
          <div class="shop-card-desc">${item.desc}</div>
        </div>
        <div class="shop-card-footer">
          <div class="shop-card-price"><span class="coin-icon">&#9733;</span>${item.price}</div>
          <button class="buy-btn ${owned ? 'owned' : ''}" data-id="${item.id}"
            ${owned ? 'disabled' : (!currentUser || !canAfford) ? 'disabled' : ''}>
            ${owned ? 'OWNED' : !currentUser ? 'LOG IN' : !canAfford ? 'NEED COINS' : 'BUY'}
          </button>
        </div>
      </div>`;
  }).join("");

  grid.querySelectorAll(".buy-btn:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => buyItem(btn.dataset.id));
  });
}

async function buyItem(itemId) {
  if (!currentUser) return;
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;
  if (userCoins < item.price) { toast("not enough coins.", "error"); return; }

  const btn = document.querySelector(`.buy-btn[data-id="${itemId}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "..."; }

  try {
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    if (!snap.exists()) return;
    const d       = snap.data();
    const newCoins = (d.coins || 0) - item.price;
    if (newCoins < 0) { toast("not enough coins.", "error"); return; }

    const invItem = {
      id:         item.id,
      name:       item.name,
      category:   item.category,
      rarity:     item.rarity,
      desc:       item.desc,
      purchasedAt: new Date().toISOString(),
    };
    if (item.multiplier) invItem.multiplier = item.multiplier;
    if (item.duration)   invItem.duration   = item.duration;
    if (item.color)      invItem.color      = item.color;
    if (item.emoji)      invItem.emoji      = item.emoji;

    const newInventory = [...(d.inventory || []), invItem];
    await updateDoc(doc(db, "users", currentUser.uid), {
      coins:     newCoins,
      inventory: newInventory
    });

    userCoins     = newCoins;
    userInventory = newInventory.map(i => i.id);
    $("coin-count").textContent = userCoins;
    toast("purchased " + item.name + "!", "success");
    renderShop(allItems, userInventory);
  } catch (e) {
    console.error(e);
    toast("purchase failed — try again.", "error");
    if (btn) { btn.disabled = false; btn.textContent = "BUY"; }
  }
}

async function loadShopItems() {
  try {
    const snap = await getDocs(collection(db, "shopItems"));
    if (!snap.empty) {
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      allItems = FALLBACK_ITEMS; 
    }
  } catch (e) {
    allItems = FALLBACK_ITEMS;
  }
}

document.querySelectorAll(".cat-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeCategory = tab.dataset.cat;
    renderShop(allItems, userInventory);
  });
});

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    $("coin-display").style.display  = "flex";
    $("login-prompt").style.display  = "none";
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      const d       = snap.data();
      userCoins     = d.coins || 0;
      userInventory = (d.inventory || []).map(i => i.id ?? i); 
      $("coin-count").textContent = userCoins;
    }
  } else {
    $("coin-display").style.display  = "none";
    $("login-prompt").style.display  = "";
    userCoins     = 0;
    userInventory = [];
  }
  renderShop(allItems, userInventory);
});

await loadShopItems();
renderShop(allItems, userInventory);

document.querySelectorAll(".nrg-sidebar .nav-icon").forEach(icon => {
  const cur = window.location.pathname.split("/").pop();
  if (icon.dataset.page === cur) icon.classList.add("active");
  icon.addEventListener("click", () => { if (icon.dataset.page) window.location.href = "/" + icon.dataset.page; });
});
</script>

<script src="sidebar-logic.js"></script>
</body>
