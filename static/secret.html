<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRG Console</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --bg2: #141414;
  --bg3: #1a1a1a;
  --border: #252525;
  --green: #39ff85;
  --green-dim: rgba(57,255,133,0.12);
  --yellow: #f5c842;
  --red: #ff4f4f;
  --blue: #5b9cf6;
  --cyan: #4dd9e8;
  --purple: #b57bee;
  --white: #e2e2e2;
  --dim: #555;
  --muted: #333;
  --font: 'JetBrains Mono', monospace;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--white); font-family: var(--font); }

body { display: flex; flex-direction: column; }

/* ── TITLEBAR ── */
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.titlebar-left { display: flex; align-items: center; gap: 10px; }
.dots { display: flex; gap: 6px; }
.dot {
  width: 11px; height: 11px; border-radius: 50%;
}
.dot.red    { background: #ff5f57; }
.dot.yellow { background: #febc2e; }
.dot.green  { background: #28c840; }
.title-text {
  font-size: 11px; color: var(--dim);
  letter-spacing: 0.08em;
}
.titlebar-right { display: flex; gap: 8px; align-items: center; }
.webhook-input {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: var(--font);
  font-size: 10px;
  padding: 5px 10px;
  border-radius: 3px;
  outline: none;
  width: 320px;
  transition: border-color 0.15s, color 0.15s;
}
.webhook-input:focus { border-color: var(--green); color: var(--white); }
.webhook-input::placeholder { color: var(--muted); }
.webhook-status {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--dim);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  white-space: nowrap;
}
.webhook-status.set { color: var(--green); border-color: var(--green-dim); }

/* ── TERMINAL ── */
.terminal {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.output {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px 8px;
  font-size: 13px;
  line-height: 1.7;
}
.output::-webkit-scrollbar { width: 3px; }
.output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.line { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 2px; }
.line-prompt { color: var(--green); flex-shrink: 0; user-select: none; }
.line-cmd { color: var(--white); word-break: break-all; }
.line-out { color: var(--dim); padding-left: 20px; word-break: break-all; }
.line-out.success { color: var(--green); }
.line-out.error   { color: var(--red); }
.line-out.warn    { color: var(--yellow); }
.line-out.info    { color: var(--blue); }
.line-out.system  { color: var(--cyan); }
.line-out.discord { color: var(--purple); }

.line-sep {
  border: none;
  border-top: 1px solid var(--border);
  margin: 8px 0;
}

/* ── INPUT ROW ── */
.input-row {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 10px 20px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.prompt-label {
  color: var(--green);
  font-size: 13px;
  white-space: nowrap;
  margin-right: 10px;
  user-select: none;
}
.cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--white);
  font-family: var(--font);
  font-size: 13px;
  caret-color: var(--green);
}
.cmd-input::placeholder { color: var(--muted); }

/* ── HELP TABLE ── */
.help-table { padding-left: 20px; margin: 4px 0; }
.help-row { display: flex; gap: 0; margin-bottom: 2px; }
.help-cmd  { color: var(--green); min-width: 220px; font-size: 12px; }
.help-desc { color: var(--dim);   font-size: 12px; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-left">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <span class="title-text">NRG CONSOLE — v1.0</span>
  </div>
  <div class="titlebar-right">
    <input class="webhook-input" id="webhook-url" type="text" placeholder="paste discord webhook url…" spellcheck="false" autocomplete="off">
    <span class="webhook-status" id="webhook-status">NO WEBHOOK</span>
  </div>
</div>

<div class="terminal">
  <div class="output" id="output"></div>
  <div class="input-row">
    <span class="prompt-label">nrg $&nbsp;</span>
    <input class="cmd-input" id="cmd-input" type="text" placeholder="type a command…" autocomplete="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
const out     = document.getElementById('output');
const cmdIn   = document.getElementById('cmd-input');
const whInput = document.getElementById('webhook-url');
const whStatus = document.getElementById('webhook-status');

let webhookUrl = localStorage.getItem('nrg_webhook') || '';
let history    = [];
let histIdx    = -1;
let variables  = {};

if (webhookUrl) {
  whInput.value = webhookUrl;
  setWebhookStatus(true);
}

whInput.addEventListener('change', () => {
  const v = whInput.value.trim();
  if (v.startsWith('https://discord.com/api/webhooks/') || v.startsWith('https://discordapp.com/api/webhooks/')) {
    webhookUrl = v;
    localStorage.setItem('nrg_webhook', v);
    setWebhookStatus(true);
    printOut('webhook saved.', 'success');
  } else if (v === '') {
    webhookUrl = '';
    localStorage.removeItem('nrg_webhook');
    setWebhookStatus(false);
    printOut('webhook cleared.', 'warn');
  } else {
    printOut('invalid webhook url — must start with https://discord.com/api/webhooks/', 'error');
  }
});

function setWebhookStatus(on) {
  whStatus.textContent = on ? 'WEBHOOK SET' : 'NO WEBHOOK';
  whStatus.className   = 'webhook-status' + (on ? ' set' : '');
}

function printCmd(text) {
  const row = document.createElement('div');
  row.className = 'line';
  row.innerHTML = `<span class="line-prompt">nrg $</span><span class="line-cmd">${esc(text)}</span>`;
  out.appendChild(row);
  scrollBottom();
}

function printOut(text, type = '') {
  const row = document.createElement('div');
  row.className = `line-out ${type}`;
  row.textContent = text;
  out.appendChild(row);
  scrollBottom();
}

function printRaw(html) {
  const row = document.createElement('div');
  row.className = 'line-out';
  row.innerHTML = html;
  out.appendChild(row);
  scrollBottom();
}

function printSep() {
  const hr = document.createElement('hr');
  hr.className = 'line-sep';
  out.appendChild(hr);
}

function scrollBottom() {
  out.scrollTop = out.scrollHeight;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendWebhook(content, username) {
  if (!webhookUrl) {
    printOut('no webhook set — paste one in the top bar first.', 'error');
    return false;
  }
  try {
    const body = { content: String(content) };
    if (username) body.username = username;
    const res = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok || res.status === 204) return true;
    printOut(`discord returned ${res.status} — check your webhook url.`, 'error');
    return false;
  } catch(e) {
    printOut(`failed to send: ${e.message}`, 'error');
    return false;
  }
}

function parseArgs(raw) {
  const args = [];
  let current = '';
  let inStr = false;
  let strChar = '';
  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (inStr) {
      if (ch === strChar) inStr = false;
      else current += ch;
    } else if (ch === '"' || ch === "'") {
      inStr = true; strChar = ch;
    } else if (ch === ' ' || ch === ',') {
      if (current.trim()) { args.push(current.trim()); current = ''; }
    } else {
      current += ch;
    }
  }
  if (current.trim()) args.push(current.trim());
  return args;
}

function resolveVar(val) {
  if (val.startsWith('$')) {
    const key = val.slice(1);
    return variables[key] !== undefined ? variables[key] : val;
  }
  return val;
}

let nrgBase = localStorage.getItem('nrg_base') || window.location.origin;

const NRG_PAGES = [
  { name: 'Home',     path: '/index.html' },
  { name: 'Games',    path: '/games.html' },
  { name: 'Movies',   path: '/movies.html' },
  { name: 'Music',    path: '/music.html' },
  { name: 'AI',       path: '/ai.html' },
  { name: 'Proxy',    path: '/proxy.html' },
  { name: 'Settings', path: '/settings.html' },
  { name: 'Support',  path: '/support.html' },
];

const MAINT_WORDS = ['maintenance','be back soon','down for maintenance','under construction','coming soon'];

async function checkPage(page) {
  const url = nrgBase + page.path;
  const start = performance.now();
  try {
    const res = await fetch(url, { method: 'GET', cache: 'no-store', signal: AbortSignal.timeout(6000) });
    const ms   = Math.round(performance.now() - start);
    const body = (await res.text().catch(() => '')).toLowerCase().slice(0, 512);

    if (res.ok) {
      if (MAINT_WORDS.some(w => body.includes(w))) return { symbol: '-', code: res.status, info: 'maintenance', ms };
      return { symbol: '*', code: res.status, info: 'up', ms };
    }
    if ([503,521,522,523,524].includes(res.status)) return { symbol: '-', code: res.status, info: 'maintenance', ms };
    if (res.status >= 500) return { symbol: 'X', code: res.status, info: 'server error', ms };
    return { symbol: 'X', code: res.status, info: `http ${res.status}`, ms };
  } catch(e) {
    const ms = Math.round(performance.now() - start);
    if (e.name === 'TimeoutError' || e.name === 'AbortError') return { symbol: 'X', code: 0, info: 'timeout', ms };
    return { symbol: 'X', code: 0, info: 'unreachable', ms };
  }
}

function symbolColor(s) {
  if (s === '*') return 'success';
  if (s === '-') return 'warn';
  return 'error';
}

function symbolLabel(s) {
  if (s === '*') return 'UP';
  if (s === '-') return 'MAINTENANCE';
  return 'DOWN';
}

async function runCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  history.unshift(trimmed);
  histIdx = -1;
  printCmd(trimmed);

  const match = trimmed.match(/^(\w+)\s*\(?(.*?)\)?$/);
  if (!match) {
    printOut(`unknown command: "${trimmed}" — type help() to see commands.`, 'error');
    return;
  }

  const cmd  = match[1].toLowerCase();
  const args = parseArgs(match[2]).map(a => resolveVar(a));

  switch(cmd) {

    case 'help': {
      printOut('available commands:', 'info');
      const cmds = [
        ['echo("message")',              'send a message to discord'],
        ['echo("msg", "username")',      'send with a custom username'],
        ['print("text")',                'print text to this console'],
        ['clear()',                      'clear the console'],
        ['set("varName", "value")',      'store a variable'],
        ['get("varName")',               'print a variable'],
        ['vars()',                       'list all variables'],
        ['unset("varName")',             'delete a variable'],
        ['ping()',                       'test discord webhook connection'],
        ['timestamp()',                  'print current date & time'],
        ['upper("text")',                'print text in uppercase'],
        ['lower("text")',                'print text in lowercase'],
        ['reverse("text")',              'reverse a string'],
        ['count("text")',                'count characters'],
        ['repeat("text", n)',            'repeat text n times'],
        ['math("expression")',           'evaluate a math expression'],
        ['alert("message")',             'browser alert popup'],
        ['webhook("url")',               'set discord webhook url'],
        ['history()',                    'show command history'],
        ['help()',                       'show this menu'],
        ['--- NRG STATS ---',           ''],
        ['stats()',                      'check status of all NRG pages'],
        ['check("page")',               'check a single page e.g. check("games")'],
        ['latency()',                    'measure response time for each page'],
        ['report()',                     'run full stats and send to discord'],
        ['setbase("url")',               'set the NRG base url'],
      ];
      const table = document.createElement('div');
      table.className = 'help-table';
      cmds.forEach(([c,d]) => {
        const row = document.createElement('div');
        row.className = 'help-row';
        row.innerHTML = `<span class="help-cmd">${esc(c)}</span><span class="help-desc">— ${esc(d)}</span>`;
        table.appendChild(row);
      });
      out.appendChild(table);
      scrollBottom();
      break;
    }

    case 'echo': {
      if (!args[0]) { printOut('usage: echo("message") or echo("message", "username")', 'warn'); break; }
      const msg  = args[0];
      const user = args[1] || null;
      printOut(`sending to discord${user ? ` as "${user}"` : ''}…`, 'discord');
      const ok = await sendWebhook(msg, user);
      if (ok) printOut(`✓ sent: "${msg}"`, 'success');
      break;
    }

    case 'print': {
      if (!args[0]) { printOut('usage: print("text")', 'warn'); break; }
      printOut(args[0], '');
      break;
    }

    case 'clear': {
      out.innerHTML = '';
      break;
    }

    case 'set': {
      if (!args[0] || args[1] === undefined) { printOut('usage: set("varName", "value")', 'warn'); break; }
      variables[args[0]] = args[1];
      printOut(`${args[0]} = "${args[1]}"`, 'success');
      break;
    }

    case 'get': {
      if (!args[0]) { printOut('usage: get("varName")', 'warn'); break; }
      const v = variables[args[0]];
      if (v === undefined) printOut(`"${args[0]}" is not defined`, 'error');
      else printOut(`${args[0]} = "${v}"`, '');
      break;
    }

    case 'vars': {
      const keys = Object.keys(variables);
      if (!keys.length) { printOut('no variables set.', 'warn'); break; }
      keys.forEach(k => printOut(`${k} = "${variables[k]}"`, ''));
      break;
    }

    case 'unset': {
      if (!args[0]) { printOut('usage: unset("varName")', 'warn'); break; }
      if (variables[args[0]] === undefined) { printOut(`"${args[0]}" is not defined`, 'error'); break; }
      delete variables[args[0]];
      printOut(`${args[0]} deleted.`, 'success');
      break;
    }

    case 'ping': {
      if (!webhookUrl) { printOut('no webhook set.', 'error'); break; }
      printOut('pinging discord…', 'discord');
      const ok = await sendWebhook('🟢 NRG Console ping — webhook is working.');
      if (ok) printOut('✓ webhook is alive.', 'success');
      break;
    }

    case 'timestamp': {
      const now = new Date();
      printOut(now.toLocaleString() + ' — ' + now.toISOString(), 'info');
      break;
    }

    case 'upper': {
      if (!args[0]) { printOut('usage: upper("text")', 'warn'); break; }
      printOut(args[0].toUpperCase());
      break;
    }

    case 'lower': {
      if (!args[0]) { printOut('usage: lower("text")', 'warn'); break; }
      printOut(args[0].toLowerCase());
      break;
    }

    case 'reverse': {
      if (!args[0]) { printOut('usage: reverse("text")', 'warn'); break; }
      printOut(args[0].split('').reverse().join(''));
      break;
    }

    case 'count': {
      if (!args[0]) { printOut('usage: count("text")', 'warn'); break; }
      printOut(`${args[0].length} character${args[0].length !== 1 ? 's' : ''}`);
      break;
    }

    case 'repeat': {
      if (!args[0] || !args[1]) { printOut('usage: repeat("text", n)', 'warn'); break; }
      const n = parseInt(args[1]);
      if (isNaN(n) || n < 1 || n > 50) { printOut('n must be a number between 1 and 50.', 'error'); break; }
      printOut(args[0].repeat(n));
      break;
    }

    case 'math': {
      if (!args[0]) { printOut('usage: math("expression") e.g. math("2+2")', 'warn'); break; }
      try {
        const safe = args[0].replace(/[^0-9+\-*/().%^ ]/g, '');
        const result = Function('"use strict"; return (' + safe + ')')();
        printOut(`= ${result}`, 'success');
      } catch {
        printOut('invalid math expression.', 'error');
      }
      break;
    }

    case 'alert': {
      if (!args[0]) { printOut('usage: alert("message")', 'warn'); break; }
      window.alert(args[0]);
      printOut(`alert shown: "${args[0]}"`, 'success');
      break;
    }

    case 'webhook': {
      if (!args[0]) { printOut('usage: webhook("https://discord.com/api/webhooks/...")','warn'); break; }
      whInput.value = args[0];
      whInput.dispatchEvent(new Event('change'));
      break;
    }

    case 'history': {
      if (!history.length) { printOut('no history yet.', 'warn'); break; }
      history.forEach((h, i) => printOut(`${i + 1}  ${h}`, 'info'));
      break;
    }

    default:
      printOut(`unknown command: "${cmd}" — type help() to see commands.`, 'error');
  }
}

cmdIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    runCommand(cmdIn.value);
    cmdIn.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; cmdIn.value = history[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; cmdIn.value = history[histIdx]; }
    else { histIdx = -1; cmdIn.value = ''; }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    out.innerHTML = '';
  }
});

document.addEventListener('click', () => cmdIn.focus());

printOut('NRG Console — type help() to see all commands.', 'system');
printOut('paste your discord webhook url in the top bar to enable echo().', 'dim');
printSep();
</script>
</body>
</html>
